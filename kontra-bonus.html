  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ointer-events:none;z-index:1;background:radial-gradient(closest-side,rgba(47,107,255,.5),rgba(47,107,255,0));animation:drift 11s ease-in-out infinite\"><\u002Fdiv>\n<div style=\"position:absolute;bottom:-60px;right:-40px;width:210px;height:210px;border-radius:50%;pointer-events:none;z-index:1;background:radial-gradient(closest-side,rgba(92,233,255,.28),rgba(92,233,255,0));animation:drift 14s ease-in-out infinite reverse\"><\u002Fdiv>\n<div style=\"position:absolute;inset:0;pointer-events:none;z-index:3;background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,rgba(0,0,0,0) 1px 4px);opacity:.45\"><\u002Fdiv>\n\n<sc-if value=\"{{ atHome }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"position:relative;z-index:6;flex:none;min-height:100%;display:flex;flex-direction:column\">\n<div style=\"position:relative;overflow:hidden;margin:2px 0;padding:16px 12px 18px;border-radius:20px;background:linear-gradient(160deg,#2246d8,#0b1252);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),inset 0 0 0 1.5px rgba(150,190,255,.4),0 18px 40px rgba(20,60,220,.4);animation:rise .4s ease-out both\">\n<span style=\"position:absolute;top:0;left:-40%;width:40%;height:100%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.28),rgba(255,255,255,0));animation:shine 4.4s ease-in-out infinite;pointer-events:none\"><\u002Fspan>\n<div style=\"font:600 10px/1.4 'Fira Mono',monospace;letter-spacing:.3em;color:#7ef0ff;text-transform:uppercase\">Ποιος το ειπε ρε παιδια<\u002Fdiv>\n<h1 style=\"margin:8px 0 0;font:600 22px/1 'Anek Greek',sans-serif;color:#cfe2ff;letter-spacing:.3em\">ΚΟΝΤΡΑ<\u002Fh1>\n<h1 style=\"margin:1px 0 0;font:800 50px/.96 'Anek Greek',sans-serif;color:#fff;letter-spacing:-.01em;text-shadow:0 0 26px rgba(120,200,255,.9),0 4px 0 rgba(6,14,60,.6)\">ΜΠΟΝΟΥΣ<span style=\"color:#5ce9ff\">!<\u002Fspan><\u002Fh1>\n<div style=\"margin-top:12px;display:flex;justify-content:center;gap:7px\">\n<span style=\"width:26px;height:4px;border-radius:2px;background:#5ce9ff;box-shadow:0 0 12px #5ce9ff;animation:breathe 1.6s ease-in-out infinite\"><\u002Fspan>\n<span style=\"width:26px;height:4px;border-radius:2px;background:#5ce9ff;box-shadow:0 0 12px #5ce9ff;animation:breathe 1.6s ease-in-out .2s infinite\"><\u002Fspan>\n<span style=\"width:26px;height:4px;border-radius:2px;background:#5ce9ff;box-shadow:0 0 12px #5ce9ff;animation:breathe 1.6s ease-in-out .4s infinite\"><\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex:none;position:relative;height:196px;margin:12px 0 2px;display:flex;align-items:flex-end;justify-content:center\">\n<div style=\"position:absolute;bottom:10px;width:216px;height:130px;border-radius:50%;background:radial-gradient(closest-side,rgba(92,233,255,.42),rgba(92,233,255,0))\"><\u002Fdiv>\n<img src=\"3c13b138-ce5a-40ba-941e-336a27b92f23\" alt=\"Ο κοντρα μαν\" style=\"position:relative;height:196px;width:auto;filter:drop-shadow(0 12px 24px rgba(0,0,0,.65)) drop-shadow(0 0 18px rgba(70,150,255,.45));animation:floaty 4.6s ease-in-out infinite\">\n<\u002Fdiv>\n\n<p style=\"margin:4px 0 4px;font:400 15px/1.55 'Anek Greek',sans-serif;color:#a8c0f0;text-wrap:pretty;animation:rise .5s ease-out .06s both\">Μια κατηγορια. Τεσσερις φακελοι.<br><b style=\"font-weight:700;color:#dbe9ff\">Καμια δεν ειναι δικη σας.<\u002Fb><\u002Fp>\n\n<button style=\"display:flex;align-items:center;justify-content:center;gap:9px;margin:18px auto 0;padding:10px 18px;border:0;border-radius:11px;cursor:pointer;background:linear-gradient(180deg,rgba(104,140,255,.26),rgba(18,34,96,.44));color:#cfe0ff;font:700 11px 'Fira Mono',monospace;letter-spacing:.16em;box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 0 0 1.5px rgba(120,190,255,.45)\" style-active=\"transform:translateY(2px)\" sc-camel-on-click=\"{{ goSettings }}\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"15\" height=\"15\" aria-hidden=\"true\"><path fill=\"currentColor\" d=\"M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z\"><\u002Fpath><\u002Fsvg>ΡΥΘΜΙΣΕΙΣ<\u002Fbutton>\n<p style=\"margin:9px 0 0;font:500 10px/1.5 'Fira Mono',monospace;letter-spacing:.1em;color:rgba(190,212,255,.55)\">{{ setSummary }}<\u002Fp>\n\n<div style=\"flex:1;min-height:16px\"><\u002Fdiv>\n<button style=\"{{ ctaStart }}\" style-active=\"transform:translateY(4px) scale(.995)\" sc-camel-on-click=\"{{ start }}\">\n<span style=\"position:absolute;top:0;left:-40%;width:40%;height:100%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.4),rgba(255,255,255,0));animation:shine 3.2s ease-in-out infinite;pointer-events:none\"><\u002Fspan>\n<span style=\"position:absolute;left:10px;top:10px;width:7px;height:7px;border-left:2px solid rgba(160,240,255,.85);border-top:2px solid rgba(160,240,255,.85)\"><\u002Fspan>\n<span style=\"position:absolute;right:10px;bottom:10px;width:7px;height:7px;border-right:2px solid rgba(160,240,255,.85);border-bottom:2px solid rgba(160,240,255,.85)\"><\u002Fspan>\n<span style=\"position:relative\">ΑΝΟΙΞΕ ΤΟΥΣ ΦΑΚΕΛΟΥΣ<\u002Fspan>\n<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ atSettings }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:relative;z-index:6;flex:none;min-height:100%;display:flex;flex-direction:column;animation:rise .35s ease-out both\">\n<div style=\"padding:18px 16px;border-radius:20px 20px 0 0;background:linear-gradient(160deg,#2246d8,#0b1252);box-shadow:inset 0 2px 0 rgba(255,255,255,.28),inset 0 0 0 1.5px rgba(150,190,255,.4)\">\n<h2 style=\"margin:0;text-align:center;font:800 28px/1.1 'Anek Greek',sans-serif;color:#fff;text-shadow:0 2px 18px rgba(80,160,255,.6)\">Ρυθμισεις<\u002Fh2>\n<\u002Fdiv>\n<div style=\"padding:16px 16px 20px;border-radius:0 0 20px 20px;background:linear-gradient(#10225f,#070d33);box-shadow:inset 0 0 0 1.5px rgba(120,165,255,.3),0 14px 30px rgba(0,0,0,.45);text-align:center\">\n<h3 style=\"margin:0 0 8px;font:700 18px/1.25 'Anek Greek',sans-serif;color:#7ef0ff\">Το ΟΠΑ!<\u002Fh3>\n<div style=\"display:flex;gap:8px;justify-content:center\">\n<sc-for list=\"{{ setOpa }}\" as=\"o\" hint-placeholder-count=\"2\">\n<button style=\"{{ o.style }}\" style-active=\"transform:translateY(2px)\" sc-camel-on-click=\"{{ o.on }}\">{{ o.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<sc-if value=\"{{ opaTipOn }}\" hint-placeholder-val=\"{{ false }}\">\n<p style=\"margin:10px 0 0;padding:10px 12px;border-radius:12px;background:rgba(255,210,74,.1);box-shadow:0 0 0 1.5px rgba(255,210,74,.45);font:400 13.5px/1.5 'Anek Greek',sans-serif;color:#ffe9a8;animation:flashUp .3s ease-out both\">Φιλικη συμβουλη: χωρις ΟΠΑ, βαλτε 2 γυρους λογου. Αλλιως καποιος θα μεινει με την απαντηση στο στομα.<\u002Fp>\n<\u002Fsc-if>\n<h3 style=\"margin:20px 0 4px;font:700 18px/1.25 'Anek Greek',sans-serif;color:#7ef0ff\">Γυροι λογου<\u002Fh3>\n<p style=\"margin:0 0 8px;font:400 13.5px/1.5 'Anek Greek',sans-serif;color:#a8c0f0\">Ποσες φορες μιλαει η καθε πλευρα.<\u002Fp>\n<div style=\"display:flex;gap:8px;justify-content:center\">\n<sc-for list=\"{{ setRounds }}\" as=\"o\" hint-placeholder-count=\"3\">\n<button style=\"{{ o.style }}\" style-active=\"transform:translateY(2px)\" sc-camel-on-click=\"{{ o.on }}\">{{ o.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<h3 style=\"margin:20px 0 8px;font:700 18px/1.25 'Anek Greek',sans-serif;color:#7ef0ff\">Χρονος λογου<\u002Fh3>\n<div style=\"display:flex;gap:8px;justify-content:center\">\n<sc-for list=\"{{ setTimes }}\" as=\"o\" hint-placeholder-count=\"3\">\n<button style=\"{{ o.style }}\" style-active=\"transform:translateY(2px)\" sc-camel-on-click=\"{{ o.on }}\">{{ o.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<h3 style=\"margin:20px 0 4px;font:700 18px/1.25 'Anek Greek',sans-serif;color:#7ef0ff\">Η δικη<\u002Fh3>\n<p style=\"margin:0 0 8px;font:400 13.5px/1.5 'Anek Greek',sans-serif;color:#a8c0f0\">{{ modeNote }}<\u002Fp>\n<div style=\"display:flex;gap:8px;justify-content:center\">\n<sc-for list=\"{{ setRandom }}\" as=\"o\" hint-placeholder-count=\"2\">\n<button style=\"{{ o.style }}\" style-active=\"transform:translateY(2px)\" sc-camel-on-click=\"{{ o.on }}\">{{ o.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<h3 style=\"margin:20px 0 8px;font:700 18px/1.25 'Anek Greek',sans-serif;color:#7ef0ff\">Αλλο παιχνιδι<\u002Fh3>\n<div style=\"display:flex;flex-direction:column;gap:8px;align-items:center\">\n<a href=\"index.html\" style=\"display:block;padding:13px 14px;border-radius:13px;background:linear-gradient(180deg,rgba(104,140,255,.22),rgba(18,34,96,.42));box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 0 0 1.5px rgba(120,160,255,.32);font:700 16px 'Anek Greek',sans-serif;color:#dce8ff\">Κοντρα →<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1;min-height:16px\"><\u002Fdiv>\n<button style=\"display:flex;align-items:center;justify-content:center;width:auto;min-width:200px;max-width:290px;align-self:center;margin-left:auto;margin-right:auto;margin-top:14px;padding:16px;border:0;border-radius:14px;cursor:pointer;background:linear-gradient(180deg,rgba(104,140,255,.26),rgba(18,34,96,.44));color:#cfe0ff;font:700 19px 'Anek Greek',sans-serif;box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 0 0 1.5px rgba(120,160,255,.35)\" style-active=\"transform:translateY(3px)\" sc-camel-on-click=\"{{ goBack }}\">Πισω<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ atRules }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:relative;z-index:6;flex:none;min-height:100%;display:flex;flex-direction:column;animation:rise .35s ease-out both\">\n<div style=\"padding:20px 16px;border-radius:20px 20px 0 0;background:linear-gradient(160deg,#2246d8,#0b1252);box-shadow:inset 0 2px 0 rgba(255,255,255,.28),inset 0 0 0 1.5px rgba(150,190,255,.4)\">\n<h2 style=\"margin:0;font:700 26px/1.2 'Anek Greek',sans-serif;color:#fff;text-align:center;text-wrap:pretty;text-shadow:0 2px 18px rgba(80,160,255,.6)\">Συγχαρητήρια! Μπήκες στην κόντρα: Μπόνους!<\u002Fh2>\n<\u002Fdiv>\n<div style=\"padding:18px 16px 20px;border-radius:0 0 20px 20px;background:linear-gradient(#10225f,#070d33);box-shadow:inset 0 0 0 1.5px rgba(120,165,255,.3),0 14px 30px rgba(0,0,0,.45);text-align:left\">\n<p style=\"margin:0;font:400 14.5px/1.65 'Anek Greek',sans-serif;color:#dce8ff;text-wrap:pretty\">Οι κανόνες της κλασσικής κόντρας ισχύουν και εδώ: δικαστής, εισαγγελέας, υπεράσπιση, ένορκοι. Ο νικητής της κόντρας παίρνει 1 πόντο. Μόνο που, μετά από κάθε κόντρα, γυρνάει ο τροχός του μπόνους.<\u002Fp>\n\n<h3 style=\"margin:22px 0 7px;font:700 20px/1.25 'Anek Greek',sans-serif;color:#7ef0ff\">Πως δουλεύει το μπόνους?<\u002Fh3>\n<p style=\"margin:0;font:400 14.5px/1.65 'Anek Greek',sans-serif;color:#dce8ff;text-wrap:pretty\">Διαλέγετε μία κατηγορία. Μέσα έχει τέσσερις φακέλους: τρία διάσημα πρόσωπα και «ο κόσμος». Κάθε υπόθεση του παιχνιδιού την έχει πει ένας από τους τέσσερις.<\u002Fp>\n<p style=\"margin:10px 0 0;font:400 14.5px/1.65 'Anek Greek',sans-serif;color:#dce8ff;text-wrap:pretty\">Μετά από κάθε κόντρα που παίχτηκε, γυρνάει ο τροχός: <b style=\"color:#fff\">Μπόνους ή Τίποτα<\u002Fb>. Ο τροχός δεν δίνει πόντους ούτε πολλαπλασιάζει τίποτα· απλά λέει αν παίζεται μπόνους. Αν βγει μπόνους, μοιράζεται το κινητό και ο καθένας μαντεύει κρυφά ποιος είπε την υπόθεση. Στο τέλος ανοίγουν όλα μαζί. Αν η υπόθεση καεί χωρίς κόντρα, τροχός δεν γυρνάει.<\u002Fp>\n<p style=\"margin:10px 0 0;font:400 14.5px/1.65 'Anek Greek',sans-serif;color:#dce8ff;text-wrap:pretty\">Εάν παιχτεί κόντρα, ο νικητής θεωρείται ότι έχει <b style=\"color:#ffd24a\">ρέντα<\u002Fb>: αν βρει σωστά, παίρνει τους διπλάσιους πόντους απ' ό,τι θα έπαιρνε! Αλλά, αν χάσει, κινδυνεύει να χάσει τους μισούς από αυτούς.<\u002Fp>\n\n<h3 style=\"margin:22px 0 7px;font:700 20px/1.25 'Anek Greek',sans-serif;color:#7ef0ff\">Τι εννοείς κούκλε?<\u002Fh3>\n<p style=\"margin:0;font:400 14.5px/1.65 'Anek Greek',sans-serif;color:#dce8ff;text-wrap:pretty\">Αν βρεις ένα σωστά, παίρνεις 1 πόντο. Αν βρεις 2 σωστά, 2 πόντους. 3? 4 πόντους. 4 σερί? 8 πόντους. Προφανώς, όσο αυξάνονται οι πόντοι που μπορείς να πάρεις, αυξάνονται και οι πόντοι που μπορείς να χάσεις: η ζημιά είναι πάντα το μισό απ' το σερί που κυνηγάς. Κυνηγάς 4, χάνεις 2. Κυνηγάς 8, χάνεις 4. Κάτω από το μηδέν δεν πας: για να χάσεις, πρέπει να έχεις.<\u002Fp>\n\n<h3 style=\"margin:22px 0 7px;font:700 20px/1.25 'Anek Greek',sans-serif;color:#ff9ec5\">Προσοχή!<\u002Fh3>\n<p style=\"margin:0;font:400 14.5px/1.65 'Anek Greek',sans-serif;color:#dce8ff;text-wrap:pretty\">Όταν βγει μπόνους, μαντεύουν όλοι. Δεν υπάρχει πάσο. Το σερί χάνεται μόνο με λάθος μαντεψιά — οι γύροι χωρίς μπόνους δεν το σβήνουν.<\u002Fp>\n\n<h3 style=\"margin:22px 0 7px;font:700 20px/1.25 'Anek Greek',sans-serif;color:#ffd24a\">Πρώτος στους 92<\u002Fh3>\n<p style=\"margin:0;font:400 14.5px/1.65 'Anek Greek',sans-serif;color:#dce8ff\">92 ακριβώς. Αν βαρεθήκατε πιο πριν, η λήξη είναι στον πίνακα και στην έδρα: κερδίζει ο πρώτος.<\u002Fp>\n\n<h3 style=\"margin:22px 0 7px;font:700 20px/1.25 'Anek Greek',sans-serif;color:#cfe2ff\">Έχεις Ινστα?<\u002Fh3>\n<p style=\"margin:0;font:400 14.5px/1.65 'Anek Greek',sans-serif;color:#dce8ff\">Χα χα χα... Όχι. Μόνο Skype.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1;min-height:16px\"><\u002Fdiv>\n<button style=\"display:flex;align-items:center;justify-content:center;width:auto;min-width:200px;max-width:290px;align-self:center;margin-left:auto;margin-right:auto;margin-top:14px;padding:16px;border:0;border-radius:14px;cursor:pointer;background:linear-gradient(180deg,rgba(104,140,255,.26),rgba(18,34,96,.44));color:#cfe0ff;font:700 19px 'Anek Greek',sans-serif;box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 0 0 1.5px rgba(120,160,255,.35)\" style-active=\"transform:translateY(3px)\" sc-camel-on-click=\"{{ goBack }}\">Πισω<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ atDisclaimer }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:relative;z-index:6;flex:none;min-height:100%;display:flex;flex-direction:column;animation:rise .35s ease-out both\">\n<p style=\"flex:none;margin:0 0 10px;font:600 10px/1.4 'Fira Mono',monospace;letter-spacing:.24em;color:#ffd24a;text-transform:uppercase\">Μικρη ομολογια<\u002Fp>\n<div style=\"flex:none;margin:0 auto 6px;display:flex;justify-content:center\">\n<img src=\"29342d52-f8bd-4cda-8b1d-d5d0281c199a\" alt=\"\" style=\"height:150px;width:auto;filter:drop-shadow(0 10px 20px rgba(0,0,0,.6))\">\n<\u002Fdiv>\n<div style=\"padding:18px 16px;border-radius:18px;background:linear-gradient(#10225f,#070d33);box-shadow:inset 0 2px 0 rgba(255,255,255,.14),inset 0 0 0 1.5px rgba(255,210,74,.3),0 14px 30px rgba(0,0,0,.45);text-align:left\">\n<p style=\"margin:0;font:400 14.5px/1.65 'Anek Greek',sans-serif;color:#dce8ff;text-wrap:pretty\">Οι υποθέσεις που θα δείτε σε αυτό το παιχνίδι έχουν πειραχθεί λίγο, δεν θα σας πω ψέματα. Είναι πολύ δύσκολο να βρεις υποθέσεις μίας με δύο προτάσεων.<\u002Fp>\n<p style=\"margin:14px 0 0;font:400 14.5px/1.65 'Anek Greek',sans-serif;color:#dce8ff;text-wrap:pretty\">Πολλές υποθέσεις επίσης τις έχω μαζέψει με τη βοήθεια του AI. Οπότε σε περίπτωση που βρείτε μια υπόθεση που δεν ανήκει στο όνομα που έχω βάλει, σας παρακαλώ να με ενημερώσετε για να την αλλάξω άμεσα.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1;min-height:16px\"><\u002Fdiv>\n<button style=\"display:flex;align-items:center;justify-content:center;width:auto;min-width:200px;max-width:290px;align-self:center;margin-left:auto;margin-right:auto;margin-top:14px;padding:16px;border:0;border-radius:14px;cursor:pointer;background:linear-gradient(180deg,rgba(104,140,255,.26),rgba(18,34,96,.44));color:#cfe0ff;font:700 19px 'Anek Greek',sans-serif;box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 0 0 1.5px rgba(120,160,255,.35)\" style-active=\"transform:translateY(3px)\" sc-camel-on-click=\"{{ goBack }}\">Το διαβασα<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ atFolders }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:relative;z-index:6;flex:none;min-height:100%;display:flex;flex-direction:column;animation:rise .35s ease-out both\">\n<h2 style=\"flex:none;margin:0 0 6px;font:700 29px/1.12 'Anek Greek',sans-serif;color:#f2f7ff;text-shadow:0 2px 18px rgba(80,160,255,.5)\">Ποια κατηγορια;<\u002Fh2>\n<div style=\"flex:none;display:flex;flex-direction:column;gap:10px\">\n<sc-for list=\"{{ catCards }}\" as=\"c\" hint-placeholder-count=\"5\">\n<button style=\"{{ c.style }}\" style-active=\"transform:translateY(3px) scale(.99)\" sc-camel-on-click=\"{{ c.on }}\">\n<span style=\"{{ c.tickStyle }}\">{{ c.tick }}<\u002Fspan>\n<span style=\"display:block;font:600 9.5px/1.4 'Fira Mono',monospace;letter-spacing:.2em;color:#7ef0ff;text-transform:uppercase\">{{ c.topic }}<\u002Fspan>\n<span style=\"display:block;margin-top:3px;padding-right:30px;font:800 21px/1.12 'Anek Greek',sans-serif;color:#fff\">{{ c.nick }}<\u002Fspan>\n<span style=\"display:block;margin-top:4px;font:400 12.5px/1.4 'Anek Greek',sans-serif;color:rgba(200,218,255,.75)\">{{ c.note }}<\u002Fspan>\n<span style=\"display:flex;flex-wrap:wrap;gap:5px;margin-top:10px\">\n<sc-for list=\"{{ c.people }}\" as=\"p\" hint-placeholder-count=\"4\">\n<span style=\"{{ p.style }}\">{{ p.name }}<\u002Fspan>\n<\u002Fsc-for>\n<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"flex:1;min-height:16px\"><\u002Fdiv>\n<button disabled=\"{{ catPending }}\" style=\"{{ catBtn }}\" style-active=\"transform:translateY(4px)\" sc-camel-on-click=\"{{ catGo }}\">\n<span style=\"position:relative\">ΠΑΜΕ ΣΤΑ ΟΝΟΜΑΤΑ<\u002Fspan>\n<\u002Fbutton>\n<p style=\"flex:none;margin:11px 0 0;font:500 9px/1.7 'Fira Mono',monospace;letter-spacing:.1em;color:rgba(190,212,255,.45)\">{{ catOps }}<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ atIntro }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:relative;z-index:6;flex:none;min-height:100%;display:flex;flex-direction:column;animation:rise .35s ease-out both\">\n<div style=\"flex:none;display:flex;align-items:flex-start;justify-content:space-between;gap:10px\">\n<p style=\"margin:0 0 10px;text-align:left;font:600 10px/1.4 'Fira Mono',monospace;letter-spacing:.24em;color:#5ce9ff;text-transform:uppercase\">Στο τραπεζι · <b style=\"color:#fff\">{{ introCount }}<\u002Fb><\u002Fp>\n<button style=\"{{ draftChipBtn }}\" style-active=\"transform:scale(.92)\" sc-camel-on-click=\"{{ openPalette }}\">◆<\u002Fbutton>\n<\u002Fdiv>\n<h2 style=\"margin:0 0 8px;font:700 28px/1.12 'Anek Greek',sans-serif;color:#f2f7ff;text-shadow:0 2px 18px rgba(80,160,255,.5)\">Ποιοι καθεστε;<\u002Fh2>\n<p style=\"margin:0 0 14px;font:400 14.5px/1.55 'Anek Greek',sans-serif;color:#a8c0f0;text-wrap:pretty\">Ενας ενας: ονομα, προσθεσε, δωσε το κινητο παραπερα.<\u002Fp>\n<div style=\"padding:8px;border-radius:17px;background:linear-gradient(#153ab5,#0a1a63);box-shadow:inset 0 2px 0 rgba(255,255,255,.22),0 0 0 1.5px rgba(130,175,255,.35),0 12px 26px rgba(10,30,120,.5)\">\n<input ref=\"{{ nameRef }}\" sc-camel-on-input=\"{{ onNameInput }}\" sc-camel-on-key-down=\"{{ nameKey }}\" maxlength=\"14\" autocomplete=\"off\" placeholder=\"Το ονομα σου\" style=\"display:block;box-sizing:border-box;width:100%;height:auto;min-height:60px;padding:14px 18px;line-height:1.6;border:0;border-radius:11px;background:linear-gradient(#fbfdff,#dfe9ff);color:#08112e;font:700 20px 'Anek Greek',sans-serif;text-align:center;outline:none;-webkit-appearance:none;box-shadow:inset 0 2px 8px rgba(8,17,46,.25)\">\n<\u002Fdiv>\n<button disabled=\"{{ nameEmpty }}\" style=\"{{ nameBtnStyle }}\" style-active=\"transform:translateY(3px)\" sc-camel-on-click=\"{{ addName }}\">Προσθεσε στο τραπεζι<\u002Fbutton>\n<sc-if value=\"{{ hasNames }}\" hint-placeholder-val=\"{{ false }}\">\n<p style=\"margin:20px 0 9px;font:500 9px/1.7 'Fira Mono',monospace;letter-spacing:.1em;color:rgba(190,212,255,.5)\">ΠΑΤΑ ΕΝΑ ΟΝΟΜΑ ΓΙΑ ΝΑ ΤΟ ΣΒΗΣΕΙΣ<\u002Fp>\n<\u002Fsc-if>\n<div style=\"display:flex;flex-wrap:wrap;gap:7px;justify-content:center\">\n<sc-for list=\"{{ namePills }}\" as=\"p\" hint-placeholder-count=\"2\">\n<button style=\"{{ p.style }}\" style-active=\"transform:translateY(2px) scale(.97)\" sc-camel-on-click=\"{{ p.on }}\">{{ p.name }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"flex:1;min-height:16px\"><\u002Fdiv>\n<sc-if value=\"{{ canStart }}\" hint-placeholder-val=\"{{ false }}\">\n<button style=\"{{ endBtnStyle }}\" style-active=\"transform:translateY(4px)\" sc-camel-on-click=\"{{ endNaming }}\">Τελος — παμε παιχνιδι<\u002Fbutton>\n<\u002Fsc-if>\n<p style=\"margin:11px 0 0;font:500 9px/1.7 'Fira Mono',monospace;letter-spacing:.1em;color:rgba(190,212,255,.45)\">{{ introCount }} ΣΤΟ ΤΡΑΠΕΖΙ · ΘΕΛΕΙ 4+<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ atTooFew }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:relative;z-index:6;flex:none;min-height:100%;display:flex;flex-direction:column;justify-content:center;animation:rise .35s ease-out both\">\n<p style=\"flex:none;margin:0 0 12px;font:600 10px/1.4 'Fira Mono',monospace;letter-spacing:.24em;color:#5ce9ff;text-transform:uppercase\">Το τραπεζι δεν ανοιγει<\u002Fp>\n<div style=\"flex:none;margin:0 auto 14px;width:210px;height:126px;display:flex;align-items:flex-end;justify-content:center\">\n<img src=\"29342d52-f8bd-4cda-8b1d-d5d0281c199a\" alt=\"\" style=\"max-width:100%;max-height:100%;filter:drop-shadow(0 8px 18px rgba(0,0,0,.6));animation:wobble 3.4s ease-in-out infinite\">\n<\u002Fdiv>\n<h2 style=\"flex:none;margin:0 0 10px;font:700 30px/1.12 'Anek Greek',sans-serif;color:#f2f7ff\">Δεν φτανετε<\u002Fh2>\n<p style=\"flex:none;margin:0 0 22px;font:400 15px/1.55 'Anek Greek',sans-serif;color:#a8c0f0;text-wrap:pretty\">Ειστε <b style=\"color:#fff\">{{ introCount }}<\u002Fb>. Θελει τουλαχιστον <b style=\"color:#fff\">4<\u002Fb>: δικαστης, εισαγγελεας, υπερασπιση και ενας ενορκος.<\u002Fp>\n<button style=\"{{ ctaBlue }}\" style-active=\"transform:translateY(4px)\" sc-camel-on-click=\"{{ backToNames }}\">Μαζευω κι αλλους<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ atRoundStart }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:relative;z-index:6;flex:none;min-height:100%;display:flex;flex-direction:column;animation:rise .35s ease-out both\">\n<p style=\"margin:0 0 6px;font:600 10px/1.4 'Fira Mono',monospace;letter-spacing:.24em;color:#5ce9ff;text-transform:uppercase\">Υποθεση Νο <b style=\"color:#fff\">{{ opNo }}<\u002Fb><\u002Fp>\n<div style=\"flex:none;position:relative;margin:18px auto 6px;width:132px;height:132px;display:flex;align-items:center;justify-content:center\">\n<div style=\"position:absolute;inset:8px;border-radius:50%;box-shadow:0 0 0 2px rgba(92,233,255,.5);animation:ringPulse 2.4s ease-out infinite\"><\u002Fdiv>\n<div style=\"position:absolute;inset:14px;border-radius:50%;background:linear-gradient(160deg,#2246d8,#0a1252);box-shadow:inset 0 2px 0 rgba(255,255,255,.28),0 14px 30px rgba(12,40,140,.6)\"><\u002Fdiv>\n<div style=\"position:absolute;inset:14px;border-radius:50%;overflow:hidden\">\n<span style=\"position:absolute;top:0;left:-40%;width:40%;height:100%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.3),rgba(255,255,255,0));animation:shine 3.6s ease-in-out infinite\"><\u002Fspan>\n<\u002Fdiv>\n<span style=\"position:relative;font:700 46px/1 'Fira Mono',monospace;color:#fff;text-shadow:0 0 22px rgba(120,200,255,.9)\">{{ opNoPad }}<\u002Fspan>\n<\u002Fdiv>\n<p style=\"flex:none;margin:14px 0 0;font:600 9px/1.4 'Fira Mono',monospace;letter-spacing:.3em;color:#5ce9ff;text-transform:uppercase\">Ο δικαστης<\u002Fp>\n<div style=\"flex:none;margin:10px 0 12px;display:flex;justify-content:center\">\n<span style=\"{{ judgeChip }}\">{{ judgeName }}<\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin:0 0 16px;font:400 14.5px/1.55 'Anek Greek',sans-serif;color:#a8c0f0\">Παρε το κινητο. Εσυ μοιραζεις αυτη την υποθεση.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:7px;justify-content:center\">\n<sc-for list=\"{{ alivePills }}\" as=\"p\" hint-placeholder-count=\"4\">\n<span style=\"{{ p.style }}\">{{ p.name }}<\u002Fspan>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"flex:1;min-height:14px\"><\u002Fdiv>\n<button style=\"{{ ctaCyan }}\" style-active=\"transform:translateY(4px)\" sc-camel-on-click=\"{{ toHearing }}\">\n<span style=\"position:absolute;top:0;left:-40%;width:40%;height:100%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.45),rgba(255,255,255,0));animation:shine 3.4s ease-in-out infinite;pointer-events:none\"><\u002Fspan>\n<span style=\"position:relative\">ΕΤΟΙΜΟΙ!<\u002Fspan>\n<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ atEyes }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:relative;z-index:6;flex:none;min-height:100%;display:flex;flex-direction:column;justify-content:center;animation:rise .35s ease-out both\">\n<div style=\"flex:none;font:800 33px/1.06 'Anek Greek',sans-serif;color:#fff;text-shadow:0 0 26px rgba(120,200,255,.85),0 3px 0 rgba(6,14,60,.6);animation:popIn .4s cubic-bezier(.2,1.4,.4,1) both\">Ησυχια στο Δικαστηριο!<\u002Fdiv>\n<p style=\"flex:none;margin:10px 0 34px;font:600 11px/1.4 'Fira Mono',monospace;letter-spacing:.26em;color:#5ce9ff;text-transform:uppercase\">μιλαει μονο ο δικαστης<\u002Fp>\n<div style=\"flex:none;display:flex;justify-content:center;gap:26px;margin:0 0 22px\">\n<span style=\"width:46px;height:23px;border-bottom:5px solid #5ce9ff;border-radius:0 0 46px 46px;box-shadow:0 8px 14px -6px rgba(92,233,255,.6);animation:breathe 2.4s ease-in-out infinite\"><\u002Fspan>\n<span style=\"width:46px;height:23px;border-bottom:5px solid #5ce9ff;border-radius:0 0 46px 46px;box-shadow:0 8px 14px -6px rgba(92,233,255,.6);animation:breathe 2.4s ease-in-out infinite\"><\u002Fspan>\n<\u002Fdiv>\n<p style=\"flex:none;margin:0 0 30px;font:700 26px/1.25 'Anek Greek',sans-serif;color:#f2f7ff\">Ολοι κλεινουν τα ματια<\u002Fp>\n<button style=\"{{ ctaBlue }}\" style-active=\"transform:translateY(4px)\" sc-camel-on-click=\"{{ toAccuse }}\">ΕΚΛΕΙΣΑΝ!<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ atAccuse }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:relative;z-index:6;flex:none;min-height:100%;display:flex;flex-direction:column;animation:rise .35s ease-out both\">\n<p style=\"margin:0 0 10px;font:600 10px/1.4 'Fira Mono',monospace;letter-spacing:.24em;color:#5ce9ff;text-transform:uppercase\">Διαβασε την υποθεση δυνατα<\u002Fp>\n<div style=\"position:relative;padding:24px 20px;border-radius:18px;background:linear-gradient(#f7faff,#d9e6ff);box-shadow:0 18px 36px rgba(2,8,40,.55),inset 0 0 0 1.5px rgba(255,255,255,.9);animation:popIn .3s ease-out both\">\n<p style=\"margin:0;font:500 19px/1.45 'Anek Greek',sans-serif;color:#08112e;text-wrap:pretty\">{{ opinion }}<\u002Fp>\n<\u002Fdiv>\n<p style=\"margin:16px 4px 0;font:500 15.5px/1.5 'Anek Greek',sans-serif;color:#f2f7ff;text-wrap:pretty\">Οσοι πιστευουν οτι αυτο που ακουσαν ειναι <b style=\"color:#ff8fbe\">λανθασμενο<\u002Fb> να σηκωσουν το δεξι τους χερι και να ανοιξουν τα ματια τους.<\u002Fp>\n<p style=\"margin:14px 0 0;padding:11px 13px;border-radius:13px;background:rgba(92,233,255,.07);box-shadow:0 0 0 1.5px rgba(92,233,255,.3);text-align:left;font:400 13px/1.55 'Anek Greek',sans-serif;color:#a8c0f0\"><b style=\"color:#7ef0ff\">Υπενθυμιση!<\u002Fb> Μονο ενας μπορει να αναλαβει τον ρολο του εισαγγελεα, οποτε εαν ειναι 2 η περισσοτερα χερια σηκωμενα, ας αποφασισουν μεταξυ τους ποιος θα υποχωρησει (κανετε νοηματα, γυριστε κερμα, πετρα ψαλιδι χαρτι, ο,τι θελετε, δεν με νοιαζει).<\u002Fp>\n<div style=\"flex:1;min-height:14px\"><\u002Fdiv>\n<button style=\"{{ ctaCyan }}\" style-active=\"transform:translateY(4px)\" sc-camel-on-click=\"{{ toProsecutor }}\">\n<span style=\"position:absolute;top:0;left:-40%;width:40%;height:100%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.45),rgba(255,255,255,0));animation:shine 3.2s ease-in-out infinite;pointer-events:none\"><\u002Fspan>\n<span style=\"position:relative\">ΕΤΟΙΜΟΙ!<\u002Fspan>\n<\u002Fbutton>\n<p style=\"margin:14px 0 0;font:500 9.5px/1.7 'Fira Mono',monospace;letter-spacing:.08em;color:rgba(190,212,255,.55)\">ΕΑΝ ΔΕΝ ΣΗΚΩΣΕ ΚΑΝΕΙΣ, ΑΣ ΠΡΟΧΩΡΗΣΟΥΜΕ<br>ΜΕ ΤΟ ΚΟΥΜΠΙ ΑΡΧΕΙΟΘΕΤΗΣΗΣ<\u002Fp>\n<button style=\"display:flex;align-items:center;justify-content:center;gap:8px;margin:8px auto 0;padding:10px 20px;border:0;border-radius:11px;cursor:pointer;background:linear-gradient(180deg,rgba(255,111,94,.24),rgba(90,16,10,.42));color:#ffb3a8;font:700 14px 'Anek Greek',sans-serif;letter-spacing:.04em;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 0 0 1.5px rgba(255,140,120,.5)\" style-active=\"transform:translateY(2px)\" sc-camel-on-click=\"{{ burnCase }}\">Καψ' την<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ atProsecutor }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:relative;z-index:6;flex:none;min-height:100%;display:flex;flex-direction:column;animation:rise .35s ease-out both\">\n<h2 style=\"margin:0 0 14px;font:700 28px/1.12 'Anek Greek',sans-serif;color:#f2f7ff\">Ποιος ειναι ο εισαγγελεας;<\u002Fh2>\n<div style=\"display:flex;flex-wrap:wrap;gap:10px;justify-content:center\">\n<sc-for list=\"{{ prosTags }}\" as=\"t\" hint-placeholder-count=\"4\">\n<button style=\"{{ t.style }}\" sc-camel-on-click=\"{{ t.on }}\">{{ t.name }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<p style=\"margin:20px 4px 0;font:500 15px/1.5 'Anek Greek',sans-serif;color:#f2f7ff;text-wrap:pretty\">Εφοσον επιλεχτηκε παιχτης για τον ρολο του εισαγγελεα, ξανακλεινουν ολοι τα ματια τους και κατεβαζουν χερια.<\u002Fp>\n<div style=\"flex:1;min-height:14px\"><\u002Fdiv>\n<button disabled=\"{{ prosPending }}\" style=\"{{ prosBtn }}\" style-active=\"transform:translateY(4px)\" sc-camel-on-click=\"{{ toDefense }}\">ΕΚΛΕΙΣΑΝ!<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ atDefense }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:relative;z-index:6;flex:none;min-height:100%;display:flex;flex-direction:column;animation:rise .35s ease-out both\">\n<p style=\"margin:0 0 10px;font:600 10px/1.4 'Fira Mono',monospace;letter-spacing:.24em;color:#5ce9ff;text-transform:uppercase\">Διαβασε την ξανα<\u002Fp>\n<div style=\"position:relative;padding:20px 18px;border-radius:18px;background:linear-gradient(#f7faff,#d9e6ff);box-shadow:0 16px 32px rgba(2,8,40,.5),inset 0 0 0 1.5px rgba(255,255,255,.9)\">\n<p style=\"margin:0;font:500 17px/1.45 'Anek Greek',sans-serif;color:#08112e;text-wrap:pretty\">{{ opinion }}<\u002Fp>\n<\u002Fdiv>\n<p style=\"margin:14px 4px 0;font:500 15px/1.5 'Anek Greek',sans-serif;color:#f2f7ff;text-wrap:pretty\">Οσοι πιστευουν οτι αυτο που ακουσαν ειναι <b style=\"color:#63ffa9\">σωστο<\u002Fb> να σηκωσουν το δεξι τους χερι και να ανοιξουν τα ματια τους.<\u002Fp>\n<div style=\"display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 0 0\">\n<span style=\"font:600 10px 'Fira Mono',monospace;letter-spacing:.2em;color:#ff8fbe;text-transform:uppercase\">Εισαγγελεας<\u002Fspan>\n<span style=\"{{ prosChip }}\">{{ prosName }}<\u002Fspan>\n<\u002Fdiv>\n<h2 style=\"margin:14px 0 10px;font:700 19px/1.3 'Anek Greek',sans-serif;color:#f2f7ff;text-wrap:pretty\">Υπαρχει καποιος που θελει να υπερασπιστει την υποθεση και να παει κοντρα με τον {{ prosName }};<\u002Fh2>\n<div style=\"display:flex;flex-wrap:wrap;gap:10px;justify-content:center\">\n<sc-for list=\"{{ defTags }}\" as=\"t\" hint-placeholder-count=\"3\">\n<button style=\"{{ t.style }}\" sc-camel-on-click=\"{{ t.on }}\">{{ t.name }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"flex:1;min-height:14px\"><\u002Fdiv>\n<sc-if value=\"{{ noDefender }}\" hint-placeholder-val=\"{{ true }}\">\n<button style=\"display:flex;align-items:center;justify-content:center;widt this.CTA(\"cyan\", !S.cat, !!S.cat);\n    v.catOps = S.cat ? this.buildPool().length + \" ΥΠΟΘΕΣΕΙΣ ΣΤΗΝ ΤΡΑΠΟΥΛΑ\" : \"ΔΙΑΛΕΞΤΕ ΜΙΑ ΚΑΤΗΓΟΡΙΑ\";\n    v.catGo = () => {\n      if (!S.cat) return;\n      S.picks = this.FOLDERS.map(f => f.id);\n      S.players = []; S.nameDraft = \"\"; S.draftColor = this.freeColor();\n      S.pool = this.buildPool();\n      this.go(\"intro\");\n    };\n    v.start = () => this.go(\"folders\");\n\n    /* ---- το δικαστηριο */\n    if (r) {\n      const tag = (i, on) => this.CHIP(i, { pad: \"10px 17px\", radius: \"12px\", lift: 3,\n        font: \"700 17px 'Anek Greek',sans-serif\",\n        extra: \"cursor:pointer;transition:transform .12s ease,opacity .12s;\" +\n          (on ? \"transform:scale(1.07);box-shadow:0 0 0 3px #fff,0 0 0 6px rgba(92,233,255,.55),0 10px 24px rgba(0,0,0,.5);\"\n              : \"opacity:.8;\") });\n      v.toAccuse = () => this.go(\"accuse\");\n      v.toProsecutor = () => this.go(\"prosecutor\");\n      v.burnCase = () => this.burnCase();\n      v.prosTags = this.all().filter(i => i !== S.judge).map(i => ({\n        name: this.nm(i), style: tag(i, r.con === i),\n        on: () => { r.con = r.con === i ? null : i; if (r.pro === r.con) r.pro = null; this.u(); }\n      }));\n      v.prosPending = r.con == null;\n      v.prosBtn = this.CTA(\"blue\", r.con == null, r.con != null);\n      v.toDefense = () => { if (r.con != null) this.go(\"defense\"); };\n      v.prosName = r.con == null ? \"\" : this.nm(r.con);\n      v.prosChip = this.CHIP(r.con, { pad: \"6px 14px\", radius: \"10px\", font: \"700 15px 'Anek Greek',sans-serif\" });\n      v.defTags = this.all().filter(i => i !== S.judge && i !== r.con).map(i => ({\n        name: this.nm(i), style: tag(i, r.pro === i),\n        on: () => { r.pro = r.pro === i ? null : i; this.u(); }\n      }));\n      v.noDefender = r.pro == null; v.hasDefender = r.pro != null;\n      v.noDef = () => this.burnCase();\n      v.toPreview = () => { if (!r.quip) r.quip = this.quip(); this.go(\"preview\"); };\n      v.quip = r.quip || \"\";\n      v.judgeChipP = this.CHIP(S.judge, { pad: \"8px 18px\", radius: \"12px\", lift: 3, font: \"700 18px 'Anek Greek',sans-serif\" });\n      v.prosChipBig = this.CHIP(r.con, { pad: \"10px 18px\", radius: \"13px\", lift: 4, font: \"700 19px 'Anek Greek',sans-serif\" });\n      v.defName = r.pro == null ? \"\" : this.nm(r.pro);\n      v.defChip = this.CHIP(r.pro, { pad: \"10px 18px\", radius: \"13px\", lift: 4, font: \"700 19px 'Anek Greek',sans-serif\" });\n      const jur = this.all().filter(i => i !== S.judge && i !== r.pro && i !== r.con);\n      v.hasJurors = jur.length > 0;\n      v.jurorPills = jur.map(i => ({ name: this.nm(i),\n        style: this.CHIP(i, { pad: \"5px 12px\", radius: \"8px\", font: \"700 12.5px 'Anek Greek',sans-serif\" }) }));\n      v.randomOn = !!setv.random;\n      v.canReroll = S.pool.length > 0;\n      v.reroll = () => this.rerollCase();\n      v.swapSides = () => { const x = r.pro; r.pro = r.con; r.con = x; this.u(); };\n      v.toContra = () => this.startContra();\n      /* ΟΠΑ κλειστο στις ρυθμισεις: το κουμπι δεν εμφανιζεται καν */\n      v.opaOff = r.opa !== true && !!setv.opa;\n      v.toHearing = () => {\n        if (setv.random) { this.randomRoles(); return this.go(\"preview\"); }\n        this.go(\"eyes\");\n      };\n    }\n\n    /* ---- ο τροχος */\n    const W = S.wheel || { rot: S.wheelRot || 0, spinning: false, res: null };\n    const wn = this.WHEEL.length, slice = 360 / wn;\n    const wcol = (m, k) => m === 0 ? \"#16214f\" : (k % 2 ? \"#0fb6dd\" : \"#2f6bff\");\n    v.wheelStyle = \"position:absolute;inset:0;border-radius:50%;background:conic-gradient(\" +\n      this.WHEEL.map((m, k) => wcol(m, k) + \" \" + (k * slice) + \"deg \" + ((k + 1) * slice) + \"deg\").join(\",\") + \");\" +\n      \"box-shadow:inset 0 0 0 4px rgba(255,255,255,.9),inset 0 0 0 9px #0a1140,0 0 0 3px rgba(92,233,255,.55),0 18px 40px rgba(0,0,0,.6),0 0 44px rgba(47,107,255,.5);\" +\n      \"transform:rotate(\" + W.rot + \"deg);transition:transform 3.9s cubic-bezier(.12,.72,.1,1)\";\n    v.wheelLabels = this.WHEEL.map((m, k) => ({\n      text: m ? \"ΜΠΟΝΟΥΣ\" : \"ΤΙΠΟΤΑ\",\n      style: \"position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(\" + (k * slice + slice / 2) + \"deg) translateY(-88px);\" +\n        \"font:800 \" + (m ? \"13px\" : \"11px\") + \"/1 'Anek Greek',sans-serif;white-space:nowrap;letter-spacing:.02em;\" +\n        \"color:\" + (m ? \"#fff\" : \"rgba(200,215,255,.75)\") +\n        \";text-shadow:0 1px 3px rgba(0,0,0,.6)\"\n    }));\n    v.wheelIdle = !W.spinning && W.res == null;\n    v.wheelSpinning = !!W.spinning;\n    v.wheelDone = W.res != null;\n    v.spin = () => this.spin();\n    v.ctaSpin = this.CTA(\"cyan\", false, true) + \"font-size:26px;letter-spacing:.04em;\";\n    const wWin = r && r.played ? this.nm(r.winner) : \"\";\n    v.wheelEyebrow = wWin ? \"Ο ποντος πηγε στον \" + wWin : \"Ο τροχος\";\n    v.wheelLede = (wWin ? \"Ο \" + wWin + \" εχει ρεντα: αν βρει, παιρνει διπλα. \" : \"\") +\n      \"Ο τροχος λεει μονο αν θα παιχτει μπονους.\";\n    v.wheelResult = W.res === 0 ? \"Δεν εχει μπονους αυτη τη φορα\"\n      : W.res ? \"ΜΠΟΝΟΥΣ!\" : \"\";\n    v.wheelResultStyle = \"margin:4px 0 0;padding:14px 12px;border-radius:15px;font:800 \" + (W.res ? \"24px\" : \"21px\") +\n      \"/1.2 'Anek Greek',sans-serif;animation:popIn .45s cubic-bezier(.2,1.5,.4,1) both;\" +\n      (W.res ? \"background:linear-gradient(160deg,#2a55e8,#0d1760);color:#fff;box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 0 0 2px #5ce9ff,0 0 26px rgba(92,233,255,.5)\"\n        : \"background:rgba(104,140,255,.12);color:#a8c0f0;box-shadow:0 0 0 1.5px rgba(120,160,255,.3)\");\n    v.wheelGo = () => this.wheelGo();\n    v.wheelGoLabel = W.res ? \"ΜΟΙΡΑΣΕ ΤΟ ΚΙΝΗΤΟ\" : \"ΣΤΟΝ ΠΙΝΑΚΑ\";\n    v.wheelGoStyle = this.CTA(W.res ? \"cyan\" : \"blue\", false, !!W.res);\n\n    /* ---- το μπονους: ολοι μαντευουν, το σερι σβηνει μονο με λαθος */\n    const ciB = this.bCur();\n    v.bX2 = !!(S.bonus && ciB != null && this.isX2(ciB));\n    v.bMultTag = \"ΡΕΝΤΑ X2\";\n    if (ciB != null) {\n      const stB = this.P(ciB).streak || 0;\n      v.bStreakNote = (this.isX2(ciB) ? \"Εχεις ρεντα: τα διπλα. \" : \"\") +\n        (stB > 0 ? stB + \" σωστες συνεχομενες. \" : \"\") +\n        \"Σωστο: +\" + this.stakePlus(ciB) + \" · λαθος: \" + (this.stakeMinus(ciB) ? \"-\" + this.stakeMinus(ciB) : \"δεν εχεις τι να χασεις\") + \".\";\n    }\n\n    return v;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
