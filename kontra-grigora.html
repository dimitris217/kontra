document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ng:13px;box-shadow:0 36px 74px rgba(0,0,0,.66),inset 0 0 0 3px rgba(255,199,44,.26),inset 0 2px 0 rgba(255,255,255,.1)\">\n\n<div style=\"display:flex;align-items:center;gap:9px;padding:2px 6px 11px\">\n<sc-if value=\"{{ bulbs }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"flex:1;height:13px;border-radius:7px;background-color:#2a070a;background-image:radial-gradient(circle at 6px 6px,#fff4bd 0 2.4px,#ffc72c 2.4px 4.6px,rgba(0,0,0,0) 4.8px);background-size:12px 12px;background-repeat:repeat-x;box-shadow:0 0 14px rgba(255,199,44,.45),inset 0 0 0 1px rgba(0,0,0,.5);animation:bulbrun 1.4s steps(2) infinite\"><\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ noBulbs }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"flex:1;height:13px;border-radius:7px;background-color:#2a070a;background-image:radial-gradient(circle at 6px 6px,#f6dfa0 0 2.4px,#c99418 2.4px 4.6px,rgba(0,0,0,0) 4.8px);background-size:12px 12px;background-repeat:repeat-x;box-shadow:inset 0 0 0 1px rgba(0,0,0,.5)\"><\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"flex:none;padding:3px 9px;border-radius:8px;background:linear-gradient(#1d0508,#0d0203);border:2px solid rgba(255,199,44,.4);font:400 8px/1.4 'Press Start 2P',monospace;color:#ffc72c;letter-spacing:.04em\">No 7<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"position:relative;overflow:hidden;background:linear-gradient(#5f1118,#380a0f);border:4px solid #0b0203;border-radius:28px;padding:18px 16px 20px;min-height:820px;display:flex;flex-direction:column;text-align:center;box-shadow:inset 0 3px 0 rgba(255,255,255,.09),inset 0 -40px 90px rgba(0,0,0,.45)\">\n<div style=\"position:absolute;inset:0;pointer-events:none;background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,rgba(0,0,0,0) 1px 4px);opacity:.5;z-index:5\"><\u002Fdiv>\n<div style=\"position:absolute;inset:0;pointer-events:none;background:radial-gradient(80% 55% at 50% 0%,rgba(255,199,44,.12),rgba(0,0,0,0) 70%);z-index:4\"><\u002Fdiv>\n\n<sc-if value=\"{{ atHome }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"position:relative;z-index:6;min-height:782px;display:flex;flex-direction:column\">\n<div style=\"display:flex;justify-content:space-between;align-items:center\">\n<button style=\"width:44px;height:44px;border-radius:50%;border:3px solid #0b0203;background:linear-gradient(#ffd75e,#dc9f10);color:#4a2600;font:700 19px Comfortaa,sans-serif;cursor:pointer;box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 4px 0 #96690a\" style-active=\"transform:translateY(4px);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 0 0 #96690a\" sc-camel-on-click=\"{{ goRules }}\">i<\u002Fbutton>\n<div style=\"font:400 9px/1.4 'Press Start 2P',monospace;color:rgba(255,246,226,.4);letter-spacing:.06em\">CASINO KONTRA<\u002Fdiv>\n<button style=\"width:44px;height:44px;border-radius:50%;border:3px solid #0b0203;background:linear-gradient(#ffd75e,#dc9f10);color:#4a2600;font:700 19px Comfortaa,sans-serif;cursor:pointer;box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 4px 0 #96690a\" style-active=\"transform:translateY(4px);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 0 0 #96690a\" sc-camel-on-click=\"{{ goRecords }}\">≡<\u002Fbutton>\n<\u002Fdiv>\n\n<div style=\"margin:10px 0 2px;padding:12px 10px 14px;border-radius:20px;background:linear-gradient(#7b1620,#4a0c12);border:3px solid #0b0203;box-shadow:inset 0 0 0 2px rgba(255,199,44,.32),inset 0 3px 0 rgba(255,255,255,.14),0 6px 0 rgba(0,0,0,.45);position:relative;overflow:hidden\">\n<div style=\"position:absolute;top:0;left:0;width:38%;height:100%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.14),rgba(255,255,255,0));animation:sweep 4.6s ease-in-out infinite\"><\u002Fdiv>\n<div style=\"font:700 10px/1.4 Comfortaa,sans-serif;letter-spacing:.3em;color:#ffc72c;text-transform:uppercase\">Το καζινο των αποψεων<\u002Fdiv>\n<h1 style=\"margin:6px 0 0;font:700 33px/1.02 Comfortaa,sans-serif;color:#fff6e2;letter-spacing:-.6px;text-shadow:0 3px 0 #7d150f,0 5px 0 rgba(0,0,0,.45),0 0 26px rgba(255,199,44,.4)\">ΚΟΝΤΡΑ<br>ΣΤΑ ΓΡΗΓΟΡΑ<\u002Fh1>\n<div style=\"margin-top:8px;font:400 15px Comfortaa,sans-serif;letter-spacing:.5em;color:#ffc72c\"><span style=\"color:#fff6e2\">♠<\u002Fspan> <span style=\"color:#ff8b7d\">♥<\u002Fspan> <span style=\"color:#ff8b7d\">♦<\u002Fspan> <span style=\"color:#fff6e2\">♣<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"position:relative;height:126px;margin:10px 0 4px;border:3px dashed rgba(255,199,44,.5);border-radius:18px;background-image:repeating-linear-gradient(135deg,rgba(255,246,226,.09) 0 8px,rgba(255,246,226,0) 8px 16px);display:flex;align-items:center;justify-content:center\">\n<div style=\"font:400 9px/1.9 ui-monospace,Menlo,monospace;letter-spacing:.14em;color:#ffd98a\">img/grigora-mascot.png<br>Ο ΚΡΟΥΠΙΕΡΗΣ ΜΠΑΙΝΕΙ ΕΔΩ<\u002Fdiv>\n<\u002Fdiv>\n\n<p style=\"margin:2px 0 4px;font:400 14px/1.55 Comfortaa,sans-serif;color:#f0c9b2;text-wrap:pretty\">Ετοιμες αποψεις. Κρυφοι ρολοι.<br>Ενας φευγει απο το τραπεζι καθε γυρο.<\u002Fp>\n\n<div style=\"margin:14px 0 6px;font:700 10px/1.4 Comfortaa,sans-serif;letter-spacing:.24em;color:#ffc72c;text-transform:uppercase\">Παιχτες στο τραπεζι<\u002Fdiv>\n<div style=\"display:flex;align-items:center;justify-content:center;gap:14px\">\n<button style=\"{{ decStyle }}\" sc-camel-on-click=\"{{ dec }}\">−<\u002Fbutton>\n<div style=\"min-width:104px;padding:12px 10px 10px;border-radius:14px;background:linear-gradient(#0d0203,#1e0509);border:3px solid #0b0203;box-shadow:inset 0 3px 10px rgba(0,0,0,.9),inset 0 0 0 2px rgba(255,199,44,.3),0 4px 0 rgba(0,0,0,.4)\">\n<div style=\"font:400 30px/1 'Press Start 2P',monospace;color:#ffc72c;text-shadow:0 0 16px rgba(255,199,44,.7)\">{{ playerCount }}<\u002Fdiv>\n<\u002Fdiv>\n<button style=\"{{ incStyle }}\" sc-camel-on-click=\"{{ inc }}\">+<\u002Fbutton>\n<\u002Fdiv>\n\n<div style=\"margin:18px 0 6px;font:700 10px/1.4 Comfortaa,sans-serif;letter-spacing:.24em;color:#ffc72c;text-transform:uppercase\">Χρονος λογου<\u002Fdiv>\n<div style=\"display:flex;gap:8px\">\n<sc-for list=\"{{ timeChips }}\" as=\"c\" hint-placeholder-count=\"3\">\n<button style=\"{{ c.style }}\" sc-camel-on-click=\"{{ c.on }}\">{{ c.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<div style=\"margin:18px 0 6px;font:700 10px/1.4 Comfortaa,sans-serif;letter-spacing:.24em;color:#ffc72c;text-transform:uppercase\">Ο αντιφατης<\u002Fdiv>\n<div style=\"display:flex;gap:8px\">\n<button style=\"{{ liarOnStyle }}\" sc-camel-on-click=\"{{ liarOn }}\">Παιζει<\u002Fbutton>\n<button style=\"{{ liarOffStyle }}\" sc-camel-on-click=\"{{ liarOff }}\">Εκτος<\u002Fbutton>\n<\u002Fdiv>\n\n<div style=\"flex:1;min-height:14px\"><\u002Fdiv>\n<button style=\"display:block;width:100%;margin-top:12px;padding:17px 16px;border:3px solid #0b0203;border-radius:18px;font:700 24px Comfortaa,sans-serif;color:#3a1c00;cursor:pointer;background:linear-gradient(#ffe083,#e2a512);box-shadow:inset 0 3px 0 rgba(255,255,255,.65),0 7px 0 #9c6c05,0 12px 22px rgba(0,0,0,.45);text-shadow:0 1px 0 rgba(255,255,255,.55);letter-spacing:.02em\" style-active=\"transform:translateY(7px);box-shadow:inset 0 3px 0 rgba(255,255,255,.65),0 0 0 #9c6c05\" sc-camel-on-click=\"{{ start }}\">ΜΟΙΡΑΣΕ!<\u002Fbutton>\n<a href=\"index.html\" style=\"display:block;margin-top:11px;padding:9px;font:600 14px Comfortaa,sans-serif;color:rgba(255,246,226,.6)\">← Κλασσικη Κοντρα<\u002Fa>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ atRules }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:relative;z-index:6;min-height:782px;display:flex;flex-direction:column\">\n<p style=\"margin:0 0 8px;font:700 10px/1.4 Comfortaa,sans-serif;letter-spacing:.24em;color:#ffc72c;text-transform:uppercase\">Ο κανονισμος του τραπεζιου<\u002Fp>\n<h2 style=\"margin:0 0 14px;font:700 25px/1.15 Comfortaa,sans-serif;color:#fff6e2;text-shadow:0 3px 0 rgba(0,0,0,.45)\">Κοντρα στα γρηγορα<\u002Fh2>\n<div style=\"text-align:left;padding:16px 15px;border-radius:18px;background:linear-gradient(#12864d,#0b5731);border:3px solid #08301c;box-shadow:inset 0 0 0 2px rgba(255,199,44,.3),inset 0 3px 0 rgba(255,255,255,.15),0 6px 0 #062515\">\n<h3 style=\"margin:0 0 5px;font:700 17px Comfortaa,sans-serif;color:#ffd75e\">Ρολοι<\u002Fh3>\n<p style=\"margin:0 0 14px;font:400 13.5px/1.6 Comfortaa,sans-serif;color:#e9f7ec\">Στην αρχη ο καθενας βλεπει κρυφα το φυλλο του. Οι <b style=\"color:#fff6e2\">δικηγοροι<\u002Fb> παιζουν κανονικα και παιρνουν ποντο σε καθε νικη. Ο <b style=\"color:#fff6e2\">αντιφατης<\u002Fb> ειναι ενας. Παιρνει κι αυτος ποντους, αλλα ο γυρος του μετραει μονο αν εχει χασει τουλαχιστον μια κοντρα.<\u002Fp>\n<h3 style=\"margin:0 0 5px;font:700 17px Comfortaa,sans-serif;color:#ffd75e\">Ο γυρος<\u002Fh3>\n<p style=\"margin:0 0 14px;font:400 13.5px/1.6 Comfortaa,sans-serif;color:#e9f7ec\">Καθε γυρος εχει τοσες κοντρες οσοι και οι παιχτες. Ο δικαστης αλλαζει καθε φορα: μοιραζει μια ετοιμη αποψη, ολοι σηκωνουν χερι υπερ ή κατα, και διαλεγει <b style=\"color:#fff6e2\">δυο<\u002Fb> να μονομαχησουν — ενα απο καθε πλευρα.<\u002Fp>\n<h3 style=\"margin:0 0 5px;font:700 17px Comfortaa,sans-serif;color:#ffd75e\">Η κοτα<\u002Fh3>\n<p style=\"margin:0 0 14px;font:400 13.5px/1.6 Comfortaa,sans-serif;color:#e9f7ec\">Καθενας εχει <b style=\"color:#fff6e2\">{{ chickens }} μαρκες κοτας<\u002Fb> για ολο το παιχνιδι. Οταν σε διαλεξουν μπορεις να αρνηθεις: ο αντιπαλος παιρνει τον ποντο χωρις να μιλησει κανεις. Οταν τελειωσουν οι μαρκες, παιζεις.<\u002Fp>\n<h3 style=\"margin:0 0 5px;font:700 17px Comfortaa,sans-serif;color:#ffd75e\">Η αποβολη<\u002Fh3>\n<p style=\"margin:0 0 14px;font:400 13.5px/1.6 Comfortaa,sans-serif;color:#e9f7ec\">Οι ποντοι <b style=\"color:#fff6e2\">δεν φανερωνονται ποτε<\u002Fb>. Στο τελος του γυρου φευγει αυτος με τους λιγοτερους. Αν ισοβαθμουν δυο, παιζουν <b style=\"color:#fff6e2\">χαλκινη κοντρα<\u002Fb> με δικαστη τον πρωτο του γυρου. Αν ισοβαθμουν τρεις ή παραπανω, <b style=\"color:#fff6e2\">παιζουν ολοι μεταξυ τους<\u002Fb>: καθε κοντρα σωζει τον νικητη της, μεχρι να μεινουν δυο — και αυτοι παιζουν τη χαλκινη κοντρα.<\u002Fp>\n<h3 style=\"margin:0 0 5px;font:700 17px Comfortaa,sans-serif;color:#ffd75e\">Το τελος<\u002Fh3>\n<p style=\"margin:0;font:400 13.5px/1.6 Comfortaa,sans-serif;color:#e9f7ec\">Οταν μεινουν τρεις, ο τριτος που φευγει γινεται δικαστης και οι αλλοι δυο παιζουν τη <b style=\"color:#fff6e2\">χρυση κοντρα<\u002Fb>. Πρωτος στις {{ goldenTarget }} νικες σπαει τη μπανκα.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1;min-height:14px\"><\u002Fdiv>\n<button style=\"display:block;width:100%;margin-top:12px;padding:15px 16px;border:3px solid #0b0203;border-radius:16px;font:700 19px Comfortaa,sans-serif;color:#fff6e2;cursor:pointer;background:linear-gradient(#7a6259,#4c3a33);box-shadow:inset 0 2px 0 rgba(255,255,255,.22),0 6px 0 #241b17;text-shadow:0 2px 0 rgba(0,0,0,.4)\" style-active=\"transform:translateY(6px);box-shadow:inset 0 2px 0 rgba(255,255,255,.22),0 0 0 #241b17\" sc-camel-on-click=\"{{ goBack }}\">Πισω στο τραπεζι<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ atRecords }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:relative;z-index:6;min-height:782px;display:flex;flex-direction:column\">\n<p style=\"margin:0 0 8px;font:700 10px/1.4 Comfortaa,sans-serif;letter-spacing:.24em;color:#ffc72c;text-transform:uppercase\">Τα πρακτικα του καζινο<\u002Fp>\n<h2 style=\"margin:0 0 16px;font:700 25px/1.15 Comfortaa,sans-serif;color:#fff6e2;text-shadow:0 3px 0 rgba(0,0,0,.45)\">Παλιες παρτιδες<\u002Fh2>\n<sc-if value=\"{{ noRecords }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"padding:26px 18px;border-radius:18px;border:3px dashed rgba(255,199,44,.4);background-image:repeating-linear-gradient(135deg,rgba(255,246,226,.07) 0 8px,rgba(255,246,226,0) 8px 16px)\">\n<div style=\"font:400 30px/1 'Press Start 2P',monospace;color:rgba(255,199,44,.55)\">000<\u002Fdiv>\n<p style=\"margin:12px 0 0;font:400 14px/1.5 Comfortaa,sans-serif;color:#f0c9b2\">Καμια παρτιδα ακομα. Το ταμειο ειναι αδειο.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<sc-for list=\"{{ records }}\" as=\"r\" hint-placeholder-count=\"0\">\n<div style=\"text-align:left;padding:14px;border-radius:16px;background:linear-gradient(#12864d,#0b5731);border:3px solid #08301c;box-shadow:inset 0 0 0 2px rgba(255,199,44,.25),0 5px 0 #062515\">\n<div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:8px\">\n<span style=\"font:400 9px 'Press Start 2P',monospace;color:#9fe0b8\">{{ r.when }}<\u002Fspan>\n<span style=\"font:400 9px 'Press Start 2P',monospace;color:#ffd75e\">{{ r.duels }}R<\u002Fspan>\n<\u002Fdiv>\n<div style=\"margin-top:7px;font:700 18px Comfortaa,sans-serif;color:#fff6e2\">{{ r.winner }}<\u002Fdiv>\n<div style=\"margin-top:3px;font:400 12.5px/1.45 Comfortaa,sans-serif;color:#cceed6\">{{ r.players }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"flex:1;min-height:14px\"><\u002Fdiv>\n<button style=\"display:block;width:100%;margin-top:12px;padding:15px 16px;border:3px solid #0b0203;border-radius:16px;font:700 19px Comfortaa,sans-serif;color:#fff6e2;cursor:pointer;background:linear-gradient(#7a6259,#4c3a33);box-shadow:inset 0 2px 0 rgba(255,255,255,.22),0 6px 0 #241b17;text-shadow:0 2px 0 rgba(0,0,0,.4)\" style-active=\"transform:translateY(6px);box-shadow:inset 0 2px 0 rgba(255,255,255,.22),0 0 0 #241b17\" sc-camel-on-click=\"{{ goBack }}\">Πισω στο τραπεζι<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ atIntro }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:relative;z-index:6;min-height:782px;display:flex;flex-direction:column\">\n<p style=\"margin:0 0 10px;font:700 10px/1.4 Comfortaa,sans-serif;letter-spacing:.24em;color:#ffc72c;text-transform:uppercase\">Μοιρασμα · <b style=\"color:#fff6e2\">{{ introNo }} απο {{ introTotal }}<\u002Fb><\u002Fp>\n<h2 style=\"margin:0 0 8px;font:700 26px/1.15 Comfortaa,sans-serif;color:#fff6e2;text-shadow:0 3px 0 rgba(0,0,0,.45)\">Πως σε λενε;<\u002Fh2>\n<p style=\"margin:0 0 18px;font:400 14px/1.55 Comfortaa,sans-serif;color:#f0c9b2\">Γραψε το ονομα σου και δες το φυλλο σου. Μονο εσυ.<\u002Fp>\n<div style=\"padding:8px;border-radius:20px;background:linear-gradient(#12864d,#0b5731);border:3px solid #08301c;box-shadow:inset 0 0 0 2px rgba(255,199,44,.3),0 6px 0 #062515\">\n<input ref=\"{{ nameRef }}\" sc-camel-on-input=\"{{ onNameInput }}\" maxlength=\"14\" autocomplete=\"off\" placeholder=\"Το ονομα σου\" style=\"width:100%;padding:15px 14px;border:3px solid #0b0203;border-radius:14px;background:linear-gradient(#fffdf5,#f1e3c9);color:#1b1008;font:700 19px Comfortaa,sans-serif;text-align:center;outline:none;-webkit-appearance:none;box-shadow:inset 0 3px 8px rgba(0,0,0,.2)\">\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:16px\">\n<sc-for list=\"{{ namePills }}\" as=\"p\" hint-placeholder-count=\"2\">\n<span style=\"padding:6px 13px;border-radius:999px;border:3px solid #0b0203;background:linear-gradient(#4d1017,#380a10);font:700 14px Comfortaa,sans-serif;color:#fff6e2;box-shadow:0 3px 0 rgba(0,0,0,.45)\">{{ p.name }}<\u002Fspan>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"flex:1;min-height:14px\"><\u002Fdiv>\n<button disabled=\"{{ nameEmpty }}\" style=\"{{ nameBtnStyle }}\" sc-camel-on-click=\"{{ nameOk }}\">Δες το φυλλο σου<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ atRole }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:relative;z-index:6;min-height:782px;display:flex;flex-direction:column\">\n<p style=\"margin:0 0 10px;font:700 10px/1.4 Comfortaa,sans-serif;letter-spacing:.24em;color:#ffc72c;text-transform:uppercase\">{{ roleName }} · μονο για σενα<\u002Fp>\n<div style=\"flex:1;display:flex;align-items:center;justify-content:center\">\n<div style=\"{{ roleCardStyle }}\">\n<div style=\"position:absolute;top:10px;left:13px;font:700 20px Comfortaa,sans-serif;color:{{ roleSuitColor }}\">{{ roleSuit }}<\u002Fdiv>\n<div style=\"position:absolute;bottom:10px;right:13px;font:700 20px Comfortaa,sans-serif;color:{{ roleSuitColor }};transform:rotate(180deg)\">{{ roleSuit }}<\u002Fdiv>\n<div style=\"font:700 9px/1.4 Comfortaa,sans-serif;letter-spacing:.26em;color:#7a6a55;text-transform:uppercase\">Το φυλλο σου<\u002Fdiv>\n<div style=\"{{ roleTitleStyle }}\">{{ roleTitle }}<\u002Fdiv>\n<div style=\"width:54px;height:4px;border-radius:2px;background:#d8c7a6;margin:2px auto 12px\"><\u002Fdiv>\n<p style=\"margin:0;font:400 13.5px/1.6 Comfortaa,sans-serif;color:#4a3a26;text-wrap:pretty\">{{ roleText }}<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<button style=\"{{ roleBtnStyle }}\" sc-camel-on-click=\"{{ roleOk }}\">Το ειδα, κλεινω<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ atRoundStart }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:relative;z-index:6;min-height:782px;display:flex;flex-direction:column\">\n<p style=\"margin:0 0 6px;font:700 10px/1.4 Comfortaa,sans-serif;letter-spacing:.24em;color:#ffc72c;text-transform:uppercase\">Γυρος {{ roundNo }} · <b style=\"color:#fff6e2\">{{ duelTotal }} κοντρες<\u002Fb><\u002Fp>\n<div style=\"margin:12px auto 0;width:86px;height:86px;border-radius:50%;border:4px dashed rgba(255,199,44,.5);display:flex;align-items:center;justify-content:center;background-image:repeating-linear-gradient(135deg,rgba(255,246,226,.09) 0 7px,rgba(255,246,226,0) 7px 14px)\">\n<span style=\"font:400 8px/1.6 ui-monospace,Menlo,monospace;color:#ffd98a\">dealer<br>.png<\u002Fspan>\n<\u002Fdiv>\n<h1 style=\"margin:16px 0 4px;font:700 36px/1.05 Comfortaa,sans-serif;color:#fff6e2;text-shadow:0 3px 0 #7d150f,0 5px 0 rgba(0,0,0,.45);animation:pop .45s cubic-bezier(.2,1.5,.4,1) both\">{{ judgeName }}<\u002Fh1>\n<p style=\"margin:0 0 16px;font:400 14px/1.55 Comfortaa,sans-serif;color:#f0c9b2\">Παρε το κινητο. Εσυ μοιραζεις αυτη την κοντρα.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:7px;justify-content:center\">\n<sc-for list=\"{{ alivePills }}\" as=\"p\" hint-placeholder-count=\"6\">\n<span style=\"padding:6px 13px;border-radius:999px;border:3px solid #0b0203;background:linear-gradient(#12864d,#0b5731);font:700 14px Comfortaa,sans-serif;color:#fff6e2;box-shadow:0 3px 0 #062515\">{{ p.name }}<\u002Fspan>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"flex:1;min-height:14px\"><\u002Fdiv>\n<button style=\"display:block;width:100%;margin-top:12px;padding:16px;border:3px solid #0b0203;border-radius:18px;font:700 21px Comfortaa,sans-serif;color:#fff6e2;cursor:pointer;background:linear-gradient(#3ed878,#159a4b);box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 7px 0 #0a5c2c,0 12px 20px rgba(0,0,0,.4);text-shadow:0 2px 0 rgba(0,0,0,.3)\" style-active=\"transform:translateY(7px);box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 0 0 #0a5c2c\" sc-camel-on-click=\"{{ toEyes }}\">Ετοιμοι!<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ atEyes }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:relative;z-index:6;min-height:782px;display:flex;flex-direction:column;justify-content:center;background:radial-gradient(70% 50% at 50% 45%,rgba(255,199,44,.1),rgba(0,0,0,0));margin:-18px -16px -20px;padding:18px 16px 20px\">\n<p style=\"margin:0 0 26px;font:400 9px/1.6 'Press Start 2P',monospace;color:rgba(255,199,44,.7)\">ΚΟΝΤΡΑ {{ duelIdx }} / {{ duelTotal }}<\u002Fp>\n<div style=\"display:flex;gap:22px;justify-content:center;margin-bottom:26px\">\n<div style=\"position:relative;width:64px;height:64px;border-radius:50%;background:linear-gradient(#fff6e2,#e8d3b2);border:4px solid #0b0203;box-shadow:0 5px 0 rgba(0,0,0,.5);overflow:hidden\">\n<div style=\"position:absolute;left:0;right:0;top:26px;height:9px;background:#0b0203;border-radius:5px\"><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"position:relative;width:64px;height:64px;border-radius:50%;background:linear-gradient(#fff6e2,#e8d3b2);border:4px solid #0b0203;box-shadow:0 5px 0 rgba(0,0,0,.5);overflow:hidden\">\n<div style=\"position:absolute;l Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;chickens&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;min&quot;:1,&quot;max&quot;:5,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Κανονες&quot;},&quot;goldenTarget&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;min&quot;:2,&quot;max&quot;:5,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Κανονες&quot;},&quot;bulbsOn&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Θεμα&quot;},&quot;devRail&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Θεμα&quot;}}\">\nclass Component extends DCLogic {\n  /* === ΡΥΘΜΙΣΕΙΣ ΠΑΙΧΝΙΔΙΟΥ ============================== */\n  CFG = {\n    MIN_PLAYERS: 4, MAX_PLAYERS: 15, DEFAULT_PLAYERS: 6,\n    TIME_OPTIONS: [45, 60, 90], DEFAULT_TIME: 60, MAX_NAME: 14,\n    LIAR_MUST_LOSE: true, STORE_KEY: \"kontra.grigora.v2\"\n  };\n\n  /* === ΤΟ POOL ΤΩΝ ΑΠΟΨΕΩΝ ============================== */\n  POOL = [\n    \"Η αληθινη φιλια δεν αντεχει τη μεγαλη αποσταση.\",\n    \"Το ταλεντο μετραει περισσοτερο απο τη σκληρη δουλεια.\",\n    \"Καλυτερα να πεις μια σκληρη αληθεια παρα ενα ψεμα που προστατευει.\",\n    \"Τα χρηματα αγοραζουν ευτυχια μεχρι ενα σημειο, και αυτο το σημειο ειναι ψηλα.\",\n    \"Το να μενεις στην πολη που γεννηθηκες ειναι επιλογη, οχι αδρανεια.\",\n    \"Καποιος που δεν διαβαζει βιβλια δεν ειναι λιγοτερο μορφωμενος.\",\n    \"Η οικογενεια δεν σου δινει αυτοματα δικαιωμα στην αγαπη σου.\",\n    \"Το να ζητας συγγνωμη χωρις να το εννοεις ειναι χειροτερο απο το να μην τη ζητας.\",\n    \"Οι ταινιες ηταν καλυτερες πριν απο εικοσι χρονια.\",\n    \"Ενας ανθρωπος μπορει να αλλαξει ριζικα μετα τα τριαντα.\",\n    \"Το να δουλευεις σε κατι που δεν αγαπας δεν ειναι αποτυχια.\",\n    \"Η τυχη παιζει μεγαλυτερο ρολο στην επιτυχια απο οτι παραδεχομαστε.\",\n    \"Ειναι λαθος να κρινεις καποιον απο το παρελθον του.\",\n    \"Το κινητο εχει κανει τις παρεες χειροτερες.\",\n    \"Καλυτερα να ζεις μονος παρα με λαθος ανθρωπο.\",\n    \"Η ελευθερια του λογου πρεπει να εχει οριο.\",\n    \"Το να συγχωρεις ειναι πιο πολυ για σενα παρα για τον αλλον.\",\n    \"Ο ανταγωνισμος μεταξυ φιλων ειναι υγιης.\",\n    \"Δεν υπαρχει κακη μουσικη, μονο μουσικη που δεν καταλαβες.\",\n    \"Οι κανονες υπαρχουν για να σπανε οταν εχεις καλο λογο.\",\n    \"Το να μην εχεις γνωμη για κατι ειναι κι αυτο γνωμη.\",\n    \"Η πρωτη εντυπωση εχει σχεδον παντα δικιο.\",\n    \"Οι αναμνησεις αξιζουν περισσοτερο απο τα πραγματα.\",\n    \"Καλυτερα να προσπαθησεις και να αποτυχεις δημοσια παρα να μην προσπαθησεις.\"\n  ];\n\n  /* === ΚΑΤΑΣΤΑΣΗ ======================================== */\n  S = {\n    screen: \"home\", playerCount: 6, timeSec: 60, liarOn: true, liarIdx: -1,\n    players: [], introIdx: 0, nameDraft: \"\", pool: [],\n    roundNo: 0, duelNo: 0, duelTotal: 0, judge: 0, judgeSeed: 0,\n    round: null, bronze: null, golden: null, tie: null, lastOut: null, champion: null,\n    back: \"home\", records: []\n  };\n  nameRef = React.createRef();\n\n  componentDidMount() {\n    try { this.S.records = JSON.parse(localStorage.getItem(this.CFG.STORE_KEY)) || []; this.u(); } catch (e) {}\n  }\n  componentDidUpdate() {\n    if (this.S.screen === \"intro\" && this.nameRef.current) this.nameRef.current.focus();\n  }\n  componentWillUnmount() { this.stopTimer(); }\n\n  /* === ΒΟΗΘΗΤΙΚΑ ======================================== */\n  u() { this.forceUpdate(); }\n  nCh() { return this.props.chickens ?? 3; }\n  nTarget() { return this.props.goldenTarget ?? 3; }\n  P(i) { return this.S.players[i] || { name: \"\", chickens: 0 }; }\n  nm(i) { return (this.S.players[i] || {}).name || \"\"; }\n  alive() { return this.S.players.map((p, i) => i).filter(i => this.S.players[i].alive); }\n  sideOf(s) {\n    const S = this.S;\n    if (!S.round) return [];\n    return this.alive().filter(i => i !== S.judge && S.round.vote[i] === s);\n  }\n  mmss(t) { return Math.floor(t / 60) + \":\" + String(Math.floor(t % 60)).padStart(2, \"0\"); }\n  go(s) { this.stopTimer(); if (s === \"rules\" || s === \"records\") this.S.back = this.S.screen; this.S.screen = s; this.u(); }\n  stopTimer() { if (this.iv) { clearInterval(this.iv); this.iv = null; } }\n  runTimer() { this.stopTimer(); this.iv = setInterval(() => this.tick(), 1000); }\n\n  /* === ΛΟΓΙΚΗ ΠΑΙΧΝΙΔΙΟΥ ================================ */\n  drawOpinion() {\n    const S = this.S;\n    if (!S.pool.length) S.pool = this.POOL.slice();\n    return S.pool.splice(Math.floor(Math.random() * S.pool.length), 1)[0];\n  }\n  startGame() {\n    const S = this.S;\n    S.liarIdx = S.liarOn ? Math.floor(Math.random() * S.playerCount) : -1;\n    S.players = []; S.introIdx = 0; S.pool = this.POOL.slice(); S.roundNo = 0;\n    S.bronze = null; S.golden = null; S.champion = null; S.lastOut = null;\n    S.screen = \"intro\"; this.u();\n  }\n  newDuel() {\n    this.S.round = { op: this.drawOpinion(), vote: {}, a: null, b: null, asking: \"a\",\n      order: [], times: [], cur: 0, opa: false, opaT: 0 };\n  }\n  newRound() {\n    const S = this.S; S.roundNo++;\n    const a = this.alive();\n    S.duelTotal = a.length; S.duelNo = 0;\n    a.forEach(i => { const p = this.P(i); p.roundPts = 0; p.lost = false; p.fought = false; });\n    S.judgeSeed = (S.judgeSeed + 1) % a.length;\n    S.judge = a[S.judgeSeed % a.length];\n    this.newDuel(); S.screen = \"roundStart\";\n  }\n  nextDuel() {\n    const S = this.S; S.duelNo++;\n    if (S.duelNo >= S.duelTotal) { S.screen = \"roundEnd\"; return; }\n    const a = this.alive();\n    S.judge = a[(S.judgeSeed + S.duelNo) % a.length];\n    this.newDuel(); S.screen = \"roundStart\";\n  }\n  buildOrder() {\n    const r = this.S.round;\n    r.order = [{ side: \"pro\", p: r.a }, { side: \"con\", p: r.b }];\n    r.times = [this.S.timeSec, this.S.timeSec];\n    r.cur = 0; r.opa = false; r.opaT = 0;\n  }\n  awardDuel(w, l) {\n    this.P(w).roundPts = (this.P(w).roundPts || 0) + 1;\n    this.P(l).lost = true;\n    this.P(w).fought = true; this.P(l).fought = true;\n  }\n  closeRound() {\n    this.alive().forEach(i => {\n      const p = this.P(i);\n      let g = p.roundPts || 0;\n      if (this.CFG.LIAR_MUST_LOSE && p.liar && p.fought && !p.lost) g = 0;\n      p.pts += g;\n    });\n  }\n  resolveElimination() {\n    const S = this.S, a = this.alive();\n    const min = Math.min(...a.map(i => this.P(i).pts));\n    const worst = a.filter(i => this.P(i).pts === min);\n    const best = a.reduce((x, i) => this.P(i).pts > this.P(x).pts ? i : x, a[0]);\n    if (worst.length === 1) { this.eliminate(worst[0]); S.screen = \"out\"; return; }\n    if (worst.length === 2) { S.bronze = { a: worst[0], b: worst[1], judge: best }; S.screen = \"duelIntro\"; return; }\n    /* τρεις ή παραπανω ισοβαθμοι: παιζουν ολοι μεταξυ τους, καθε\n       νικητης σωζεται και βγαινει απο το ισοβαθμο, μεχρι να\n       μεινουν δυο — αυτοι παιζουν τη χαλκινη κοντρα.            */\n    S.tie = { pool: worst.slice(), judge: best };\n    S.screen = \"replay\";\n  }\n  eliminate(i) { this.P(i).alive = false; this.S.lastOut = i; }\n  afterOut() {\n    const S = this.S, a = this.alive();\n    if (a.length === 2) {\n      S.golden = { a: a[0], b: a[1], judge: S.lastOut, wins: {} };\n      S.golden.wins[a[0]] = 0; S.golden.wins[a[1]] = 0;\n      S.screen = \"duelIntro\"; this.u(); return;\n    }\n    this.newRound(); this.u();\n  }\n  tick() {\n    const r = this.S.round;\n    if (!r) return;\n    if (r.opa) { r.opaT++; this.u(); return; }\n    r.times[r.cur]--;\n    if (r.times[r.cur] <= 0) {\n      r.times[r.cur] = 0; r.cur++;\n      if (navigator.vibrate) navigator.vibrate(180);\n      if (r.cur >= r.order.length) return this.go(\"verdict\");\n    }\n    this.u();\n  }\n  saveRecord() {\n    const S = this.S;\n    S.records = S.records.concat([{\n      when: new Date().toLocaleDateString(\"el-GR\"),\n      winner: this.nm(S.champion),\n      players: S.players.map(p => p.name).join(\", \"),\n      duels: S.roundNo\n    }]);\n    try { localStorage.setItem(this.CFG.STORE_KEY, JSON.stringify(S.records)); } catch (e) {}\n  }\n  advanceIntro() {\n    const S = this.S;\n    if (S.players.length >= S.playerCount) { this.newRound(); this.u(); return; }\n    S.introIdx++; this.go(\"intro\");\n  }\n\n  /* === DEMO ΓΙΑ ΤΟ DEV RAIL ============================= */\n  seed() {\n    const S = this.S;\n    const names = [\"Νικος\", \"Μαρια\", \"Τακης\", \"Ελενη\", \"Πετρος\", \"Ζωη\"];\n    S.playerCount = 6; S.liarOn = true; S.liarIdx = 2;\n    S.players = names.map((n, i) => ({ name: n, liar: i === 2, pts: 3 + (i % 3),\n      chickens: i === 1 ? 1 : this.nCh(), alive: true, roundPts: i % 2, lost: i > 2, fought: true }));\n    S.pool = this.POOL.slice(); S.roundNo = 2; S.duelNo = 1; S.duelTotal = 6;\n    S.judge = 0; S.judgeSeed = 0; S.introIdx = 2;\n    this.newDuel();\n    const r = S.round;\n    r.vote[1] = \"pro\"; r.vote[2] = \"pro\"; r.vote[3] = \"con\"; r.vote[4] = \"con\"; r.vote[5] = \"pro\";\n    r.a = 1; r.b = 3; this.buildOrder();\n  }\n  jump(k) {\n    const S = this.S; this.stopTimer();\n    /* το dev rail θελει τουλαχιστον το demo τραπεζι των 6 */\n    if (S.players.length < 6) this.seed();\n    if (!S.round) this.newDuel();\n    if (k === \"out\" || k === \"winner\") {\n      const lastIdx = S.players.length - 1;\n      if (S.players[lastIdx]) { S.players[lastIdx].alive = false; S.lastOut = lastIdx; }\n    }\n    if (k === \"duelIntro\") {\n      const a = this.alive();\n      S.bronze = null;\n      if (a.length >= 3) {\n        S.golden = { a: a[0], b: a[1], judge: a[2], wins: {} };\n        S.golden.wins[a[0]] = 1; S.golden.wins[a[1]] = 0;\n      }\n    }\n    if (k === \"winner\") { S.champion = this.alive()[0] ?? 0; }\n    if (k === \"replay\") {\n      const a = this.alive();\n      S.tie = { pool: a.slice(0, Math.max(3, Math.min(4, a.length - 1))), judge: a[a.length - 1] };\n    }\n    if (k === \"chicken\") {\n      if (S.round.a == null) S.round.a = this.alive()[1];\n      if (S.round.b == null) S.round.b = this.alive()[2];\n      S.round.asking = \"a\";\n    }\n    S.screen = k;\n    if (k === \"contra\") { this.buildOrder(); this.runTimer(); }\n    this.u();\n  }\n\n  /* === ΣΤΥΛ ΠΟΥ ΑΛΛΑΖΕΙ ΜΕ ΤΗΝ ΚΑΤΑΣΤΑΣΗ =============== */\n  ROW(kind) {\n    const base = \"display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:12px 14px;border-radius:14px;border:3px solid #0b0203;font:700 17px Comfortaa,sans-serif;cursor:pointer;text-align:left;\";\n    if (kind === \"pro\") return base + \"background:linear-gradient(#3ed878,#159a4b);color:#fff6e2;box-shadow:inset 0 2px 0 rgba(255,255,255,.32),0 4px 0 #0a5c2c\";\n    if (kind === \"con\") return base + \"background:linear-gradient(#ff7a6b,#c8332a);color:#fff6e2;box-shadow:inset 0 2px 0 rgba(255,255,255,.32),0 4px 0 #7d150f\";\n    if (kind === \"off\") return base + \"background:linear-gradient(#3b0d12,#280709);color:rgba(255,246,226,.45);box-shadow:0 4px 0 rgba(0,0,0,.45)\";\n    return base + \"background:linear-gradient(#5c1219,#3f0b11);color:#fff6e2;box-shadow:inset 0 2px 0 rgba(255,255,255,.14),0 4px 0 rgba(0,0,0,.5)\";\n  }\n  MARK(kind) {\n    const base = \"flex:none;padding:4px 9px;border-radius:8px;font:700 10px Comfortaa,sans-serif;letter-spacing:.14em;text-transform:uppercase;\";\n    if (kind === \"pro\") return base + \"background:rgba(0,0,0,.28);color:#eafff0\";\n    if (kind === \"con\") return base + \"background:rgba(0,0,0,.28);color:#fff0ee\";\n    return base + \"background:rgba(0,0,0,.3);color:rgba(255,246,226,.5)\";\n  }\n  CHIP(on, tone) {\n    const base = \"flex:1;padding:12px 8px;border-radius:14px;border:3px solid #0b0203;font:700 16px Comfortaa,sans-serif;cursor:pointer;\";\n    if (!on) return base + \"background:linear-gradient(#5c1219,#3f0b11);color:rgba(255,246,226,.6);box-shadow:inset 0 2px 0 rgba(255,255,255,.12),0 4px 0 rgba(0,0,0,.5)\";\n    if (tone === \"pink\") return base + \"background:linear-gradient(#ff7ec0,#d2358c);color:#fff6e2;box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 4px 0 #8d1d5c;text-shadow:0 2px 0 rgba(0,0,0,.25)\";\n    return base + \"background:linear-gradient(#ffe083,#e2a512);color:#3a1c00;box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 4px 0 #9c6c05\";\n  }\n  STEP(dis) {\n    const base = \"width:56px;height:56px;flex:none;border-radius:50%;border:3px solid #0b0203;font:700 28px/1 Comfortaa,sans-serif;cursor:pointer;background:linear-gradient(#ffe083,#e2a512);color:#3a1c00;box-shadow:inset 0 3px 0 rgba(255,255,255,.6),0 5px 0 #9c6c05;\";\n    return dis ? base + \"opacity:.35;cursor:default\" : base;\n  }\n  BIG(tone, dis) {\n    const base = \"display:block;width:100%;margin-top:12px;padding:17px 16px;border:3px solid #0b0203;border-radius:18px;font:700 21px Comfortaa,sans-serif;color:#fff6e2;cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.3);\";\n    if (dis) return base + \"background:linear-gradient(#4a2126,#38171b);color:rgba(255,246,226,.35);box-shadow:0 6px 0 rgba(0,0,0,.4);cursor:default\";\n    if (tone === \"orange\") return base + \"background:linear-gradient(#ff9b4a,#d1660f);box-shadow:inset 0 3px 0 rgba(255,255,255,.4),0 7px 0 #7d3a05\";\n    if (tone === \"pink\") return base + \"background:linear-gradient(#ff7ec0,#d2358c);box-shadow:inset 0 3px 0 rgba(255,255,255,.4),0 7px 0 #8d1d5c\";\n    return base + \"background:linear-gradient(#5b9ff0,#2364b4);box-shadow:inset 0 3px 0 rgba(255,255,255,.32),0 7px 0 #123f73\";\n  }\n\n  /* === RENDER VALS ====================================== */\n  renderVals() {\n    const S = this.S, sc = S.screen, r = S.round;\n    const devKeys = [\n      [\"home\", \"Αρχικη\"], [\"rules\", \"Κανονες\"], [\"records\", \"Πρακτικα\"], [\"intro\", \"Ονομα\"],\n      [\"role\", \"Ρολος\"], [\"roundStart\", \"Δικαστης\"], [\"eyes\", \"Ματια\"], [\"hearing\", \"Μετρημα\"],\n      [\"select\", \"Επιλογη\"], [\"chicken\", \"Κοτα\"], [\"contra\", \"Κοντρα\"], [\"verdict\", \"Ετυμηγορια\"],\n      [\"roundEnd\", \"Ταμειο\"], [\"out\", \"Αποβολη\"], [\"replay\", \"Ισοπαλια\"], [\"duelIntro\", \"Χρυση\"],\n      [\"winner\", \"Νικητης\"]\n    ];\n\n    const v = {\n      /* ---- πλοηγηση */\n      atHome: sc === \"home\", atRules: sc === \"rules\", atRecords: sc === \"records\",\n      atIntro: sc === \"intro\", atRole: sc === \"role\", atRoundStart: sc === \"roundStart\",\n      atEyes: sc === \"eyes\", atHearing: sc === \"hearing\", atSelect: sc === \"select\",\n      atChicken: sc === \"chicken\", atContra: sc === \"contra\", atVerdict: sc === \"verdict\",\n      atRoundEnd: sc === \"roundEnd\", atOut: sc === \"out\", atReplay: sc === \"replay\",\n      atDuel: sc === \"duelIntro\", atWinner: sc === \"winner\",\n      bulbs: (this.props.bulbsOn ?? true) === true,\n      noBulbs: (this.props.bulbsOn ?? true) !== true,\n      devOn: (this.props.devRail ?? false) === false,\n      devItems: devKeys.map(([k, label]) => ({\n        label,\n        on: () => this.jump(k),\n        style: \"padding:6px 8px;border-radius:9px;border:2px solid \" + (sc === k ? \"#ffc72c\" : \"rgba(255,199,44,.2)\") +\n          \";background:\" + (sc === k ? \"rgba(255,199,44,.22)\" : \"rgba(255,246,226,.05)\") +\n          \";color:\" + (sc === k ? \"#ffe083\" : \"rgba(255,246,226,.7)\") +\n          \";font:700 10.5px Comfortaa,sans-serif;text-align:left;cursor:pointer\"\n      })),\n\n      /* ---- αρχικη */\n      playerCount: S.playerCount,\n      chickens: this.nCh(), goldenTarget: this.nTarget(),\n      dec: () => { S.playerCount = Math.max(this.CFG.MIN_PLAYERS, S.playerCount - 1); this.u(); },\n      inc: () => { S.playerCount = Math.min(this.CFG.MAX_PLAYERS, S.playerCount + 1); this.u(); },\n      decStyle: this.STEP(S.playerCount <= this.CFG.MIN_PLAYERS),\n      incStyle: this.STEP(S.playerCount >= this.CFG.MAX_PLAYERS),\n      timeChips: this.CFG.TIME_OPTIONS.map(t => ({\n        label: t + \"''\", style: this.CHIP(S.timeSec === t), on: () => { S.timeSec = t; this.u(); }\n      })),\n      liarOnStyle: this.CHIP(S.liarOn, \"pink\"), liarOffStyle: this.CHIP(!S.liarOn, \"pink\"),\n      liarOn: () => { S.liarOn = true; this.u(); },\n      liarOff: () => { S.liarOn = false; this.u(); },\n      start: () => this.startGame(),\n      goRules: () => this.go(\"rules\"), goRecords: () => this.go(\"records\"),\n      goBack: () => this.go(S.back || \"home\"),\n\n      /* ---- πρακτικα */\n      records: S.records.slice().reverse(),\n      noRecords: S.records.length === 0,\n\n      /* ---- ονομα */\n      introNo: S.introIdx + 1, introTotal: S.playerCount,\n      nameRef: this.nameRef,\n      namePills: S.players.map(p => ({ name: p.name })),\n      nameEmpty: !S.nameDraft.trim(),\n      nameBtnStyle: this.BIG(\"blue\", !S.nameDraft.trim()),\n      onNameInput: e => {\n        const was = !S.nameDraft.trim(), now = !e.target.value.trim();\n        S.nameDraft = e.target.value;\n        if (was !== now) this.u();\n      },\n      nameOk: () => {\n        const nmv = S.nameDraft.trim();\n        if (!nmv) return;\n        S.players.push({ name: nmv.slice(0, this.CFG.MAX_NAME),\n          liar: S.liarOn && S.players.length === S.liarIdx,\n          pts: 0, chickens: this.nCh(), alive: true, roundPts: 0, lost: false, fought: false });\n        S.nameDraft = \"\";\n        if (this.nameRef.current) this.nameRef.current.value = \"\";\n        if (S.liarOn) this.go(\"role\"); else this.advanceIntro();\n      },\n\n      /* ---- ρολος */\n      roleOk: () => this.advanceIntro(),\n\n      /* ---- γυρος */\n      roundNo: S.roundNo, duelTotal: S.duelTotal, duelIdx: S.duelNo + 1,\n      judgeName: this.nm(S.judge),\n      alivePills: this.alive().map(i => ({ name: this.nm(i) })),\n      toEyes: () => this.go(\"eyes\"), toHearing: () => this.go(\"hearing\"),\n      newRound: () => { this.newRound(); this.u(); },\n      tieCount: S.tie ? S.tie.pool.length : 0,\n      tieA: S.tie ? this.nm(S.tie.pool[0]) : \"\",\n      tieB: S.tie ? this.nm(S.tie.pool[1]) : \"\",\n      tieJudge: S.tie ? this.nm(S.tie.judge) : \"\",\n      tiePills: S.tie ? S.tie.pool.map((i, k) => ({\n        name: this.nm(i),\n        style: \"padding:6px 13px;border-radius:999px;border:3px solid #0b0203;font:700 14px Comfortaa,sans-serif;box-shadow:0 3px 0 rgba(0,0,0,.45);\" +\n          (k < 2\n            ? \"background:linear-gradient(#ffe083,#e2a512);color:#3a1c00\"\n            : \"background:linear-gradient(#5c1219,#3f0b11);color:rgba(255,246,226,.7)\")\n      })) : [],\n      tieGo: () => {\n        if (!S.tie) return;\n        S.judge = S.tie.judge;\n        this.newDuel();\n        S.round.a = S.tie.pool[0]; S.round.b = S.tie.pool[1];\n        this.buildOrder(); this.go(\"contra\"); this.runTimer();\n      },\n      tally: () => { this.closeRound(); this.resolveElimination(); this.u(); },\n      afterOut: () => this.afterOut(),\n      again: () => {\n        this.stopTimer();\n        S.screen = \"home\"; S.players = []; S.round = null; S.golden = null; S.bronze = null;\n        S.roundNo = 0; S.champion = null; S.lastOut = null; this.u();\n      }\n    };\n\n    /* ---- ρολος (καρτα) */\n    const last = S.players[S.players.length - 1];\n    const liar = !!(last && last.liar);\n    v.roleName = last ? last.name : \"\";\n    v.roleTitle = liar ? \"ΑΝΤΙΦΑΤΗΣ\" : \"ΔΙΚΗΓΟΡΟΣ\";\n    v.roleSuit = liar ? \"♦\" : \"♠\";\n    v.roleSuitColor = liar ? \"#c0392b\" : \"#1b1008\";\n    v.roleText = liar\n      ? \"Υποστηριζεις το αντιθετο απο αυτο που πιστευεις. Πρεπει να χασεις τουλαχιστον μια κοντρα σε καθε γυρο, αλλιως ο γυρος σου δεν μετραει. Μην σε πιασουν.\"\n      : \"Παιζεις κανονικα. Λες αυτο που πιστευεις και προσπαθεις να κερδισεις την κοντρα.\";\n    v.roleCardStyle = \"position:relative;width:100%;padding:30px 22px 26px;border-radius:18px;border:3px solid #0b0203;background:linear-gradient(#fffdf5,#f1e2c7);box-shadow:0 10px 0 rgba(0,0,0,.5),0 18px 34px rgba(0,0,0,.4),\" +\n      (liar ? \"inset 0 0 0 3px rgba(192,57,43,.35)\" : \"inset 0 0 0 3px rgba(35,100,180,.28)\") + \";animation:pop .45s cubic-bezier(.2,1.5,.4,1) both\";\n    v.roleTitleStyle = \"margin:8px 0 6px;font:700 32px/1.1 Comfortaa,sans-serif;letter-spacing:-.5px;color:\" +\n      (liar ? \"#c0392b\" : \"#1f5da8\");\n    v.roleBtnStyle = this.BIG(liar ? \"pink\" : \"blue\");\n\n    /* ---- μετρημα */\n    if (r) {\n      v.opinion = r.op;\n      const pro = this.sideOf(\"pro\"), con = this.sideOf(\"con\");\n      const voters = this.alive().filter(i => i !== S.judge);\n      const done = pro.length + con.length, all = voters.length;\n      v.voteDone = done; v.voteAll = all;\n      v.needMore = done < all;\n      v.isUnanimous = done >= all && (!pro.length || !con.length);\n      v.hasSplit = done >= all && pro.length > 0 && con.length > 0;\n      v.voteRows = voters.map(i => {\n        const st = r.vote[i];\n        return {\n          name: this.nm(i), style: this.ROW(st || \"\"), markStyle: this.MARK(st || \"\"),\n          mark: st === \"pro\" ? \"ΥΠΕΡ\" : st === \"con\" ? \"ΚΑΤΑ\" : \"—\",\n          on: () => { r.vote[i] = st === \"pro\" ? \"con\" : st === \"con\" ? undefined : \"pro\"; this.u(); }\n        };\n      });\n      v.unanimousGo = () => { this.nextDuel(); this.u(); };\n      v.toSelect = () => this.go(\"select\");\n\n      /* ---- επιλογη μονομαχων */\n      const mk = (list, sel, key) => list.map(i => ({\n        name: this.nm(i),\n        style: this.ROW(sel === i ? key : \"off\"),\n        markStyle: this.MARK(sel === i ? key : \"\"),\n        mark: sel === i ? \"ΠΑΙΖΕΙ\" : \"ενορκος\",\n        on: () => { if (key === \"pro\") r.a = i; else r.b = i; this.u(); }\n      }));\n      v.proRows = mk(pro, r.a, \"pro\");\n      v.conRows = mk(con, r.b, \"con\");\n      v.selectReady = r.a != null && r.b != null;\n      v.selectPending = !(r.a != null && r.b != null);\n      v.toChicken = () => { r.asking = \"a\"; this.go(\"chicken\"); };\n\n      /* ---- κοτα */\n      const who = r.asking === \"a\" ? r.a : r.b;\n      const left = who == null ? 0 : this.P(who).chickens;\n      v.chickenName = who == null ? \"\" : this.nm(who);\n      v.chickenSide = r.asking === \"a\" ? \"Πλευρα: υπερ\" : \"Πλευρα: κατα\";\n      v.chickenLeft = left;\n      v.noChickens = left <= 0;\n      v.chickLabel = left > 0 ? \"Κοτα!\" : \"Δεν εχεις μαρκες\";\n      v.chickBtnStyle = this.BIG(\"orange\", left <= 0);\n      v.chickenTokens = Array.from({ length: this.nCh() }).map((_, k) => ({\n        style: \"width:38px;height:38px;border-radius:50%;border:3px solid #0b0203;display:flex;align-items:center;justify-content:center;font:700 15px Comfortaa,sans-serif;\" +\n          (k < left\n            ? \"background:linear-gradient(#ff9b4a,#d1660f);color:#fff6e2;box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 4px 0 #7d3a05\"\n            : \"background:linear-gradient(#33090d,#240609);color:rgba(255,246,226,.25);box-shadow:inset 0 2px 6px rgba(0,0,0,.7)\")\n      }));\n      v.play = () => {\n        if (r.asking === \"a\") { r.asking = \"b\"; this.u(); return; }\n        this.buildOrder(); this.go(\"contra\"); this.runTimer();\n      };\n      v.chick = () => {\n        const w = r.asking === \"a\" ? r.a : r.b;\n        const other = r.asking === \"a\" ? r.b : r.a;\n        if (w == null || this.P(w).chickens <= 0) return;\n        this.P(w).chickens--;\n        this.awardDuel(other, w);\n        this.nextDuel(); this.u();\n      };\n\n      /* ---- κοντρα */\n      const cur = r.order[r.cur];\n      v.contraTag = r.opa ? \"ΟΠΑ\" : cur ? (cur.side === \"pro\" ? \"ΥΠΕΡ\" : \"ΚΑΤΑ\") : \"—\";\n      v.opaOn = r.opa === true; v.opaOff = r.opa !== true;\n      v.opaTime = this.mmss(r.opaT);\n      v.opaStart = () => { r.opa = true; r.opaT = 0; this.u(); };\n      v.opaEnd = () => { r.opa = false; this.u(); };\n      v.speakers = r.order.map((o, k) => {\n        const on = k === r.cur && !r.opa, spent = k < r.cur;\n        return {\n          who: o.side === \"pro\" ? \"Υπερ\" : \"Κατα\",\n          name: this.nm(o.p),\n          time: this.mmss(r.times[k]),\n          style: \"padding:14px;border-radius:18px;border:3px solid #0b0203;text-align:left;\" +\n            (on\n              ? \"background:linear-gradient(\" + (o.side === \"pro\" ? \"#12864d,#0b5731\" : \"#8a2129,#5a1017\") + \");box-shadow:inset 0 0 0 3px rgba(255,199,44,.6),inset 0 3px 0 rgba(255,255,255,.16),0 6px 0 rgba(0,0,0,.5)\"\n              : \"background:linear-gradient(#3f0d13,#2c080d);box-shadow:0 5px 0 rgba(0,0,0,.45);\" + (spent ? \"opacity:.42\" : \"\")),\n          clockStyle: \"margin-top:8px;padding:\" + (on ? \"10px 0 8px\" : \"6px 0 5px\") + \";border-radius:12px;background:#0d0203;box-shadow:inset 0 3px 10px rgba(0,0,0,.9);text-align:center;font:400 \" +\n            (on ? \"34px\" : \"16px\") + \"/1 'Press Start 2P',monospace;color:\" +\n            (on ? \"#ffc72c;text-shadow:0 0 16px rgba(255,199,44,.7)\" : \"rgba(255,246,226,.45)\")\n        };\n      });\n      v.nextSpeaker = () => {\n        r.cur++;\n        if (r.cur >= r.order.length) return this.go(\"verdict\");\n        this.u();\n      };\n      v.endContra = () => this.go(\"verdict\");\n\n      /* ---- ετυμηγορια */\n      const jurors = this.alive().filter(i => i !== S.judge && i !== r.a && i !== r.b).length;\n      v.juryText = jurors ? \"Οι ενορκοι αποφασιζουν\" : \"Ο δικαστης αποφασιζει\";\n      v.aName = this.nm(r.a); v.bName = this.nm(r.b);\n      const decide = key => () => {\n        const w = key === \"a\" ? r.a : r.b, l = key === \"a\" ? r.b : r.a;\n        if (S.golden) {\n          S.golden.wins[w] = (S.golden.wins[w] || 0) + 1;\n          if (S.golden.wins[w] >= this.nTarget()) {\n            S.champion = w; this.saveRecord(); return this.go(\"winner\");\n          }\n          this.newDuel();\n          S.round.a = S.golden.a; S.round.b = S.golden.b;\n          return this.go(\"duelIntro\");\n        }\n        if (S.tie) {\n          const at = S.tie.pool.indexOf(w);\n          if (at >= 0) S.tie.pool.splice(at, 1);   /* ο νικητης σωθηκε */\n          if (S.tie.pool.length <= 2) {\n            S.bronze = { a: S.tie.pool[0], b: S.tie.pool[1], judge: S.tie.judge };\n            S.tie = null; return this.go(\"duelIntro\");\n          }\n          return this.go(\"replay\");\n        }\n        if (S.bronze) { this.eliminate(l); S.bronze = null; return this.go(\"out\"); }\n        this.awardDuel(w, l); this.nextDuel(); this.u();\n      };\n      v.winA = decide(\"a\"); v.winB = decide(\"b\");\n    }\n\n    /* ---- αποβολη */\n    v.outName = S.lastOut == null ? \"\" : this.nm(S.lastOut);\n    v.outPills = S.players.map(p => ({\n      name: p.name,\n      style: \"padding:6px 13px;border-radius:999px;border:3px solid #0b0203;font:700 14px Comfortaa,sans-serif;box-shadow:0 3px 0 rgba(0,0,0,.45);\" +\n        (p.alive\n          ? \"background:linear-gradient(#12864d,#0b5731);color:#fff6e2\"\n          : \"background:linear-gradient(#3b0d12,#280709);color:rgba(255,246,226,.4);text-decoration:line-through\")\n    }));\n\n    /* ---- χαλκινη / χρυση */\n    const d = S.bronze || S.golden;\n    const gold = !!S.golden;\n    v.duelGold = gold;\n    v.duelEyebrow = gold ? \"Ο τελικος του τραπεζιου\" : \"Για την παραμονη\";\n    v.duelTitle = gold ? \"Χρυση κοντρα\" : \"Χαλκινη κοντρα\";\n    v.duelSuit = gold ? \"♦\" : \"♣\";\n    v.duelNote = gold ? \"Πρωτος στις \" + this.nTarget() + \" νικες σπαει τη μπανκα.\" : \"Οποιος κερδισει μενει στο τραπεζι.\";\n    v.duelMedalStyle = \"margin:0 auto 14px;width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 40px Comfortaa,sans-serif;border:4px solid #0b0203;\" +\n      (gold\n        ? \"background:linear-gradient(#ffe083,#dd9d0c);color:#8c2b1e;box-shadow:inset 0 4px 0 rgba(255,255,255,.6),0 8px 0 #9c6c05,0 0 34px rgba(255,199,44,.5)\"\n        : \"background:linear-gradient(#d99a6a,#9c5f34);color:#3a1c00;box-shadow:inset 0 4px 0 rgba(255,255,255,.45),0 8px 0 #66381b\");\n    v.duelTitleStyle = \"margin:0 0 10px;font:700 30px/1.1 Comfortaa,sans-serif;color:\" + (gold ? \"#ffe083\" : \"#f0c9b2\") +\n      \";text-shadow:0 3px 0 rgba(0,0,0,.5)\" + (gold ? \",0 0 26px rgba(255,199,44,.45)\" : \"\");\n    v.dA = d ? this.nm(d.a) : \"\"; v.dB = d ? this.nm(d.b) : \"\"; v.dJudge = d ? this.nm(d.judge) : \"\";\n    v.dWinsA = gold ? (S.golden.wins[S.golden.a] || 0) : 0;\n    v.dWinsB = gold ? (S.golden.wins[S.golden.b] || 0) : 0;\n    v.duelGo = () => {\n      const dd = S.bronze || S.golden;\n      if (!dd) return;\n      S.judge = dd.judge;\n      if (!S.round) this.newDuel();\n      S.round.a = dd.a; S.round.b = dd.b;\n      this.buildOrder(); this.go(\"contra\"); this.runTimer();\n    };\n\n    /* ---- νικητης */\n    v.champName = S.champion == null ? \"\" : this.nm(S.champion);\n    const li = S.players.findIndex(p => p.liar);\n    v.showLiar = S.liarOn && li >= 0;\n    v.liarWasName = li >= 0 ? this.nm(li) : \"\";\n\n    return v;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
