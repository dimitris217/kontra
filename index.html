<title>ΚΟΝΤΡΑ</title>

<!--
  ΚΟΝΤΡΑ — prototype
  ─────────────────────────────────────────────
  ΘΕΛΕΙ ΤΟΝ ΦΑΚΕΛΟ img/ ΔΙΠΛΑ ΤΟΥ:
    index.html
    img/ kontra.png playerCount.png dinworko.png akyro.png uper.png kata.png
         info.png praktika.png zero.png one.png two.png three.png four.png
         five.png six.png seven.png eight.png nine.png

  Για να αλλάξεις ζωγραφιά: αντικατέστησε το PNG με ίδιο όνομα. Κώδικας δεν αλλάζει.

    [1]  ΧΡΩΜΑΤΑ & ΓΡΑΜΜΑΤΟΣΕΙΡΕΣ   <- ξεκίνα από εδώ για αλλαγές UI
    [1β] ΚΟΥΜΠΙΑ-ΕΙΚΟΝΕΣ & ΜΕΤΡΗΤΗΣ <- το καινούριο κομμάτι
    [2]  ΒΑΣΙΚΗ ΔΙΑΤΑΞΗ
    [3]  ΤΥΠΟΓΡΑΦΙΑ
    [4]  ΚΟΥΜΠΙΑ & ΠΕΔΙΑ
    [5]  ΚΑΡΤΕΣ, ΨΗΦΟΦΟΡΙΑ, ΣΗΜΕΙΩΣΕΙΣ
    [6]  ΣΦΡΑΓΙΔΑ (το σήμα κατατεθέν)
    [7]  ΧΡΟΝΟΜΕΤΡΟ & ΟΜΙΛΗΤΕΣ
    [8]  ΡΥΘΜΙΣΕΙΣ ΠΑΙΧΝΙΔΙΟΥ        <- τιμωρία, χρόνοι, όρια, modes
    [9]  ΑΠΟΘΗΚΕΥΣΗ (πρακτικά)
    [10] ΚΑΤΑΣΤΑΣΗ ΠΑΙΧΝΙΔΙΟΥ
    [11] ΟΘΟΝΕΣ                       <- το HTML κάθε οθόνης
    [12] ΛΟΓΙΚΗ
    [13] RENDER & ΣΥΜΒΑΝΤΑ

  ΡΟΗ ΟΘΟΝΩΝ:
    count -> intro -> more -> (intro...) -> lastCall -> round
    round -> eyes -> hearing -> select -> contra -> verdict
          -> sentence -> archive -> (extra) -> round

  >>> ΤΟ ΚΕΙΜΕΝΟ ΤΩΝ ΚΑΝΟΝΩΝ μπαίνει στην οθόνη V.rules, τμήμα [11].
      Ψάξε τη σήμανση: ΕΔΩ ΜΠΑΙΝΟΥΝ ΟΙ ΚΑΝΟΝΕΣ ΑΠΟ ΤΟ PDF
-->

<style>
/* === [1] ΧΡΩΜΑΤΑ & ΓΡΑΜΜΑΤΟΣΕΙΡΕΣ ============================== */
:root{
  --ink:#2E1C0E;        /* φόντο */
  --surface:#3F4A52;    /* κάρτες, πεδία = το μέσα των σχεδίων */
  --surface-2:#3F4A52;  /* κουμπιά κειμένου */
  --line:#000000;       /* περιγράμματα, όπως στις ζωγραφιές */
  --bone:#FFF3E4;       /* κείμενο */
  --muted:#C9A98F;      /* δευτερεύον κείμενο */
  --blood:#ED1C24;      /* το κόκκινο σου */
  --blood-dim:#6E211A;
  --brass:#FFC90E;      /* το κίτρινο σου */

  /* Γραμματοσειρα: Comfortaa, κατεβαινει με τη σελιδα και
     φαινεται ΙΔΙΑ σε καθε κινητο (Android, iPhone, ταμπλετα).
     Εχει ελληνικα, ειναι στρογγυλεμενη, και ειναι η ιδια με
     την Κοντρα στα Γρηγορα.                                */
  --display:Comfortaa,"Trebuchet MS",system-ui,sans-serif;
  --body:Comfortaa,"Trebuchet MS",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;

  /* το μαύρο περίγραμμα των γραμμάτων — άλλαξε το 2px για πιο χοντρό */
  --stroke:-2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
}

/* === [1β] ΚΟΥΜΠΙΑ-ΕΙΚΟΝΕΣ & ΜΕΤΡΗΤΗΣ ==========================
   .ibtn      = κουμπί που είναι σκέτη η ζωγραφιά σου
   .art       = ζωγραφιά χωρίς κουμπί (τίτλος, ετικέτα)
   .ibtn.small= τα στρογγυλά (info, ο Φάκελος)
   Οι εικόνες έχουν το ίδιο καφέ με το φόντο, οπότε χωνεύουν μόνες τους. */
.ibtn{display:block;width:100%;padding:0;margin-top:10px;background:none;border:none;
  cursor:pointer;transition:transform .1s}
.ibtn img,.art{display:block;width:100%;height:auto}
.ibtn img{pointer-events:none}
.ibtn:active{transform:scale(.96)}
.ibtn:disabled{opacity:.4;cursor:default}
.art{margin:2px 0 4px}

/* ΤΟ ΠΙΣΩ — στρογγυλο, χοντρο μαυρο περιγραμμα, ασπρο μεσα,
   μαυρο βελακι. Μπαινει πανω αριστερα, σε οθονες οπου μπορει
   να διαλεξε κανεις καταλαθος.                                  */
.backrow{display:flex;justify-content:flex-start;margin:0 0 4px}
.back{width:46px;height:46px;flex:none;padding:0;border-radius:50%;
  border:4px solid #000;background:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 0 rgba(0,0,0,.5);transition:transform .1s,box-shadow .1s}
.back:active{transform:translateY(4px);box-shadow:0 0 0 rgba(0,0,0,.5)}
.back svg{display:block;width:26px;height:26px;pointer-events:none}
.art.mid{width:62%;margin:6px auto 2px}   /* «Αριθμος Ατομων» μικρότερο */

/* η γραμμή στην κορυφή: κανόνες αριστερά, ο Φάκελος δεξιά */
.hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2px}
.hdr .ibtn{width:54px;margin:0;flex:none}
/* το κουμπί λήξης στη μέση της κορυφής — μικρό, μπαίνει από τον 3ο γύρο */
.hdr .ibtn.endbtn{width:76px;align-self:center}

/* «ΠΑΙΧΤΕΣ» — ετικέτα αντί για ζωγραφιά */
.players{font-family:var(--display);font-weight:700;font-size:27px;text-align:center;
  color:var(--bone);margin:14px 0 2px;
  text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000}

/* επιλεγμένο / ανεπίλεκτο κουμπί-ζωγραφιά */
.ibtn.dim{opacity:.42}

/* Όλα τα κουμπιά-ζωγραφιές: πλήρες πλάτος, κεντραρισμένα.
   (Οι παλιές ρυθμίσεις ανά κουμπί αφαιρέθηκαν.)            */

/* δύο ζωγραφιστά κουμπιά δίπλα-δίπλα, στο ΙΔΙΟ ύψος
   (οι ζωγραφιές έχουν διαφορετικές αναλογίες, οπότε κλειδώνουμε το ύψος) */
.row.even{align-items:center;gap:14px}
.row.even .ibtn img{height:92px;width:auto;margin:0 auto}

/* ── ΖΩΓΡΑΦΙΣΤΑ ΠΛΑΙΣΙΑ ΚΕΙΜΕΝΟΥ ───────────────────────────
   Η ζωγραφιά είναι ΦΟΝΤΟ που τεντώνεται στο μέγεθος του κουτιού.
   Το κείμενο είναι κανονικό στοιχείο με padding σε px, οπότε
   κρατάει πάντα την ίδια απόσταση από το περίγραμμα, ό,τι
   μέγεθος οθόνης κι αν έχει. ΑΠΟΣΤΑΣΗ = τα px του padding.   */
.field{margin:12px 0 8px;
  padding:30px 44px;min-height:104px;display:flex;align-items:center}
.field.op{
  padding:56px 60px;min-height:240px;align-items:flex-start}
.field input,.field textarea{width:100%;background:none;border:none;outline:none;
  color:#161616;font-family:var(--display);font-weight:400;text-shadow:none;
  font-size:19px;line-height:1.4;padding:0;margin:0;display:block;text-align:left;
  -webkit-appearance:none}
.field textarea{min-height:130px;resize:none}
.field input::placeholder,.field textarea::placeholder{color:#8C8C8C}

/* μετρητής αριθμού ατόμων */
.counter{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:6px}
.counter .pm{width:64px;flex:none;padding:0;background:none;border:none;cursor:pointer}
.counter .pm svg{display:block;width:100%;height:auto}
.counter .pm:active{transform:scale(.94)}
.counter .pm:disabled{opacity:.35}
.counter .digits{display:flex;gap:4px}
.counter .digits img{display:block;height:84px;width:auto}

/* τα ΥΠΕΡ / ΚΑΤΑ μέσα στη λίστα του μετρήματος */
.t img{height:40px;width:auto;display:block;flex:none}

/* === [2] ΒΑΣΙΚΗ ΔΙΑΤΑΞΗ ====================================== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#000;color:var(--bone);font-family:var(--body);
  font-size:17px;line-height:1.45;overscroll-behavior:none}
/* Η κορνίζα της εφαρμογής: μαύρη, στρογγυλεμένη.
   ΠΑΧΟΣ = το 11px. ΣΤΡΟΓΓΥΛΕΜΑ = το border-radius.
   Η inset σκιά ακολουθεί μόνη της τη στρογγυλή γωνία.        */
#app{position:relative;max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  background:var(--ink);text-align:center;
  border:11px solid #000;border-radius:28px;
  padding:calc(env(safe-area-inset-top) + 22px) 20px calc(env(safe-area-inset-bottom) + 22px)}
.fill{flex:1}
.row{display:flex;gap:10px;align-items:flex-end}
.row .btn{flex:1}
.row .ibtn{flex:1}
hr{border:none;border-top:4px solid rgba(0,0,0,.5);margin:18px 0}

/* === [3] ΤΥΠΟΓΡΑΦΙΑ ========================================== */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--muted);margin:0 0 14px}
.eyebrow b{color:var(--brass);font-weight:400}
h1{text-align:center;font-family:var(--display);font-weight:700;font-size:40px;line-height:1.05;
  margin:0 0 6px;color:var(--bone);
  text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000}
h2{font-family:var(--display);font-weight:700;font-size:25px;line-height:1.2;margin:0 0 10px}
.lede{color:var(--muted);margin:0 0 22px;font-size:15px}
.count{font-family:var(--mono);font-size:12px;letter-spacing:.14em;
  color:var(--muted);text-transform:uppercase;margin-top:14px}
.mini{font-family:var(--mono);font-size:12px;letter-spacing:.1em;
  color:var(--muted);text-align:center;margin-top:14px}

/* Comic Sans λευκό έντονο με μαύρο περίγραμμα — ΠΑΝΤΟΥ.
   Οι μόνες εξαιρέσεις είναι τα πεδία μέσα στα ζωγραφιστά
   textbox (πιο κάτω), που είναι μαύρα πάνω σε λευκό.        */
#app, #app *{font-family:var(--display)}
#app h1, #app h2, #app .lede, #app .count, #app .mini, #app .eyebrow,
#app label, #app .card, #app .rules, #app .rules h3, #app .players,
#app .chip, #app .t span, #app .t em, #app .side .who, #app .clock,
#app .rec .h, #app .rec .o, #app .rec .n, #app details.notes summary{
  font-weight:700;
  text-shadow:var(--stroke);
}
/* τα ουδέτερα γίνονται λευκά· τα κίτρινα μένουν κίτρινα */
#app .lede, #app .count, #app .mini, #app .eyebrow, #app label,
#app .side .who, #app .t em, #app .rec .h, #app .rules{ color:var(--bone) }

/* === [4] ΚΟΥΜΠΙΑ & ΠΕΔΙΑ ===================================== */
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.btn{display:block;width:100%;padding:14px 16px;margin-top:10px;
  background:var(--surface-2);border:5px solid var(--line);
  border-radius:48% 52% 50% 50% / 60% 56% 44% 40%;
  font-family:var(--display);font-size:20px;font-weight:700;color:var(--blood);
  text-shadow:-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,2px 2px 0 #fff,
              0 -2px 0 #fff,0 2px 0 #fff,-2px 0 0 #fff,2px 0 0 #fff;
  text-align:center;transition:transform .09s}
.btn:active{transform:scale(.95)}
.btn.primary{color:var(--blood)}
.btn.ghost{font-size:16px;padding:11px 14px;border-width:4px}
/* τετράγωνη εκδοχή, ίδια φάση με τα πλαίσια των ονομάτων */
.btn.box{border-radius:16px}
/* ΖΩΓΡΑΦΙΣΤΟ ΚΟΥΜΠΙ — η ζωγραφιά είναι φόντο που τεντώνεται,
   το κείμενο μένει μέσα στο λευκό με σταθερό padding σε px.  */
.btn.tmpl{background:url(img/km-btn.png) no-repeat center/100% 100%;
  border:none;border-radius:0;color:#161616;text-shadow:none;
  min-height:88px;padding:22px 58px;margin-top:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;line-height:1.15}
.btn.tmpl:active{transform:scale(.96)}
.btn.brass{color:var(--brass)}
.btn:disabled{opacity:.35;cursor:default}

input,textarea{width:100%;padding:12px;background:var(--surface);color:var(--bone);
  border:4px solid var(--line);border-radius:14px;font:inherit}
textarea{min-height:120px;resize:none;font-family:var(--mono);font-size:15px;line-height:1.5}
button:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
input:focus,textarea:focus{outline:none}
label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--muted);margin:20px 0 7px}

/* πεδίο αριθμού παικτών */
input.big{font-family:var(--display);font-size:32px;text-align:center;padding:16px;
  letter-spacing:.06em}
input.big::-webkit-outer-spin-button,
input.big::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input.big[type=number]{-moz-appearance:textfield}

/* === [5] ΚΑΡΤΕΣ, ΨΗΦΟΦΟΡΙΑ ================================== */
.card{background:var(--surface);border:5px solid var(--line);border-radius:20px;
  padding:18px;font-family:var(--display);font-size:19px;line-height:1.45}

.tally{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.t{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  padding:9px 14px;background:var(--ink);border:4px solid var(--line);
  border-radius:16px;min-height:58px}
.t span{font-family:var(--display);font-size:19px;text-align:left}
.t em{font-family:var(--mono);font-size:11px;letter-spacing:.16em;font-style:normal;color:var(--muted)}
.t.pro{border-color:var(--brass);background:rgba(199,154,63,.09)}
.t.pro em{color:var(--brass)}
.t.con{border-color:var(--blood);background:rgba(163,46,36,.12)}
.t.con em{color:#D9736A}
.t.picked{border-width:2px}
.t.out{opacity:.45}

/* παιχτες */
.roster{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.chip{font-family:var(--display);font-size:15px;padding:5px 12px;
  background:var(--surface);border:3px solid var(--line);border-radius:14px}

/* ο Φάκελος */
.rec{border-left:2px solid var(--line);padding:0 0 4px 14px;margin-bottom:22px}
.rec .h{font-family:var(--mono);font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.rec .o{font-family:var(--mono);font-size:15px;line-height:1.5;margin-bottom:8px}
.rec .n{font-size:15px;color:var(--brass);white-space:pre-wrap;line-height:1.5}

/* κανόνες */
.rules{font-size:15px;color:var(--muted);line-height:1.65}
.rules b{color:var(--bone);font-weight:600}
.rules h3{font-family:var(--display);font-size:21px;color:var(--brass);margin:22px 0 6px}

/* σημειώσεις δικαστή */
details.notes{margin-top:14px}
details.notes summary{font-family:var(--mono);font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--brass);cursor:pointer;padding:10px 0;list-style:none}
details.notes summary::-webkit-details-marker{display:none}
details.notes summary::before{content:"\270E  "}
details.notes textarea{min-height:0;border:none;background:none}

/* === [6] ΣΦΡΑΓΙΔΑ =========================================== */
.stamp{border:6px double var(--line);color:var(--blood);font-family:var(--display);
  font-weight:700;font-size:clamp(28px,10vw,46px);
  text-align:center;padding:12px 10px;transform:rotate(-5deg);margin:10px 0;
  background:var(--surface);
  text-shadow:-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,2px 2px 0 #fff;
  animation:slam .42s cubic-bezier(.2,1.5,.4,1) both}
/* Η ΤΑΜΠΕΛΑ ΜΕ ΤΟ ΟΝΟΜΑ: γεματο κιτρινο με μαυρο γραμμα. Το
   κιτρινο γραμμα με λευκο περιγραμμα δεν διαβαζοταν.          */
.stamp.brass{border-color:var(--line);color:#2E1C0E;background:var(--brass);
  text-shadow:none;box-shadow:0 5px 0 rgba(0,0,0,.45)}
.stamp.small{font-size:clamp(22px,8vw,34px);border-width:3px}
@keyframes slam{
  0%{transform:rotate(-16deg) scale(2.6);opacity:0}
  60%{opacity:1}
  100%{transform:rotate(-5deg) scale(1);opacity:1}
}
@media (prefers-reduced-motion:reduce){.stamp{animation:none}}

/* === [7] ΧΡΟΝΟΜΕΤΡΟ & ΟΜΙΛΗΤΕΣ ============================== */
.clock{font-family:var(--mono);font-size:58px;letter-spacing:.04em;text-align:center;
  font-variant-numeric:tabular-nums;margin:4px 0 2px}
.side{padding:13px;border:4px solid var(--line);background:var(--surface);
  margin-bottom:8px;border-radius:18px}
.side .who{font-family:var(--display);font-size:16px;color:var(--muted);text-align:center}
.side.on{border-color:var(--brass);border-width:5px}
.side.on .who{color:var(--bone)}
.side.on.con{border-color:#000C7B}
.side.interrupt{border-color:var(--blood)}

/* ουρά ομιλητών: συμπαγείς γραμμές */
.side.compact{display:flex;align-items:center;justify-content:space-between;padding:11px 14px}
.side.compact .who{text-align:left;font-size:11px}
.side.compact .clock{font-size:19px;margin:0;color:var(--muted)}
.side.spent{opacity:.35}


/* οθόνη «κλείστε τα μάτια» */
.dark{background:#000;position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:34px;text-align:center;z-index:9;
  border:11px solid #000;border-radius:28px}
.dark p{font-family:var(--display);font-weight:700;font-size:32px;color:var(--bone);
  text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000;
  margin:0 0 34px;line-height:1.25}
.dark .btn{max-width:280px}
.dark .ibtn{max-width:250px;margin:0 auto}

/* === [14] ΚΛΕΙΔΩΜΑ ΣΕ ΜΙΑ ΟΘΟΝΗ (app mode) ====================
   Η σελιδα ΔΕΝ σκρολαρει ποτε. Σκρολαρει μονο το #app απο μεσα.
   Ετσι φευγει το pull-to-refresh, το bounce και η μπαρα του browser. */
html,body{height:100%;overflow:hidden;overscroll-behavior:none;
  touch-action:manipulation;position:fixed;inset:0;width:100%}
#app{height:100%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app input,#app textarea{-webkit-user-select:text;user-select:text}

/* === [15] ΝΑ ΜΗΝ ΚΟΒΕΤΑΙ ΚΑΝΕΝΑ ΚΕΙΜΕΝΟ ======================
   Ολα τα κουτια σπανε τη λεξη αντι να τη βγαζουν απ εξω, και τα
   ζωγραφιστα πλαισια δινουν λιγοτερο padding σε στενες οθονες.   */
#app h1,#app h2,#app .lede,#app .card,#app .rules,#app .chip,
#app .t span,#app .rec .o,#app .rec .n,#app .side .who,#app .eyebrow{
  overflow-wrap:anywhere;word-break:break-word;hyphens:auto}
.card{max-width:100%}
.field{padding:clamp(30px,8vw,42px) clamp(38px,11vw,58px);height:auto}
.field.op{padding:clamp(44px,12vw,58px) clamp(42px,12vw,62px);height:auto}
/* το textarea μεγαλωνει μονο του οσο γραφεις — τιποτα δεν κρυβεται */
.field textarea{min-height:120px;overflow:hidden;height:auto}
.field input{text-overflow:ellipsis}
/* το λογοτυπο στις οθονες καλωσορισματος — μικρο, πανω πανω */
.art.logo{width:52%;margin:0 auto 2px}

/* κοκκινη προειδοποιηση στην εδρα: ποσες υποθεσεις εμειναν */
.warn{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.3;
  color:var(--blood);margin:14px 0 0;
  text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000}

/* ΜΑΡΚΕΣ ΠΑΙΧΤΩΝ — χρωμα + σχεδιο (καρο / ριγες).
   Το inline style κανει τη δουλεια· η κλαση ειναι μονο για διαταξη. */
.pchip{max-width:100%;overflow-wrap:anywhere}
.palbtn{padding:0;border:none;background:none;flex:none;width:58px}
.palbtn img{display:block;width:100%;height:auto}
.palbtn:active{transform:scale(.94)}
/* Η παλετα πρεπει να χωραει ΠΑΝΤΑ, ακομα και σε κοντο κινητο:
   το φυλλο κυλαει μεσα του και το «Ετοιμο» μενει προσβασιμο. */
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.9);
  display:flex;align-items:flex-start;justify-content:center;
  padding:22px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal .sheet{width:100%;max-width:344px;margin:auto 0;padding:20px 18px;border-radius:22px;
  background:var(--ink);border:6px solid #000;text-align:center;
  box-shadow:inset 0 0 0 3px rgba(255,201,14,.25),0 18px 40px rgba(0,0,0,.6)}
.swatches{display:flex;flex-wrap:wrap;gap:11px;justify-content:center}
.pcell{padding:0;border:none;background:none}
.pcell:disabled{cursor:default}
/* λιστα επιλογης υποθεσεων: ταπ = τσεκ */
.picks{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.pick{display:flex;align-items:flex-start;gap:11px;width:100%;padding:13px 14px;
  border:3px solid #000;border-radius:16px;background:rgba(0,0,0,.32);
  color:var(--muted);font:inherit;font-size:15px;line-height:1.4;text-align:left;
  cursor:pointer;transition:transform .1s}
.pick .tick{flex:none;width:26px;height:26px;border:3px solid #000;border-radius:8px;
  background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;
  font-size:15px;color:#0b0203}
.pick.on{background:rgba(255,201,14,.16);border-color:var(--brass);color:var(--bone)}
.pick.on .tick{background:var(--brass)}
.pick:active{transform:scale(.98)}

/* το Υ.Σ κατω απο το πλαισιο της υποθεσης — μικρα, αριστερα */
.ps{font-size:12.5px;line-height:1.4;color:var(--muted);text-align:left;
  margin:8px 4px 0;font-weight:400}

/* === ΦΟΝΤΟ ΙΠΠΟΔΡΟΜΙΟΥ — μονο στην οθονη των κανονων =========
   Κουρεμενο γρασιδι σε λωριδες, χωματινη πιστα στη μεση, καγκελο
   πανω και γραμμη τερματισμου κατω. Το κειμενο καθεται πανω σε
   σκουρο ημιδιαφανο πανελ, για να διαβαζεται.                    */
.turf{margin:0 -8px;padding:0 8px 12px;border-radius:20px;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 24px,rgba(0,0,0,.07) 24px 48px),
    linear-gradient(#1d6132 0 56%,#8a5a2b 56% 68%,#0f3a1d 68%);
  box-shadow:inset 0 0 0 5px #000,inset 0 0 44px rgba(0,0,0,.5)}
.turf .rail{height:16px;margin:10px 2px 14px;border-radius:4px;
  background:repeating-linear-gradient(90deg,#fff3e4 0 6px,rgba(0,0,0,.4) 6px 38px);
  box-shadow:inset 0 0 0 3px #000}
.turf .finish{height:20px;margin:16px 2px 0;border-radius:4px;
  background:repeating-conic-gradient(#fff3e4 0 25%,#0b0b0b 0 50%) 0 0/14px 14px;
  box-shadow:inset 0 0 0 3px #000}
.turf .rules{background:rgba(9,25,13,.66);border:4px solid #000;border-radius:16px;
  padding:15px 15px 10px;text-align:left}
.turf .rules h3{text-align:left}
.turf .rules .mini{text-align:center}
/* η <Παρενθεση> του κανονισμου */
.rules .para{position:relative;margin:26px 0 20px;padding:18px 14px 4px;
  border:4px dashed rgba(255,201,14,.65);border-radius:16px;background:rgba(0,0,0,.34)}
.rules .para-tag{position:absolute;top:-14px;left:13px;padding:3px 11px;
  background:var(--brass);color:#3a1c00;border:3px solid #000;border-radius:9px;
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:700;text-shadow:none}
/* θεση για τη φωτογραφια που θα μπει */
.rules .photo{margin:14px 0;min-height:132px;display:flex;align-items:center;
  justify-content:center;border:4px dashed rgba(255,243,228,.4);border-radius:14px;
  background:rgba(0,0,0,.4);font-family:var(--mono);font-size:12px;letter-spacing:.1em;
  color:var(--muted);text-align:center;padding:14px;text-transform:uppercase}
/* ελαφρως κρυμμενο: θελει ενα ταπ για να ανοιξει */
.rules details.tucked{margin:26px 0 0;opacity:.45;transition:opacity .2s}
.rules details.tucked[open]{opacity:1}
.rules details.tucked summary{cursor:pointer;list-style:none;padding:9px 0;
  font-size:15px;color:var(--muted)}
.rules details.tucked summary::-webkit-details-marker{display:none}
.rules details.tucked summary::after{content:" \2026"}

/* === ΡΥΘΜΙΣΕΙΣ ============================================== */
.setbtn{display:flex;align-items:center;justify-content:center;gap:9px;margin:18px auto 0;
  padding:10px 20px;border:3px solid #000;border-radius:14px;background:rgba(0,0,0,.36);
  color:var(--bone);font-family:var(--mono);font-size:12px;letter-spacing:.18em;
  text-transform:uppercase;box-shadow:0 4px 0 rgba(0,0,0,.5)}
.setbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.5)}
.setsum{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);
  text-align:center;margin:9px 0 0}
.srow{display:flex;gap:8px;margin:6px 0 4px}
.srow.col{flex-direction:column}
.sopt{flex:1;padding:11px 8px;border:3px solid #000;border-radius:13px;background:rgba(0,0,0,.4);
  color:var(--muted);font-family:var(--display);font-size:17px;font-weight:700;transition:transform .1s}
.sopt.on{background:var(--brass);color:#3a1c00;box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 3px 0 rgba(0,0,0,.5)}
.sopt:active{transform:scale(.96)}
.stip{margin:8px 0 0;padding:9px 12px;border:3px dashed rgba(255,201,14,.6);border-radius:12px;
  color:var(--bone);font-size:13.5px;line-height:1.5}
.sgame{display:block;padding:12px 14px;border:3px solid #000;border-radius:13px;
  background:rgba(0,0,0,.42);color:var(--bone);font-family:var(--display);font-size:17px;
  font-weight:700;text-decoration:none}
.sgame:active{transform:scale(.98)}

/* === ΤΟ ΔΙΚΑΣΤΗΡΙΟ ========================================== */
.dark .hush{font-family:var(--display);font-weight:700;font-size:33px;line-height:1.1;
  color:var(--brass);margin:0 0 6px;
  text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000}
.dark .hushsub{font-family:var(--mono);font-size:12px;letter-spacing:.24em;
  text-transform:uppercase;color:var(--muted);margin:0 0 38px}
.cue{font-size:16px;line-height:1.5;color:var(--bone);margin:16px 2px 0;text-align:center}
.cue .neg{color:#ff6b5e}
.cue .pos{color:#6be08c}
.remind{margin:14px 0 0;padding:11px 13px;border:3px dashed rgba(255,201,14,.5);border-radius:14px;
  background:rgba(0,0,0,.3);font-size:13px;line-height:1.55;color:var(--muted);text-align:left}
.remind b{color:var(--brass)}
.ibtn.small{width:56%;margin:4px auto 0}
/* μεσαιο: οθονες του δικαστηριου, για να χωρανε ολα χωρις σκρολ */
.ibtn.mid{width:66%;margin:6px auto 0}
.btn.tmpl.mid{width:72%;margin:6px auto 0;min-height:72px;padding:16px 40px}
.roles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0 4px}
.role{padding:5px;border:3px dashed transparent;border-radius:24px;transition:transform .12s}
.role.on{border-color:var(--brass);background:rgba(255,201,14,.16);transform:scale(1.07)}
.role:active{transform:scale(.95)}
.vsrow{display:flex;align-items:center;justify-content:center;gap:10px;margin:18px 0 0}
.vslbl,.slbl{font-family:var(--mono);font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--muted)}
.ask{font-size:19px;text-align:center;margin:16px 0 4px}
.quip{text-align:center;font-size:19px;color:var(--brass);margin:2px 0 16px}
.bench{display:flex;flex-direction:column;gap:16px;align-items:center;padding:18px 10px;
  border:4px solid #000;border-radius:20px;background:rgba(0,0,0,.3)}
.seat{display:flex;flex-direction:column;align-items:center;gap:7px}
.duo{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.vs{font-family:var(--display);font-weight:700;font-size:26px;color:var(--blood);
  text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000}
.endlink{display:block;margin:12px auto 0;padding:9px 18px;border:3px solid #000;border-radius:12px;
  background:rgba(0,0,0,.34);color:var(--muted);font-family:var(--mono);font-size:11px;
  letter-spacing:.14em;text-transform:uppercase}
.endlink:active{transform:translateY(2px)}

/* η πορτα για την Κοντρα στα Γρηγορα — σκετη ζωγραφια */
.kdoor{width:23%;margin:6px auto 0;opacity:.62;transition:opacity .2s,transform .1s}
.kdoor:active{opacity:1;transform:scale(1.08)}
/* ΖΩΓΡΑΦΙΣΤΟ ΚΟΥΜΠΙ: το ιδιο πλαισιο με comic sans, οπου χρειαζεται */
.imgbtn{border:none;border-radius:0;cursor:pointer;
  background:url(img/km-btn.png) no-repeat center/100% 100%;
  font:700 17px/1.15 "Comic Sans MS","Comic Sans",Comfortaa,cursive;
  color:#161616;text-shadow:none;min-height:64px;padding:12px 16px;
  display:flex;align-items:center;justify-content:center;transition:transform .1s}
.imgbtn:active{transform:scale(.96)}
.imgbtn.off{filter:grayscale(.75) brightness(.82);opacity:.72}
.how{display:flex;gap:10px;margin-top:8px}
.how .imgbtn{flex:1;min-height:76px}
.sheet .imgbtn{width:100%;min-height:58px;font-size:16px}
.sheet .row .imgbtn{flex:1}

/* === ΚΟΥΜΠΙΑ ΠΟΥ ΚΑΘΟΝΤΑΙ ΩΡΑΙΑ ==============================
   Οι ζωγραφιες-κουμπια δεν απλωνονται πια απο ακρη σε ακρη: ολες
   εχουν το ιδιο υψος και πιανουν μονο οσο ειναι η ζωγραφια τους.
   ΥΨΟΣ: αλλαξε τα px εδω και αλλαζουν παντου.                    */
.ibtn{display:flex;align-items:center;justify-content:center;
  width:-webkit-fit-content;width:fit-content;max-width:100%;margin:10px auto 0}
.ibtn img{display:block;height:74px;width:auto;max-width:100%}
.ibtn img.art{height:auto;width:100%}
.ibtn.logo-btn{width:100%}
.ibtn.big img{height:96px}
.ibtn.mid{width:-webkit-fit-content;width:fit-content;margin:8px auto 0}
.ibtn.mid img{height:64px}
.ibtn.small{width:-webkit-fit-content;width:fit-content;margin:6px auto 0}
.ibtn.small img{height:48px}
.hdr .ibtn{width:auto;margin:0}
.hdr .ibtn img{height:52px}
.hdr .ibtn.endbtn img{height:44px}
.hdr .hdr-sp{width:52px;flex:none}
.dark .ibtn{margin:0 auto}
.duo-btns{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;margin-top:10px}
.duo-btns .ibtn{margin:0}
.btn.tmpl{width:auto;min-width:200px;max-width:290px;margin-left:auto;margin-right:auto;
  min-height:68px;padding:16px 44px;font-size:20px}
.btn.tmpl.mid{width:auto;min-height:64px;padding:15px 40px}

/* === ΤΑ ΠΛΑΙΣΙΑ ΚΕΙΜΕΝΟΥ =====================================
   Λεπτο μαυρο περιγραμμα, στρογγυλες ακρες, ασπρο μεσα.          */
.field{background:#fff;border:2.5px solid #000;border-radius:16px;
  padding:13px 16px;min-height:0;margin:12px 0 8px;
  box-shadow:0 4px 0 rgba(0,0,0,.42);transition:box-shadow .15s}
.field.op{padding:14px 16px;min-height:0;align-items:flex-start}
.field textarea{min-height:104px}
.field:focus-within{box-shadow:0 0 0 3px var(--brass),0 4px 0 rgba(0,0,0,.42)}
/* ΤΑ ΓΡΑΜΜΑΤΑ ΟΛΟΚΛΗΡΑ: το πεδιο κοβει οτι βγαινει απο το δικο του
   κουτι, οποτε του δινουμε χωρο γυρω γυρω και ψηλη γραμμη.          */
.field{padding:8px 12px;align-items:center}
.field input,.field textarea{box-sizing:border-box;padding:9px 8px;line-height:1.65;
  overflow:visible;text-overflow:clip}
.field input{height:auto;min-height:54px}
.field textarea{min-height:110px;overflow-y:hidden}
.sset,.sset h3,.sset p,.turf .rules.sset h3{text-align:center}
.sset .srow{justify-content:center}
.sset .stip,.sset .sgame{text-align:center}
.rcard.k.on{border-color:#ff5a6e;background:rgba(200,20,50,.3)}
.rcard.k.on .rmark{background:#e0263f;color:#fff}
.rcard.v.on{border-color:#4f9dff;background:rgba(30,100,230,.3)}
.rcard.v.on .rmark{background:#2f7bff;color:#fff}
.btn.tmpl.paused{background:var(--brass);color:#3a1c00;text-shadow:none}

/* === ΖΩΕΣ & ΝΙΚΕΣ ============================================ */
.hp{display:inline-flex;gap:2px;align-items:center}
.slot{position:relative;display:block;width:25px;height:21px;flex:none}
.slot img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain}
.hp.big .slot{width:42px;height:35px}
.slot img.fly{animation:hfly .9s ease-in .35s both}
.slot img.land{animation:wland .55s cubic-bezier(.2,1.6,.4,1) .35s both}
@keyframes hfly{0%{transform:none;opacity:1}35%{transform:scale(1.4) rotate(-10deg);opacity:1}
  100%{transform:translateY(-30px) scale(.3) rotate(25deg);opacity:0}}
@keyframes wland{0%{transform:scale(2.8) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
.howpts{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  margin:12px 0 0;font-size:13px;font-weight:700;color:var(--bone)}
.hpline{display:flex;justify-content:center;margin-top:14px}

/* το τραπεζι: ολοι, με ζωες και νικες */
.tbl{display:flex;flex-direction:column;gap:7px;margin-top:16px}
.tbl .slbl{text-align:center;margin:0 0 2px}
.trow{display:flex;align-items:center;gap:8px;padding:8px 10px;border:3px solid #000;
  border-radius:14px;background:rgba(0,0,0,.3);animation:rowin .3s ease-out both}
.trow:nth-child(3){animation-delay:.04s}.trow:nth-child(4){animation-delay:.08s}
.trow:nth-child(5){animation-delay:.12s}.trow:nth-child(6){animation-delay:.16s}
.trow .nm{flex:1;min-width:0;text-align:left}
.trow .stats{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.trow.out .nm{opacity:.55}
.trow .gone{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.trow .gone img{height:24px;width:auto}
@keyframes rowin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.peek{flex:none;padding:6px 10px;border:2.5px solid #000;border-radius:10px;background:#fff;
  color:#161616;font-size:12px;font-weight:700;text-shadow:none;box-shadow:0 3px 0 rgba(0,0,0,.45)}
.peek:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.45)}

/* η ετυμηγορια */
.vgrid{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.vpick{flex:1 1 140px;max-width:230px;display:flex;flex-direction:column;align-items:center;gap:9px;
  padding:14px 10px;border:3px solid #000;border-radius:18px;background:rgba(0,0,0,.3);
  transition:transform .14s,background .14s}
.vpick.on{border-color:var(--brass);background:rgba(255,201,14,.16);transform:scale(1.04)}
.vpick:active{transform:scale(.97)}
.vhp{display:flex;flex-direction:column;align-items:center;gap:4px}

/* ο ποντος */
.score{display:flex;flex-direction:column;gap:16px;margin:22px 0 0}
.srow2{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.delta{font-size:28px;font-weight:700;text-shadow:var(--stroke)}
.delta.up{color:var(--brass)}
.delta.down{color:#ff6b5e}

/* η υποθεση που καηκε */
.card.burn{font-size:16px;text-decoration:line-through;text-decoration-thickness:2px;
  animation:char 1s ease-out .25s both}
@keyframes char{to{opacity:.5;transform:rotate(-1.5deg) scale(.97)}}
.burnlbl{margin:16px 0 6px}

/* η εξοδος */
.bigicon{display:block;width:44%;max-width:170px;height:auto;margin:6px auto 4px;
  animation:slam .5s cubic-bezier(.2,1.5,.4,1) both}
.votebtn{display:flex;flex-direction:column;align-items:center;gap:2px;margin:12px auto 0;
  padding:10px 20px;border:3px solid #000;border-radius:14px;background:rgba(255,201,14,.14);
  color:var(--brass);font-weight:700;font-size:16px;box-shadow:0 4px 0 rgba(0,0,0,.5)}
.votebtn small{font-size:11px;color:var(--muted);font-weight:400}
.votebtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.5)}

/* κρυφοι ρολοι */
.rcards{display:flex;gap:10px;margin-top:6px}
.rcard{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:14px 10px;
  border:3px solid #000;border-radius:16px;background:rgba(0,0,0,.32);color:var(--muted);
  transition:transform .12s,background .12s}
.rcard .rmark{font-size:10px;letter-spacing:.18em;padding:3px 9px;border:2px solid #000;
  border-radius:8px;background:rgba(255,255,255,.12)}
.rcard .rname{font-size:18px;font-weight:700;color:var(--bone)}
.rcard .rnote{font-size:12px}
.rcard.on{border-color:var(--brass);background:rgba(255,201,14,.15)}
.rcard.on .rmark{background:var(--brass);color:#3a1c00}
.rcard:active{transform:scale(.97)}
.rolecard{position:relative;margin:16px 0 0;padding:28px 16px 20px;border:4px solid #000;
  border-radius:20px;display:flex;flex-direction:column;align-items:center;gap:10px;
  box-shadow:0 6px 0 rgba(0,0,0,.45);animation:slam .45s cubic-bezier(.2,1.5,.4,1) both}
.rolecard h2{margin:0;font-size:30px}
.rolecard p{margin:0;font-size:15px}
.rolecard .rc-tag{position:absolute;top:-14px;left:50%;transform:translateX(-50%);padding:3px 12px;
  background:var(--brass);color:#3a1c00;border:3px solid #000;border-radius:9px;font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;font-weight:700;white-space:nowrap;text-shadow:none}
.rolecard.k{background:linear-gradient(#b3122e,#4f0612)}
.rolecard.k .rc-tag{background:#e0263f;color:#fff}
.rolecard.v{background:linear-gradient(#1f5fd6,#0a2258)}
.rolecard.v .rc-tag{background:#2f7bff;color:#fff}
.rolecard.n{background:rgba(0,0,0,.35)}
.pickhead{display:flex;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap}

/* το τελος */
.flowers{margin:16px 0 0;padding:12px 14px;border:3px dashed rgba(255,201,14,.7);border-radius:16px;
  background:rgba(255,201,14,.1);font-size:16px;line-height:1.5;color:var(--bone)}
.flowers b{color:var(--brass)}
.reveal{margin:16px 0 0;display:flex;flex-direction:column;gap:8px;align-items:center}
.reveal .rv{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;font-size:14px}
@media (prefers-reduced-motion:reduce){
  .slot img.fly,.slot img.land,.trow,.card.burn,.bigicon,.rolecard{animation:none}
}
/* ο φακελος: στρογγυλο κουμπι πανω δεξια */
.fbtn{width:52px;height:52px;flex:none;padding:0;border-radius:50%;border:4px solid #000;background:#fff;
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.5);transition:transform .1s,box-shadow .1s}
.fbtn:active{transform:translateY(4px);box-shadow:0 0 0 rgba(0,0,0,.5)}
.fbtn svg{width:28px;height:28px;display:block;pointer-events:none}
.frow{display:flex;align-items:center;gap:10px;padding:11px 12px;border:3px solid #000;border-radius:14px;
  background:rgba(0,0,0,.32);text-align:left;font-size:15px;line-height:1.4;color:var(--bone)}
.frow .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.penbox{display:flex;flex-direction:column;align-items:center;gap:6px;margin:16px auto 0;padding:12px 18px;
  border:3px solid #000;border-radius:14px;background:var(--brass);color:#2E1C0E;max-width:300px;
  box-shadow:0 5px 0 rgba(0,0,0,.45);animation:slam .45s cubic-bezier(.2,1.5,.4,1) .2s both}
.penbox .slbl{color:#5a3a00}
.penbox b{font-size:20px;text-shadow:none}

</style>

<div id="app"></div>

<script>
"use strict";

/* === [8] ΡΥΘΜΙΣΕΙΣ ΠΑΙΧΝΙΔΙΟΥ ==============================
   Άλλαξε αυτά για ισορροπία και όρια, χωρίς να ψάξεις αλλού.  */
const CFG = {
  MIN_PLAYERS: 4,                 // κατω απο 4 δεν στηνεται δικαστηριο
  MAX_PLAYERS: 15,
  DEFAULT_PLAYERS: 5,
  DEFAULT_PENALTY: "ποινη",
  DEFAULT_SCORING: "points",       // "points" = με ποντους, "penalty" = με ποινη
  TIME_OPTIONS: [120, 180, 300],   // χρονος λογου, σε δευτερολεπτα
  DEFAULT_TIME: 120,
  UNLOCK_2V2: 5,                   // από πόσους παίκτες ξεκλειδώνει το 2v2
  UNLOCK_3V3: 7,                   // από πόσους παίκτες ξεκλειδώνει το 3v3
  MAX_NAME: 14,
  MAX_OPINION: 240,
  AGAIN_EACH: 1,                   // ποσες υποθεσεις γραφει ο καθενας στο νεο παιχνιδι
  MIN_ROUNDS_TO_END: 3,
  LIVES: 3,                        // ζωες καθε παιχτη (ποντοι & ζωες)
  WINS: 3,                         // νικες για να κερδισεις
  PICK_OFFER: 10,                  // ετοιμες: ποσες βλεπει ο καθενας
  PICK_KEEP: 6,                    // ετοιμες: ποσες κραταει
  AUTO_FILL: 6,                    // ποσες μπαινουν μονες τους οταν αδειασει η δικογραφια            // απο ποσους γυρους και μετα ο δικαστης μπορει να ληξει
  LOW_DECK: 3,                     // απο ποσες υποθεσεις και κατω βγαινει η κοκκινη προειδοποιηση
  STORE_KEY: "kontra.praktika.v1",
  SEEN_KEY: "kontra.seen.v1",      // αν εχει ξαναμπει ο χρηστης (καλωσορισμα μια φορα)
  SETTINGS_KEY: "kontra.settings.klassiki.v2", // οι ρυθμισεις της κλασσικης
  FOLDER_KEY: "kontra.folder.v1",     // Ο ΦΑΚΕΛΟΣ: οι υποθεσεις που κρατησε το τραπεζι
  DEVOPS_KEY: "kontra.dimiourgos.v1", // ο φακελος του δημιουργου
  READY_DECK: 16                      // ποσες ετοιμες υποθεσεις μπαινουν στη δικογραφια
};

/* ΜΑΡΚΕΣ: το ιδιο χρωματολογιο με την Κοντρα στα Γρηγορα.
   fill = το χρωμα, ink = το γραμμα.                            */
const COLORS = [
  { name:"Βυσσινι",   fill:"#5c1024", ink:"#f6e0e6" },
  { name:"Λαδι",      fill:"#33401a", ink:"#eef3e2" },
  { name:"Πετρολ",    fill:"#123c46", ink:"#e0f0f3" },
  { name:"Μελιτζανι", fill:"#3d1a4d", ink:"#f0e2f6" },
  { name:"Καφε",      fill:"#4a2a15", ink:"#f6ead9" },
  { name:"Μπορντο",   fill:"#3d0d12", ink:"#f6dede" },
  { name:"Μπλε νυχτα",fill:"#141f45", ink:"#e2e6f6" },
  { name:"Χακι",      fill:"#4a3f1c", ink:"#f6f1d9" },
  { name:"Ανθρακι",   fill:"#242629", ink:"#eceff1" },
  { name:"Σκουρο κυπαρισσι", fill:"#123425", ink:"#e0f3e8" },
  { name:"Σκουρια",   fill:"#5a2a10", ink:"#f6e6d9" },
  { name:"Μαβι",      fill:"#2c2440", ink:"#e8e4f6" }
];
/* δυο σχεδια, χοντρα και ξεχωριστα μεταξυ τους */
const PATS = [
  { name:"Καρο",  css:f => "repeating-conic-gradient(rgba(255,255,255,.16) 0 25%,rgba(255,255,255,0) 0 50%) 0 0/26px 26px," + f },
  { name:"Ριγες", css:f => "repeating-linear-gradient(135deg,rgba(255,255,255,.18) 0 13px,rgba(255,255,255,0) 13px 30px)," + f }
];
/* παραδειγματα για το πλαισιο της υποθεσης — αλλαζει καθε φορα */
const OP_EG = [
  "ο σκυλος είναι καλυτερος απτην γατα",
  "η πιτσα με ανανα ειναι εγκλημα",
  "το μπασκετ ειναι πιο ωραιο απτο ποδοσφαιρο",
  "καλυτερα μονος παρα με κακη παρεα",
  "ο σκετος καφες ειναι για επιδειξη",
  "τα ζωδια τα πιστευουν οσοι βαριουνται",
  "το βουνο ειναι καλυτερο απτη θαλασσα",
  "οποιος βαζει μουσικη σε ηχειο στην παραλια ειναι για δεσιμο",
  "η ταινια ειναι παντα χειροτερη απτο βιβλιο",
  "δεν υπαρχει καλη δικαιολογια για αργοπορια",
  "ο φραπες δεν ειναι καφες, ειναι τροπος ζωης",
  "καλυτερα να πεις οχι παρα να το κανεις με μισα μουτρα"
];

/* φάκελος και ονόματα των ζωγραφιών σου */
const IMG = "img/";
const DIGIT = ["zero","one","two","three","four","five","six","seven","eight","nine"];
/* ζωγραφιές για τον χρόνο λόγου· όποιο λείπει βγαίνει ως κείμενο */
const TIME_IMG = { 120:"2lepta.png", 180:"3lepta.png", 300:"5lepta.png" };

/* === [9] ΑΠΟΘΗΚΕΥΣΗ ========================================
   Δοκιμάζει localStorage. Αν δεν επιτρέπεται (π.χ. σε preview),
   πέφτει σε μνήμη ώστε να μη σκάει πουθενά.                   */
const Store = (() => {
  let mem = null, ok = true;
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); }
  catch(e){ ok = false; }
  return {
    persistent: ok,
    load(){
      try { return ok ? (JSON.parse(localStorage.getItem(CFG.STORE_KEY)) || []) : (mem || []); }
      catch(e){ return []; }
    },
    save(v){
      mem = v;
      try { if (ok) localStorage.setItem(CFG.STORE_KEY, JSON.stringify(v)); } catch(e){}
    }
  };
})();

/* θυμαται αν εχει ξαναμπει ο χρηστης — το καλωσορισμα παιζει μια φορα.
   Για να το ξαναδεις: σβησε το κλειδι απο τον browser, ή αλλαξε το SEEN_KEY. */
const Seen = {
  get(){ try { return localStorage.getItem(CFG.SEEN_KEY) === "1"; } catch(e){ return false; } },
  set(){ try { localStorage.setItem(CFG.SEEN_KEY, "1"); } catch(e){} }
};

/* ΟΙ ΡΥΘΜΙΣΕΙΣ: ΟΠΑ, γυροι λογου, χρονος, τυχαιοι ρολοι.
   Μενουν στη συσκευη για την επομενη φορα.                    */
const Settings = {
  def: { mode: "dipl", opa: true, rounds: 1, secs: 120 },
  load(){
    let v;
    try { v = Object.assign({}, this.def, JSON.parse(localStorage.getItem(CFG.SETTINGS_KEY)) || {}); }
    catch(e){ v = Object.assign({}, this.def); }
    if (v.mode !== "dipl" && v.mode !== "polites") v.mode = "dipl";
    if (CFG.TIME_OPTIONS.indexOf(v.secs) < 0) v.secs = CFG.DEFAULT_TIME;
    return v;
  },
  save(v){ try { localStorage.setItem(CFG.SETTINGS_KEY, JSON.stringify(v)); } catch(e){} }
};

/* === [10] ΚΑΤΑΣΤΑΣΗ ΠΑΙΧΝΙΔΙΟΥ ============================= */
const S = {
  screen: Seen.get() ? "count" : "welcome",
  msg: null,         // το κειμενο της οθονης-απαντησης στο καλωσορισμα
  playerCount: CFG.DEFAULT_PLAYERS,
  players: [],       // γεμίζει καθώς συστήνονται, ένας ένας
  pcol: [],          // το χρωμα της μαρκας καθε παιχτη
  ppat: [],          // το σχεδιο της μαρκας καθε παιχτη
  draftCol: 0,       // η μαρκα αυτου που γραφει τωρα
  draftPat: 0,
  palette: false,    // ανοιχτη η παλετα
  nameDraft: "",     // ο,τι εχει γραφτει, για να μη χανεται σε render
  opDraft: "",
  opPh: "",          // το τυχαιο παραδειγμα του πλαισιου υποθεσης
  scoring: CFG.DEFAULT_SCORING,
  penalty: CFG.DEFAULT_PENALTY,
  sendPick: [],      // ποιες υποθεσεις τσεκαρε το τραπεζι για τον φακελο
  topic: "ours",     // "ours" = δικες σας υποθεσεις, αλλιως ετοιμος φακελος
  folder: [],        // Ο ΦΑΚΕΛΟΣ — οσες υποθεσεις κρατησατε απο παλιες δικες
  showWho: false,    // φανερωθηκε ποιος το ειπε σε αυτον τον γυρο
  contraSecs: CFG.DEFAULT_TIME,
  set: Settings.load(),   // ΟΠΑ, γυροι λογου, χρονος, τυχαιοι ρολοι

  opinions: [],      // [{id, text}] — ΧΩΡΙΣ σύνδεση με παίκτη
  nextId: 1,
  peakOps: 0,        // ποσες υποθεσεις ειχε το πολυ ο φακελος (για την προειδοποιηση)
  mine: 0,           // πόσες έγραψε ο τωρινός παίκτης στη σύσταση

  judge: -1,
  round: null,
  phase: "setup",    // "setup" = συσταση (οι αρχικες υποθεσεις), "play" = παιχνιδι
  roundsDone: 0,     // ποσοι γυροι εχουν κλεισει σε αυτο το παιχνιδι
  wins: [],          // ΟΙ ΝΙΚΕΣ ΤΟΥ ΠΑΙΧΝΙΔΙΟΥ, με τη σειρα των παιχτων
                     // (με θεσεις, οχι με ονοματα — αλλιως μηδενιζαν)
  recordStart: 0,    // απο πoιο πρακτικο ξεκιναει αυτο το παιχνιδι
  records: Store.load(),
  timer: null,
  writeReturn: "lastCall",
  againIdx: 0,       // ποσες υποθεσεις γραφτηκαν στο "ξανα"
  againLeft: 0,      // ποσοι παιχτες μενουν να γραψουν
  back: "count",
  rulesFrom: "count",   // σε ποια οθονη γυρναει το ΑΚΥΡΟ των κανονων
  extraFrom: "lastCall" // σε ποια οθονη γυρναει το ΑΚΥΡΟ της καταθεσης
};

const app = document.getElementById("app");
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mmss = s => Math.floor(s/60) + ":" + String(Math.floor(s%60)).padStart(2,"0");
const go = s => { stopTimer(); if (s !== S.screen) freshOp(); S.screen = s; render(); };
function stopTimer(){ if (S.timer){ clearInterval(S.timer); S.timer = null; } }
const nameOf = i => S.players[i];

/* === ΜΑΡΚΕΣ ==============================================
   Ενα σχημα για καθε ονομα: γεμισμα στο χρωμα του παιχτη με το
   σχεδιο του, διακεκομμενη ασπρη στεφανη, μαυρο περιγραμμα.   */
function swatch(ci, pi, o){
  o = o || {};
  const c = COLORS[(ci|0) % COLORS.length] || COLORS[0];
  const p = PATS[(pi|0) % PATS.length] || PATS[0];
  const sh = ["0 0 0 3px #000"];
  if (o.lift) sh.push("0 " + o.lift + "px 0 rgba(0,0,0,.45)");
  if (o.glow) sh.push(o.glow);
  return "display:inline-flex;box-sizing:border-box;align-items:center;justify-content:center;"
    + "padding:" + (o.pad || "6px 14px") + ";border-radius:" + (o.radius || "999px") + ";"
    + "background:" + p.css(c.fill) + ";color:" + c.ink + ";"
    + "font:700 " + (o.size || "15px") + "/1.2 var(--display);"
    + "border:" + (o.dash || 4) + "px solid #000;"
    + "box-shadow:" + sh.join(",") + ";text-shadow:none;"
    + (o.dim ? "opacity:.42;" : "") + (o.extra || "");
}
const pcol = i => S.pcol[i] == null ? 3 : S.pcol[i];
const ppat = i => S.ppat[i] == null ? 0 : S.ppat[i];
const chipName = (i, nm, o) =>
  `<span class="pchip" style="${swatch(pcol(i), ppat(i), o)}">${esc(nm)}</span>`;
const chip = (i, o) => chipName(i, nameOf(i), o);
/* δυο παιχτες δεν παιρνουν το ιδιο χρωμα */
function freeColor(){
  const free = COLORS.map((_,i)=>i).filter(i => S.pcol.indexOf(i) < 0);
  const pool = free.length ? free : COLORS.map((_,i)=>i);
  return pool[Math.floor(Math.random()*pool.length)];
}
const freshOp = () => { S.opPh = "Π.Χ " + OP_EG[Math.floor(Math.random()*OP_EG.length)]; };
freshOp();

/* βοηθητικά για τις ζωγραφιές */
/* Κάθε κουμπί παίρνει αυτόματα κλάση b-<ονομα>, π.χ. b-akyro, b-dinworko.
   Έτσι μπορείς να πειράξεις ΕΝΑ κουμπί παντού, από ένα σημείο στο CSS. */
const ibtn = (file, attr, cls) =>
  `<button class="ibtn b-${file.replace(".png","")} ${cls||""}" ${attr||""}><img src="${IMG}${file}" alt=""></button>`;
const art = (file, cls) => `<img class="art ${cls||""}" src="${IMG}${file}" alt="">`;
/* Το μεγαλο λογοτυπο ειναι κουμπι: το πατας, χλιμιντριζει. */
const logoArt = cls =>
  `<button class="ibtn logo-btn" data-neigh="1" style="margin:0" aria-label="Κοντρα"
     >${art("logo-kontra.png", cls)}</button>`;

/* ΤΟ ΑΛΟΓΟ — παιζει καθε φορα που πατας το λογοτυπο.
   Κραταμε μικρη πισινα αντιγραφων, ωστε να μπορεις να το πατας
   συνεχεια χωρις να κοβεται ο προηγουμενος ήχος.           */
const Neigh = (() => {
  const pool = [], N = 4;
  let k = 0, ready = false;
  const build = () => {
    if (ready) return;
    ready = true;
    for (let i = 0; i < N; i++){
      const a = new Audio(IMG + "alogo.mp3");
      a.preload = "auto"; a.volume = .85;
      pool.push(a);
    }
  };
  return { play(){
    build();
    const a = pool[k = (k + 1) % N];
    try { a.currentTime = 0; a.play().catch(() => {}); } catch(e){}
  }};
})();
const badge = file => `<img src="${IMG}${file}" alt="">`;
const digitImgs = n => String(n).split("")
  .map(d => `<img src="${IMG}${DIGIT[+d]}.png" alt="${d}">`).join("");

/* πεδία κειμένου μέσα στα ζωγραφιστά πλαίσια */
const nameField = () => `
  <div class="field name">
    <input id="pname" placeholder="Π.Χ μακης τσελιος" maxlength="${CFG.MAX_NAME}"
           autocomplete="off" value="${esc(S.nameDraft)}">
  </div>`;
const opField = () => `
  <div class="field op">
    <textarea id="op" maxlength="${CFG.MAX_OPINION}" placeholder="${esc(S.opPh)}">${esc(S.opDraft)}</textarea>
  </div>`;

/* η παλετα: ανοιγει πανω απο την οθονη της συστασης */
function paletteHTML(){
  if (!S.palette) return "";
  const cells = COLORS.map((c, ci) => {
    const taken = S.pcol.indexOf(ci) >= 0, on = S.draftCol === ci;
    return `<button class="pcell" ${taken && !on ? "disabled" : ""} data-pickcol="${ci}"
      style="${swatch(ci, S.draftPat, { pad:"0", radius:"50%", dash:4, lift: on ? 0 : 4,
        glow: on ? "0 0 0 6px rgba(255,201,14,.9)" : "", dim: taken && !on,
        size:"20px", extra:"width:54px;height:54px;cursor:pointer;" })}"
      >${on ? "&#10003;" : taken ? "&times;" : ""}</button>`;
  }).join("");

   Μενει στη συσκευη. Παιζεται απο το «Πριν τα ονοματα».          */
const Folder = {
  load(){ try { return (JSON.parse(localStorage.getItem(CFG.FOLDER_KEY)) || []).filter(o => o && o.t && !o.who); } catch(e){ return []; } },
  save(v){ try { localStorage.setItem(CFG.FOLDER_KEY, JSON.stringify(v)); } catch(e){} },
  add(t){
    const s = (t || "").trim(); if (!s) return;
    const l = this.load();
    if (l.some(o => o.t === s)) return;
    l.push({ t: s, d: Date.now() }); this.save(l);
  },
  drop(i){ const l = this.load(); l.splice(i, 1); this.save(l); },
  clear(){ this.save([]); }
};
function loadFolderDeck(){
  S.opinions = []; S.nextId = 1;
  shuffle(Folder.load().map(o => o.t)).forEach(t => S.opinions.push({ id: S.nextId++, text: t, wave: 0, used: 0 }));
  S.peakOps = S.opinions.length;
}
/* οι υποθεσεις αυτης της παρτιδας: οσες παιχτηκαν + οσες εμειναν */
function allOpinions(){
  const seen = {}, out = [];
  const push = t => { if (t && !seen[t]){ seen[t] = 1; out.push(t); } };
  (S.played || []).forEach(push);
  S.opinions.forEach(o => push(o.text));
  return out;
}

const roleOf = i => !S.roles ? "law" : i === S.roles.k ? "komplex" : i === S.roles.v ? "vysma" : "law";
function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)), t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

/* === Η ΒΑΣΗ — οι ετοιμες υποθεσεις του ops.js ==============
   Μοιραζει χωρις επαναληψη. Οταν αδειασει, ξανανακατευεται.   */
function dbAll(){
  const K = window.KONTRA_OPS || {}, out = [];
  (K.cats || []).forEach(c => (c.ops || []).forEach(o => {
    const t = typeof o === "string" ? o : (o && o.t);
    if (t && String(t).trim()) out.push(String(t).trim());
  }));
  return out;
}
function dbDraw(n){
  const got = [];
  for (let pass = 0; pass < 2 && got.length < n; pass++){
    if (!S.db || !S.db.length){
      const busy = {};
      S.opinions.forEach(o => { busy[o.text] = 1; });
      got.forEach(t => { busy[t] = 1; });
      S.db = shuffle(dbAll().filter(t => !busy[t]));
    }
    while (got.length < n && S.db.length) got.push(S.db.pop());
  }
  return got;
}
/* ΠΟΤΕ ΔΕΝ ΤΕΛΕΙΩΝΕΙ: αν αδειασει η δικογραφια, μπαινουν μονες
   τους υποθεσεις απο τη βαση και συνεχιζουμε.                    */
function ensureDeck(){
  if (S.opinions.length || S.topic === "folder") return;
  dbDraw(CFG.AUTO_FILL).forEach(t => S.opinions.push({ id: S.nextId++, text: t, wave: 2, used: 0 }));
  S.autoNote = true;
}
/* 6 απο 10: ο καθενας παιρνει 10 τυχαιες και κραταει τις 6 */
function prepOffer(){ S.offer = dbDraw(CFG.PICK_OFFER); S.offerPick = S.offer.map(() => false); }
function commitPick(){
  S.offer.forEach((t, k) => {
    if (S.offerPick[k]) S.opinions.push({ id: S.nextId++, text: t, wave: 0, used: 0 });
    else (S.db || (S.db = [])).unshift(t);   /* γυριζει στη βαση, στον πατο */
  });
  S.offer = []; S.offerPick = [];
}

const slot = (under, over, cls) =>
  `<span class="slot"><img src="${IMG}${under}.png" alt="">${over ? `<img class="${cls}" src="${IMG}${over}.png" alt="">` : ""}</span>`;
function heartsHTML(lifeNow, lostAt){
  let h = "";
  const n = Math.max(CFG.LIVES, lifeNow);
  for (let k = 0; k < n; k++){
    if (k < lifeNow) h += slot("heart_full");
    else if (k === lostAt) h += slot("heart_empty", "heart_full", "fly");
    else h += slot("heart_empty");
  }
  return h;
}
function winsHTML(winsNow, wonAt){
  let w = "";
  for (let k = 0; k < CFG.WINS; k++){
    if (k === wonAt) w += slot("win_empty", "win_full", "land");
    else w += slot(k < winsNow ? "win_full" : "win_empty");
  }
  return w;
}
function hpRow(i){
  const L = Math.max(0, S.life[i] || 0), W = Math.min(CFG.WINS, S.wins[i] || 0);
  return `<span class="hp" aria-label="${L} ζωες">${heartsHTML(L, -1)}</span>${pointsMode() ? `<span class="hp" aria-label="${W} νικες">${winsHTML(W, -1)}</span>` : ""}`;
}

function finalTable(){

/* ΟΘΟΝΗ: πριν τα ονοματα — υποθεσεις και ρολοι, σε μια οθονη --- */
V.topic = () => {

  const rcard = (key, name, note) => `

      <span class="rmark">${S[key] ? "ΜΕΣΑ" : "ΕΞΩ"}</span>

      <span class="rnote">${note}</span>

  return `
    ${header("topic")}
    ${backBtn("count")}

    <label>Οι υποθεσεις</label>

    </div>
    <div class="fill"></div>
    ${ibtn("orthioi.png",'data-topicgo="1"')}`;
};

/* ΟΘΟΝΗ: σύσταση — όνομα (+ πρώτη υπόθεση με τα δικα μας) ------ */
V.intro = () => {
  const i = S.players.length + 1, ready = S.topic === "ready", fold = S.topic === "folder";
  const roster = S.players.length
    ? `<div class="roster" style="justify-content:center">${S.players.map((p,k)=>chipName(k,p,{lift:3})).join("")}</div>`
    : "";
  return `
    <div class="hdr">
      <p class="eyebrow" style="margin:0;text-align:left;padding-top:8px">Τα χαρτια σας &middot; <b>παιχτης Νο ${i}</b></p>
      <button class="palbtn" data-openpal="1" aria-label="Η μαρκα σου"><img src="${IMG}colorpick.png" alt=""></button>
    </div>
    ${backBtn("topic")}
    <p class="lede">${fold ? "γραφεις μονο το ονομα σου — οι υποθεσεις ειναι ηδη στον φακελο" : ready
      ? "γραφεις το ονομα σου και μετα διαλεγεις " + CFG.PICK_KEEP + " υποθεσεις απο " + CFG.PICK_OFFER
      : "γραφεις το ονομα σου και μια υποθεση σου στην οποια θα εβαζες την υπογραφη σου"}</p>
    ${nameField()}
    ${ready || fold ? "" : opField() + `<p class="ps">Υ.Σ αν παιζεις με ατομα που θίγονται ευκολα, παιξε λιγο με τα νευρα τους</p>`}
    <div class="fill"></div>
    ${ibtn("dinworko.png",'data-intro="1" disabled')}
    ${fold ? (S.players.length >= CFG.MIN_PLAYERS ? ibtn("orthioi.png",'data-go="lastCall"') : `<p class="mini">${S.players.length} στο τραπεζι &middot; θελει τουλαχιστον ${CFG.MIN_PLAYERS}</p>`) : ""}
    ${roster}`;
};

/* ΟΘΟΝΗ: 6 απο 10 ---------------------------------------------- */
V.pick6 = () => {
  const n = S.offerPick.filter(Boolean).length, need = CFG.PICK_KEEP;
  const enough = S.players.length >= CFG.MIN_PLAYERS;
  const rows = S.offer.map((t, k) => `
    <button class="pick ${S.offerPick[k] ? "on" : ""}" data-op6="${k}">
      <span class="tick">${S.offerPick[k] ? "&#10003;" : ""}</span>
      <span class="tx">${esc(t)}</span>
    </button>`).join("");
  let foot;
  if (n < need) foot = `<p class="mini">διαλεξε ακομα ${need - n}</p>`;
  else if (S.again) foot = ibtn("dinworko.png",'data-pick6go="again"');
  else foot = `<div class="duo-btns">${ibtn("epomenos.png",'data-pick6go="next"')}${enough ? ibtn("orthioi.png",'data-pick6go="begin"') : ""}</div>
    ${enough ? "" : `<p class="mini">${S.players.length} στο τραπεζι &middot; θελει τουλαχιστον ${CFG.MIN_PLAYERS}</p>`}`;
  return `
    <div class="pickhead">${chip(S.pickFor, { lift:3, size:"16px" })}<span class="eyebrow" style="margin:0">διαλεγεις &middot; <b>${n} / ${need}</b></span></div>
    <h2>Διαλεξε ${need} απο τις υποθεσεις του φακελου</h2>
    <div class="picks">${rows}</div>
    <div class="fill"></div>
    ${foot}
    <button class="endlink" data-op6rand="1">Στην τυχη</button>`;
};

/* Αλλο ενα με ετοιμες: το κινητο αλλαζει χερια, 6 απο 10 ξανα */
V.passPick = () => `
  <p class="eyebrow">Νεα δικογραφια &middot; <b>${S.pickFor + 1} απο ${S.players.length}</b></p>
  <div class="fill"></div>
  <p class="lede" style="margin:0 0 14px">Δωσε το κινητο στον</p>
  <div>${chip(S.pickFor, { pad:"14px 30px", radius:"26px", dash:6, lift:7, size:"34px" })}</div>
  <p class="lede" style="margin-top:16px">καινουρια χαρτια: κρατας ${CFG.PICK_KEEP} απο ${CFG.PICK_OFFER}</p>
  <div class="fill"></div>
  ${ibtn("epomenos.png",'data-passgo="1"')}`;

/* ΟΘΟΝΗ: ίδιος παίκτης, κι άλλη υπόθεση ----------------------- */
V.more = () => {

    ${ibtn("dinworko.png",'data-add-op="1" disabled',"mid")}
    <div class="fill"></div>

      ${ready ? ibtn("orthioi.png",'data-go="lastCall"') : ""}

    ${ready ? "" : `<p class="mini">${S.players.length} στο τραπεζι &middot; θελει τουλαχιστον ${CFG.MIN_PLAYERS}</p>`}`;
};

/* ΟΘΟΝΗ: όλοι συστήθηκαν ------------------------------------ */
V.lastCall = () => `
  ${header("lastCall")}
  <div class="fill"></div>
  <h1>${S.topic === "ours" ? "κατι αλλο?" : "ετοιμοι?"}</h1>
  <p class="lede">${S.topic === "ours"

  <div class="roster" style="justify-content:center">${S.players.map((p,k)=>chipName(k,p,{lift:3})).join("")}</div>
  <div class="fill"></div>
  ${ibtn("orthioi.png",'data-begin="1"')}
  ${S.topic === "ours" ? ibtn("allhmia.png",'data-extra="lastCall"',"small") : ""}`;

/* ΟΘΟΝΗ: κρυφοι ρολοι — αφου γραφτουν/διαλεχτουν οι υποθεσεις.

    <h2>Παιζετε με κρυφους ρολους;</h2>

    </div>

/* ΟΘΟΝΗ: στους 4, ενας κρυφος ρολος μονο -------------------- */
V.rolePick = () => `

  <h2>Στους ${S.players.length} χωραει ενας κρυφος ρολος</h2>

    <button class="rcard on" data-rolepick="v"><span class="rname">Το Βυσμα</span><span class="rnote">βαζει εναν στην κορυφη</span></button>
  </div>
  <div class="fill"></div>
  <button class="endlink" data-rolepick="rand">Στην τυχη</button>`;

/* ΤΟ ΦΥΛΛΟ ΤΟΥ ΚΑΘΕΝΟΣ — μονο για τα ματια του */
function roleCardHTML(i){
  const role = roleOf(i), R = S.roles;
  const head = `<p class="eyebrow">${esc(nameOf(i))} &middot; <b>μονο για τα ματια σου</b></p>`;
  if (role === "komplex") return head + `
    <div class="rolecard k">
      <div class="rc-tag">Κρυφος ρολος</div>
      <h2>Το Κομπλεξ</h2>
      <p>Εχεις κομπλεξ με τον</p>
      ${chip(R.kT, { pad:"12px 26px", radius:"24px", dash:5, lift:6, size:"28px" })}
      <p>Βγαλ' τον απο το παιχνιδι και κερδιζεις κατευθειαν.</p>
    </div>`;
  if (role === "vysma") return head + `
    <div class="rolecard v">
      <div class="rc-tag">Κρυφος ρολος</div>
      <h2>Το Βυσμα</h2>
      <p>Εισαι το βυσμα του</p>
      ${chip(R.vT, { pad:"12px 26px", radius:"24px", dash:5, lift:6, size:"28px" })}
      <p>Αν κερδισει εκεινος, κερδιζεις εσυ.</p>
    </div>`;
  return head + `
    <div class="rolecard n">
      <div class="rc-tag">Κανενας ρολος</div>
      <h2>Καθαρος</h2>
      <p>Δεν εχεις κρυφο ρολο. Παιζεις τιμια — ή τουλαχιστον ετσι λες.</p>
    </div>`;
}

/* ΟΘΟΝΗ: το μοιρασμα των φυλλων — στο τελος, πριν την πρωτη δικη */
V.handoff = () => {
  const i = S.roleIdx, n = S.players.length;
  if (!S.handShow) return `
    <p class="eyebrow">Κρυφο φυλλο &middot; <b>${i + 1} απο ${n}</b></p>
    <div class="fill"></div>
    <p class="lede" style="margin:0 0 14px">Δωσε το κινητο στον</p>
    <div>${chip(i, { pad:"14px 30px", radius:"26px", dash:6, lift:7, size:"34px" })}</div>
    <p class="lede" style="margin-top:16px">Μονο αυτος κοιταει. Οι υπολοιποι, ματια αλλου.</p>
    <div class="fill"></div>
    <button class="btn tmpl mid" data-show="1">Δειξε ρολο</button>`;
  return `
    ${roleCardHTML(i)}
    <div class="fill"></div>
    <button class="btn tmpl mid" data-handnext="1">${i + 1 < n ? "Το κρατησα, παρε το" : "Το κρατησα, παμε"}</button>`;
};

/* ΟΘΟΝΗ: «δειξε ρολο» μεσα στο παιχνιδι ---------------------- */
V.peek = () => {

  if (!S.peekShow) return `
    <div class="fill"></div>
    <p class="lede" style="margin:0 0 14px">Μονο ο</p>
    <div>${chip(i, { pad:"14px 30px", radius:"26px", dash:6, lift:7, size:"34px" })}</div>

    <div class="fill"></div>
    <button class="btn tmpl mid" data-peekshow="1">Δειξε ρολο</button>

  return `
    ${roleCardHTML(i)}
    <div class="fill"></div>
    <button class="btn tmpl mid" data-peekdone="1">Κρυψε το</button>`;
};

V.reIntro = () => `

  ${opField()}
  <div class="fill"></div>
  ${ibtn("dinworko.png",'data-reop="1" disabled')}
  <p class="mini">${S.opinions.length} ${S.opinions.length === 1 ? "υποθεση" : "υποθεσεις"} στον φακελο</p>`;

V.rePass = () => `
  <div class="fill"></div>
  <h1>Δωσε το κινητο</h1>

  <div class="fill"></div>
  ${ibtn("epomenos.png",'data-repass="1"')}`;

/* ΟΘΟΝΗ: ανώνυμη προσθήκη υπόθεσης ---------------------------- */
V.extra = () => `
  <h2>Η υποθεση</h2>
  <p class="lede">Δεν χρειαζεται ονομα. Γραψε και δωσε πισω το κινητο.</p>
  ${opField()}
  <div class="fill"></div>
  ${ibtn("dinworko.png",'data-add-op="1" disabled')}
  ${ibtn("akyro.png",`data-go="${S.extraFrom}"`,"small")}`;

/* ΟΘΟΝΗ: ανακοίνωση δικαστή --------------------------------- */
V.round = () => {

  return `
  ${header("round", canEnd)}
  <div class="fill"></div>
  <div style="margin:0 0 18px">${chip(S.judge, { pad:"14px 30px", radius:"26px", dash:6, lift:7, size:"40px" })}</div>
  <p class="lede" style="color:var(--bone);font-size:20px;margin:0 0 4px">Παρε το κινητο.</p>
  <p class="lede" style="margin:0">εισαι ο δικαστης του γυρου. η μοιρα του τραπεζιου κρεμεται απο τα χειλη σου</p>
  ${S.out[S.judge] ? `<p class="mini">εισαι εκτος, αλλα δικαζεις: εμειναν δυο ορθιοι</p>` : ""}
  ${S.autoNote ? `<p class="mini" style="color:var(--brass)">τελειωσαν οι δικες σας — μπηκαν ετοιμες απο τη βαση</p>` : ""}

  ${ibtn("etoimoi.png",'data-ready="1"')}

  <div class="fill"></div>

/* === ΤΟ ΔΙΚΑΣΤΗΡΙΟ ==========================================

V.eyes = () => `

V.accuse = () => `
  <p class="eyebrow">Διαβασε την υποθεση δυνατα</p>
  <div class="card">${esc(S.round.op.text)}</div>
  <p class="cue">Οσοι πιστευουν οτι αυτο που ακουσαν ειναι <b class="neg">λανθασμενο</b> να σηκωσουν το δεξι τους χερι και να ανοιξουν τα ματια τους.</p>

V.prosecutor = () => {

    <button class="role ${r.con === i ? "on" : ""}" data-pros="${i}">${chip(i, { lift:3, size:"17px" })}</button>`).join("");

};

V.defense = () => {
  const r = S.round;
  const tags = debaters().filter(i => i !== r.con).map(i => `
    <button class="role ${r.pro === i ? "on" : ""}" data-def="${i}">${chip(i, { lift:3, size:"17px" })}</button>`).join("");
  return `
    <p class="eyebrow">Διαβασε την ξανα</p>
    <div class="card">${esc(r.op.text)}</div>
    <p class="cue">Οσοι πιστευουν οτι αυτο που ακουσαν ειναι <b class="pos">σωστο</b> να σηκωσουν το δεξι τους χερι και να ανοιξουν τα ματια τους.</p>
    <div class="vsrow"><span class="vslbl">Εισαγγελεας</span>${chip(r.con, { lift:3, size:"18px" })}</div>
    <h2 class="ask">Υπαρχει καποιος που θελει να υπερασπιστει την υποθεση και να παει κοντρα με τον ${esc(nameOf(r.con))};</h2>
    <div class="roles">${tags}</div>
    <div class="fill"></div>

/* ΟΘΟΝΗ: η εδρα — η επισκοπηση πριν την κοντρα -------------- */

      <div class="duo">

        <div class="seat"><span class="slbl">Υπερασπιση</span>${chip(r.pro, { lift:4, size:"19px" })}</div>

        <button class="endlink" style="margin:0" data-swap="1">Αλλαγη πλευρων</button>

    ${tableHTML(true)}

    <div class="fill"></div>
    ${ibtn("etoimoi.png",'data-go-contra="1"',"mid")}
    <button class="endlink" data-endask="1">Ληξη παιχνιδιου</button>`;
};

/* ΟΘΟΝΗ: η κόντρα — σειρά ομιλητών + σημειώσεις ------------- */
V.contra = () => {
  const r = S.round;
  const cur = r.order[r.cur];
  const speakers = r.order.map((o,k) => {
    const active = k === r.cur, spent = k < r.cur;
    const label = (o.side === "pro" ? "Υπερασπιση" : "Εισαγγελεας") + " &middot; " + esc(nameOf(o.p));
    if (active && !r.opa) return `
      <div class="side on ${o.side==="con"?"con":""}">
        <div class="who">${label}</div>
        <div class="clock" id="curClock">${mmss(r.times[k])}</div>
      </div>`;
    return `
      <div class="side compact ${spent?"spent":""}">
        <div class="who">${label}</div>
        <div class="clock">${mmss(r.times[k])}</div>
      </div>`;
  }).join("");
  const foe = cur.side === "pro" ? "ο εισαγγελεας" : "η υπερασπιση";
  return `
    <p class="eyebrow">Κοντρα &middot; λογος ${Math.floor(r.cur/2)+1} απο ${S.set.rounds || 1} &middot;
      <b>${r.opa ? "ΟΠΑ" : cur.side === "pro" ? "ΥΠΕΡΑΣΠΙΣΗ" : "ΕΙΣΑΓΓΕΛΕΑΣ"}</b></p>
    ${speakers}
    ${r.opa ? `
      <div class="side interrupt">
        <div class="who">Διακοπη &middot; ${esc(foe)}</div>
        <div class="clock" id="opaClock" style="font-size:42px;color:#D9736A">${mmss(r.opaT)}</div>
        <div class="who" id="exNote" style="color:var(--brass)">+${mmss(r.extra[r.cur]||0)}</div>
      </div>
      <p class="mini">ο χρονος της διακοπης γυριζει στον ομιλητη στο τελος</p>
      ${ibtn("telos.png",'data-opa="0"',"mid")}
    ` : `
      ${r.onExtra[r.cur]
        ? `<p class="warn" style="color:var(--brass)">ΕΞΤΡΑ ΧΡΟΝΟΣ &middot;<br>οσο του εφαγαν οι διακοπες</p>`
        : (r.extra[r.cur]||0) > 0
          ? `<p class="mini" style="color:var(--brass)">μαζευτηκαν +${mmss(r.extra[r.cur])} εξτρα για το τελος</p>`
          : ""}
      ${S.set.opa ? ibtn("opa.png",'data-opa="1"',"mid") + '<p class="mini">δινεις τον λογο στον αλλον, μην τον αφησεις να μας ζαλισει</p>'
        : `<button class="btn tmpl mid ${r.paused ? "paused" : ""}" data-pause="1">${r.paused ? "Συνεχεια" : "Παυση"}</button>
           <p class="mini">${r.paused ? "το ρολοι σταματησε" : "σας εκοψαν; σταματαει το ρολοι, χωρις εξτρα χρονο"}</p>`}
    `}
    <details class="notes" ${r.notes ? "open" : ""}>
      <summary>Σημειωσεις δικαστη</summary>
      ${notesField(r.notes)}
    </details>
    <div class="fill"></div>
    <div class="duo-btns">
      ${ibtn("epomenos.png",'data-next="1"')}
      ${ibtn("telos.png",'data-go="verdict"')}
    </div>`;
};

/* ΟΘΟΝΗ: ετυμηγορία — πατας τον νικητη, μετα «Ποντος!» --------- */
V.verdict = () => {
  const r = S.round, pts = true;
  const opt = (i, lbl) => `
    <button class="vpick ${r.pick === i ? "on" : ""}" data-vpick="${i}">
      <span class="slbl">${lbl}</span>

      ${pts ? `<span class="vhp">${hpRow(i)}</span>` : ""}
    </button>`;
  return `
    <h2>Ποιος κερδισε;</h2>
    <div class="vgrid">${opt(r.con, "Εισαγγελεας")}${opt(r.pro, "Υπερασπιση")}</div>
    <p class="mini">${r.pick == null ? "πατα τον νικητη" : esc(nameOf(r.pick)) + " &middot; και τωρα ο ποντος"}</p>
    <div class="fill"></div>
    ${ibtn("pontos.png", `data-award="1" ${r.pick == null ? "disabled" : ""}`)}
    ${ibtn("denbgikeakrh.png",'data-nowin="1"',"small")}`;
};

/* ΟΘΟΝΗ: ο ποντος (η η ποινη) — και η υποθεση καιγεται ------ */
V.sentence = () => {
  const r = S.round, res = r.res, pen = S.scoring === "penalty";
  const burnt = `
    <div class="card burn">${esc(r.op.text)}</div>
    ${ibtn("kahke.png",'data-burnt="1"')}`;
  if (!res) return `
    <div class="stamp">Ακυρη</div>
    <p class="lede" style="margin-top:16px">Δεν βγηκε ακρη — κανεις δεν παιρνει ποντο.</p>
    <div class="fill"></div>
    ${burnt}`;
  if (pen) return `
    <div class="stamp small">Ενοχοι</div>
    <div class="fill"></div>
    <div style="margin:0 0 14px">${chip(res.l, { lift:3, size:"20px" })}</div>
    <h2 style="color:var(--brass);margin:0">${esc(S.penalty)}</h2>
    <div class="hpline"><span class="hp big">${heartsHTML(res.lifeAfter, res.lifeAfter)}</span></div>
    ${res.lifeAfter === 0 ? `<p class="warn">τελειωσαν οι ζωες</p>` : ""}
    <p class="mini">κερδισε ο ${esc(nameOf(res.w))}</p>
    <div class="fill"></div>
    ${burnt}`;
  const dead = res.lifeAfter === 0;
  const won = res.winsAfter >= CFG.WINS;
  return `
    <div class="score">
      <div class="srow2">
        ${chip(res.w, { lift:4, size:"21px" })}<b class="delta up">+1</b>
        <span class="hp big">${winsHTML(res.winsAfter, res.winsAfter - 1)}</span>
      </div>
      <div class="srow2">
        ${chip(res.l, { lift:4, size:"21px" })}<b class="delta down">&minus;1</b>
        <span class="hp big">${heartsHTML(res.lifeAfter, res.lifeAfter)}</span>
      </div>
    </div>
    ${won ? `<p class="warn" style="color:var(--brass)">${CFG.WINS} νικες! Το παιχνιδι τελειωνει.</p>`
          : dead ? `<p class="warn">${esc(nameOf(res.l))}: τελειωσαν οι ζωες</p>` : ""}
    <div class="fill"></div>
    ${burnt}`;
};

/* ΟΘΟΝΗ: δεν βγηκε κοντρα — η υποθεση καιγεται ---------------- */
V.burnt = () => `

  <div class="card burn">${esc(S.round.op.text)}</div>

  <div class="fill"></div>
  ${ibtn("kahke.png",'data-burnt="1"')}`;

/* ΟΘΟΝΗ: αναπληρωση (με τα δικα μας) -------------------------- */
V.refill = () => `
  <div class="fill"></div>
  <h2>Δωσε το κινητο</h2>
  <p class="lede">Μια υποθεση εφυγε. Καποιος γραφει καινουρια στη θεση της — ή συνεχιζετε με οσες εμειναν.</p>
  <p class="mini">${S.opinions.length} ${S.opinions.length === 1 ? "υποθεση" : "υποθεσεις"} στον φακελο</p>

    ${ibtn("grafw.png",'data-extra="round"')}

/* ΟΘΟΝΗ: εξοδος παιχτη — μετα την κοντρα, πριν την επομενη δικη */
function voteBtn(from){
  return canVote() ? `<button class="votebtn" data-vote="${from || "exit"}">Ψηφοφορια<small>υποψιαζεστε κρυφο ρολο;</small></button>` : "";
}
V.exit = () => {
  const ev = S.outQueue[0];

  if (ev.kind === "bullet") return `
    <div class="stamp small brass">Μπηκε βυσμα!</div>
    <div style="margin:20px 0 8px">${chip(ev.saved, { pad:"11px 24px", lift:5, size:"24px" })}</div>
    <p class="lede" style="color:var(--bone);font-size:18px;margin:0 0 14px">επεφτε... αλλα ειχε βυσμα!</p>
    <div class="card" style="font-size:16px">
      <div style="margin:0 0 10px">${chip(ev.who, { lift:3, size:"17px" })}</div>
      ηταν το Βυσμα του και βγαινει στη θεση του. Ο ${esc(nameOf(ev.saved))} παιρνει μια ζωη παραπανω.
    </div>
    <div class="hpline"><span class="hp big">${heartsHTML(S.life[ev.saved] || 0, -1)}</span></div>
    <div class="fill"></div>

    <img class="bigicon" src="${IMG}loss.png" alt="">
    <div style="margin:10px 0 12px">${chip(ev.who, { pad:"12px 26px", radius:"24px", dash:5, lift:6, size:"28px" })}</div>
    <h2 style="color:var(--blood);text-shadow:var(--stroke)">Εχασες!</h2>
    <p class="lede" style="color:var(--bone);font-size:17px">${CFG.LIVES} ηττες μαζεψες, νομιζω ηρθε η ωρα σου να βαλεις γλωσσα μεσα. Μενεις ενορκος!</p>
    ${S.scoring === "penalty" ? `<div class="penbox"><span class="slbl">Η ποινη της εξοδου</span><b>${esc(S.penalty)}</b></div>` : ""}
    <div class="fill"></div>
    ${voteBtn()}
    <button class="btn tmpl mid" data-exitnext="1">Συνεχιζουμε</button>`;
};

/* ΟΘΟΝΗ: η ψηφος του τραπεζιου — στο στυλ του κανονισμου ------ */
V.vote = () => {
  const R = S.roles, v = S.vote;
  const cards = [];
  if (R.k != null && !S.kRevealed) cards.push(["komplex", "Το Κομπλεξ"]);
  if (R.v != null && !S.vRevealed) cards.push(["vysma", "Το Βυσμα"]);
  const cand = alive().map(i => `
    <button class="role ${v.who === i ? "on" : ""}" data-vwho="${i}">${chip(i, { lift:3, size:"16px" })}</button>`).join("");
  return `
  <div class="turf">
  <div class="rail"></div>
  <h2 style="text-align:center">Ποιον καιτε;</h2>
  <div class="rules sset">
    <p style="margin-top:4px">Υποψιαζεστε καποιον για κρυφο ρολο; Διαλεξτε φυλλο και δειξτε εναν. <b>Οποιον δειξετε, φευγει απο το παιχνιδι</b> — ειτε πεσατε μεσα ειτε οχι.</p>
    <h3>Το φυλλο</h3>
    <div class="srow">${cards.map(c => `<button class="sopt ${v.role === c[0] ? "on" : ""}" data-vrole="${c[0]}">${c[1]}</button>`).join("")}</div>
    <h3>Ο υποπτος</h3>
    <div class="roles" style="justify-content:center">${cand}</div>
  </div>
  <div class="finish"></div>
  </div>
  <div class="fill"></div>
  <button class="btn tmpl mid" data-vgo="1" ${v.who == null ? "disabled" : ""}>${v.who == null ? "Δειξτε εναν" : "Καψτε τον " + esc(nameOf(v.who))}</button>
  ${ibtn("oxi.png",'data-vcancel="1"',"small")}`;
};

V.voteResult = () => {
  const r = S.voteResult;
  const role = r.role === "komplex" ? "το Κομπλεξ" : "το Βυσμα";
  return `
    <div class="stamp ${r.right ? "brass" : ""}">${r.right ? "Σωστα!" : "Λαθος!"}</div>
    <div style="margin:20px 0 10px">${chip(r.who, { pad:"11px 24px", lift:5, size:"24px" })}</div>
    <p class="lede" style="color:var(--bone);font-size:18px">${r.right
      ? "ηταν " + role + ". Το φυλλο καηκε και φευγει απο το παιχνιδι."
      : "δεν ηταν " + role + ". Φευγει παντως — ετσι ειναι οι λαικες δικες."}</p>
    <div class="fill"></div>
    <button class="btn tmpl mid" data-vdone="1">Συνεχιζουμε</button>`;
};

/* === ΤΟ ΤΕΛΟΣ ================================================= */
function flowersHTML(E){
  if (!E || E.flowers == null) return "";
  return `<div class="flowers"><b>Ολα τα λουλουδια για τον ${esc(nameOf(E.flowers))}</b>, ξερει να σας καυλανταει.</div>`;
}
function rolesReveal(){
  const R = S.roles;
  if (!R) return "";
  const row = (lbl, a, mid, b) => `<div class="rv"><span class="slbl">${lbl}</span>${chip(a, { lift:2, size:"14px" })}<span>${mid}</span>${chip(b, { lift:2, size:"14px" })}</div>`;
  return `<div class="reveal"><p class="slbl" style="margin:0">Οι κρυφοι ρολοι</p>
    ${R.k != null ? row("Κομπλεξ", R.k, "με τον", R.kT) : ""}
    ${R.v != null ? row("Βυσμα", R.v, "του", R.vT) : ""}</div>`;
}
const endBtns = () => `<div class="duo-btns">${ibtn("telos.png",'data-home="1"')}${ibtn("alloena.png",'data-again="1"')}</div>
  <button class="endlink" data-sendops="1">Κρατα υποθεσεις στον φακελο</button>`;

/* ΟΘΟΝΗ: νικη κρυφου ρολου ----------------------------------- */
V.roleWin = () => {
  const E = S.endInfo, k = E.kind === "komplex";
  return `
    <div class="stamp brass">${k ? "Το Κομπλεξ!" : "Μπηκε βυσμα!"}</div>
    <div style="margin:22px 0 10px">${chip(E.champ, { pad:"13px 28px", radius:"24px", dash:6, lift:6, size:"32px" })}</div>
    <h2 style="color:var(--brass)">${k ? "τα πηρε ολα" : "και νικαει!"}</h2>
    <div class="card" style="font-size:16px">${k
      ? `Ειχε κομπλεξ με τον ${esc(nameOf(E.target))} και τον εβγαλε απο το παιχνιδι. Νικη επιτοπου.`
      : `Ο ${esc(nameOf(E.prot))} εφτασε στην κορυφη... αλλα ο ${esc(nameOf(E.champ))} ηταν το βυσμα του. Νικαει ο ${esc(nameOf(E.champ))}. Ο ${esc(nameOf(E.prot))} μετα τον φασωνει.`}</div>
    ${flowersHTML(E)}
    ${rolesReveal()}
    <div class="fill"></div>
    ${endBtns()}`;
};

/* ΟΘΟΝΗ: απολογισμος ----------------------------------------- */
function tally(){
  const ks = S.players.map((_, k) => k), E = S.endInfo || {};
  const sc = k => (S.out[k] ? 0 : 1000) + (S.life[k] || 0) * 100 + (S.wins[k] || 0);
  const top = Math.max.apply(null, ks.map(sc)), low = Math.min.apply(null, ks.map(sc));
  return { champs: E.champ != null ? [E.champ] : ks.filter(k => sc(k) === top),
           losers: top === low ? [] : ks.filter(k => sc(k) === low && k !== E.champ) };
}
V.theEnd = () => {
  const E = S.endInfo || { kind: "tie" };
  if (S.scoring === "penalty"){
    const t = tally();
    return `
    <div class="stamp">Εληξε</div>
    ${E.byDeck ? `<p class="mini">τελειωσαν οι υποθεσεις του φακελου</p>` : ""}
    <div class="fill"></div>
    <h1 style="margin:0 0 16px">συγχαρητηρια!</h1>
    <div class="roster" style="justify-content:center;margin-bottom:18px">
      ${t.champs.map(k => chipName(k, S.players[k], { pad:"11px 24px", lift:5, size:"23px" })).join("")}
    </div>
    <h2 style="color:var(--brass);margin:0 0 8px">εχεις την μεγαλη τιμη να διαλεξεις την εσχατη ποινη</h2>
    <p class="lede" style="margin:0">ο,τι θες, παρε τον χρονο σου.</p>
    ${flowersHTML(E)}
    ${rolesReveal()}
    ${t.losers.length ? `
      <p class="mini" style="margin-top:24px">Ο λογαριασμος παει σε</p>
      <div class="roster" style="justify-content:center;margin-top:8px">
        ${t.losers.map(k => chipName(k, S.players[k], { lift:3 })).join("")}
      </div>` : ""}
    <div class="fill"></div>
    ${endBtns()}`;
  }
  const line = { wins: CFG.WINS + " νικες. Νικητης της δικης!", last: "ο τελευταιος ορθιος. Νικητης της δικης!",
                 manual: "με τις περισσοτερες νικες. Νικητης της δικης!" }[E.kind] || "";
  return `
    <div class="stamp">Εληξε</div>
    ${E.byDeck ? `<p class="mini">τελειωσαν οι υποθεσεις του φακελου</p>` : ""}
    ${E.champ != null
      ? `<div style="margin:24px 0 8px">${chip(E.champ, { pad:"13px 28px", radius:"24px", dash:6, lift:6, size:"32px" })}</div>
         <p class="lede">${line}</p>`
      : `<h2 style="margin-top:24px">Τι ειπατε ρε παιδια καν;</h2>
         <p class="lede">Ισοπαλια στην κορυφη. Δεν βγαινει νικητης.</p>`}
    ${flowersHTML(E)}
    ${rolesReveal()}
    ${finalTable()}
    <div class="fill"></div>
    ${endBtns()}`;
};

/* ΟΘΟΝΗ: Ο ΦΑΚΕΛΟΣ ------------------------------------------- */
V.folder = () => {
