<!doctype html>
<html lang="el">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="ops.js"></script>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ΚΟΝΤΡΑ</title>

<!--
  ΚΟΝΤΡΑ — prototype
  ─────────────────────────────────────────────
  ΘΕΛΕΙ ΤΟΝ ΦΑΚΕΛΟ img/ ΔΙΠΛΑ ΤΟΥ:
    index.html
    img/ kontra.png playerCount.png dinworko.png akyro.png uper.png kata.png
         info.png praktika.png zero.png one.png two.png three.png four.png
         five.png six.png seven.png eight.png nine.png

  Για να αλλάξεις ζωγραφιά: αντικατέστησε το PNG με ίδιο όνομα. Κώδικας δεν αλλάζει.

    [1]  ΧΡΩΜΑΤΑ & ΓΡΑΜΜΑΤΟΣΕΙΡΕΣ   <- ξεκίνα από εδώ για αλλαγές UI
    [1β] ΚΟΥΜΠΙΑ-ΕΙΚΟΝΕΣ & ΜΕΤΡΗΤΗΣ <- το καινούριο κομμάτι
    [2]  ΒΑΣΙΚΗ ΔΙΑΤΑΞΗ
    [3]  ΤΥΠΟΓΡΑΦΙΑ
    [4]  ΚΟΥΜΠΙΑ & ΠΕΔΙΑ
    [5]  ΚΑΡΤΕΣ, ΨΗΦΟΦΟΡΙΑ, ΣΗΜΕΙΩΣΕΙΣ
    [6]  ΣΦΡΑΓΙΔΑ (το σήμα κατατεθέν)
    [7]  ΧΡΟΝΟΜΕΤΡΟ & ΟΜΙΛΗΤΕΣ
    [8]  ΡΥΘΜΙΣΕΙΣ ΠΑΙΧΝΙΔΙΟΥ        <- τιμωρία, χρόνοι, όρια, modes
    [9]  ΑΠΟΘΗΚΕΥΣΗ (πρακτικά)
    [10] ΚΑΤΑΣΤΑΣΗ ΠΑΙΧΝΙΔΙΟΥ
    [11] ΟΘΟΝΕΣ                       <- το HTML κάθε οθόνης
    [12] ΛΟΓΙΚΗ
    [13] RENDER & ΣΥΜΒΑΝΤΑ

  ΡΟΗ ΟΘΟΝΩΝ:
    count -> intro -> more -> (intro...) -> lastCall -> round
    round -> eyes -> hearing -> select -> contra -> verdict
          -> sentence -> archive -> (extra) -> round

  >>> ΤΟ ΚΕΙΜΕΝΟ ΤΩΝ ΚΑΝΟΝΩΝ μπαίνει στην οθόνη V.rules, τμήμα [11].
      Ψάξε τη σήμανση: ΕΔΩ ΜΠΑΙΝΟΥΝ ΟΙ ΚΑΝΟΝΕΣ ΑΠΟ ΤΟ PDF
-->

<style>
/* === [1] ΧΡΩΜΑΤΑ & ΓΡΑΜΜΑΤΟΣΕΙΡΕΣ ============================== */
:root{
  --ink:#2E1C0E;        /* φόντο */
  --surface:#732803;    /* κάρτες, πεδία = το μέσα των σχεδίων */
  --surface-2:#732803;  /* κουμπιά κειμένου */
  --line:#000000;       /* περιγράμματα, όπως στις ζωγραφιές */
  --bone:#FFF3E4;       /* κείμενο */
  --muted:#C9A98F;      /* δευτερεύον κείμενο */
  --blood:#ED1C24;      /* το κόκκινο σου */
  --blood-dim:#6E211A;
  --brass:#FFC90E;      /* το κίτρινο σου */

  /* Γραμματοσειρα: Comfortaa, κατεβαινει με τη σελιδα και
     φαινεται ΙΔΙΑ σε καθε κινητο (Android, iPhone, ταμπλετα).
     Εχει ελληνικα, ειναι στρογγυλεμενη, και ειναι η ιδια με
     την Κοντρα στα Γρηγορα.                                */
  --display:Comfortaa,"Trebuchet MS",system-ui,sans-serif;
  --body:Comfortaa,"Trebuchet MS",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;

  /* το μαύρο περίγραμμα των γραμμάτων — άλλαξε το 2px για πιο χοντρό */
  --stroke:-2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
}

/* === [1β] ΚΟΥΜΠΙΑ-ΕΙΚΟΝΕΣ & ΜΕΤΡΗΤΗΣ ==========================
   .ibtn      = κουμπί που είναι σκέτη η ζωγραφιά σου
   .art       = ζωγραφιά χωρίς κουμπί (τίτλος, ετικέτα)
   .ibtn.small= τα στρογγυλά (info, ο Φάκελος)
   Οι εικόνες έχουν το ίδιο καφέ με το φόντο, οπότε χωνεύουν μόνες τους. */
.ibtn{display:block;width:100%;padding:0;margin-top:10px;background:none;border:none;
  cursor:pointer;transition:transform .1s}
.ibtn img,.art{display:block;width:100%;height:auto}
.ibtn img{pointer-events:none}
.ibtn:active{transform:scale(.96)}
.ibtn:disabled{opacity:.4;cursor:default}
.art{margin:2px 0 4px}

/* ΤΟ ΠΙΣΩ — στρογγυλο, χοντρο μαυρο περιγραμμα, ασπρο μεσα,
   μαυρο βελακι. Μπαινει πανω αριστερα, σε οθονες οπου μπορει
   να διαλεξε κανεις καταλαθος.                                  */
.backrow{display:flex;justify-content:flex-start;margin:0 0 4px}
.back{width:46px;height:46px;flex:none;padding:0;border-radius:50%;
  border:4px solid #000;background:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 0 rgba(0,0,0,.5);transition:transform .1s,box-shadow .1s}
.back:active{transform:translateY(4px);box-shadow:0 0 0 rgba(0,0,0,.5)}
.back svg{display:block;width:26px;height:26px;pointer-events:none}
.art.mid{width:62%;margin:6px auto 2px}   /* «Αριθμος Ατομων» μικρότερο */

/* η γραμμή στην κορυφή: κανόνες αριστερά, ο Φάκελος δεξιά */
.hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2px}
.hdr .ibtn{width:54px;margin:0;flex:none}
/* το κουμπί λήξης στη μέση της κορυφής — μικρό, μπαίνει από τον 3ο γύρο */
.hdr .ibtn.endbtn{width:76px;align-self:center}

/* «ΠΑΙΧΤΕΣ» — ετικέτα αντί για ζωγραφιά */
.players{font-family:var(--display);font-weight:700;font-size:27px;text-align:center;
  color:var(--bone);margin:14px 0 2px;
  text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000}

/* επιλεγμένο / ανεπίλεκτο κουμπί-ζωγραφιά */
.ibtn.dim{opacity:.42}

/* Όλα τα κουμπιά-ζωγραφιές: πλήρες πλάτος, κεντραρισμένα.
   (Οι παλιές ρυθμίσεις ανά κουμπί αφαιρέθηκαν.)            */

/* δύο ζωγραφιστά κουμπιά δίπλα-δίπλα, στο ΙΔΙΟ ύψος
   (οι ζωγραφιές έχουν διαφορετικές αναλογίες, οπότε κλειδώνουμε το ύψος) */
.row.even{align-items:center;gap:14px}
.row.even .ibtn img{height:92px;width:auto;margin:0 auto}

/* ── ΖΩΓΡΑΦΙΣΤΑ ΠΛΑΙΣΙΑ ΚΕΙΜΕΝΟΥ ───────────────────────────
   Η ζωγραφιά είναι ΦΟΝΤΟ που τεντώνεται στο μέγεθος του κουτιού.
   Το κείμενο είναι κανονικό στοιχείο με padding σε px, οπότε
   κρατάει πάντα την ίδια απόσταση από το περίγραμμα, ό,τι
   μέγεθος οθόνης κι αν έχει. ΑΠΟΣΤΑΣΗ = τα px του padding.   */
.field{margin:12px 0 8px;
  background:url(img/textbox_name.png) no-repeat center/100% 100%;
  padding:30px 44px;min-height:104px;display:flex;align-items:center}
.field.op{background-image:url(img/textbox_opinion.png);
  padding:56px 60px;min-height:240px;align-items:flex-start}
.field input,.field textarea{width:100%;background:none;border:none;outline:none;
  color:#161616;font-family:var(--display);font-weight:400;text-shadow:none;
  font-size:19px;line-height:1.4;padding:0;margin:0;display:block;text-align:left;
  -webkit-appearance:none}
.field textarea{min-height:130px;resize:none}
.field input::placeholder,.field textarea::placeholder{color:#8C8C8C}

/* μετρητής αριθμού ατόμων */
.counter{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:6px}
.counter .pm{width:64px;flex:none;padding:0;background:none;border:none;cursor:pointer}
.counter .pm svg{display:block;width:100%;height:auto}
.counter .pm:active{transform:scale(.94)}
.counter .pm:disabled{opacity:.35}
.counter .digits{display:flex;gap:4px}
.counter .digits img{display:block;height:84px;width:auto}

/* τα ΥΠΕΡ / ΚΑΤΑ μέσα στη λίστα του μετρήματος */
.t img{height:40px;width:auto;display:block;flex:none}

/* === [2] ΒΑΣΙΚΗ ΔΙΑΤΑΞΗ ====================================== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#000;color:var(--bone);font-family:var(--body);
  font-size:17px;line-height:1.45;overscroll-behavior:none}
/* Η κορνίζα της εφαρμογής: μαύρη, στρογγυλεμένη.
   ΠΑΧΟΣ = το 11px. ΣΤΡΟΓΓΥΛΕΜΑ = το border-radius.
   Η inset σκιά ακολουθεί μόνη της τη στρογγυλή γωνία.        */
#app{position:relative;max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  background:var(--ink);text-align:center;
  border:11px solid #000;border-radius:28px;
  padding:calc(env(safe-area-inset-top) + 22px) 20px calc(env(safe-area-inset-bottom) + 22px)}
.fill{flex:1}
.row{display:flex;gap:10px;align-items:flex-end}
.row .btn{flex:1}
.row .ibtn{flex:1}
hr{border:none;border-top:4px solid rgba(0,0,0,.5);margin:18px 0}

/* === [3] ΤΥΠΟΓΡΑΦΙΑ ========================================== */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--muted);margin:0 0 14px}
.eyebrow b{color:var(--brass);font-weight:400}
h1{text-align:center;font-family:var(--display);font-weight:700;font-size:40px;line-height:1.05;
  margin:0 0 6px;color:var(--bone);
  text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000}
h2{font-family:var(--display);font-weight:700;font-size:25px;line-height:1.2;margin:0 0 10px}
.lede{color:var(--muted);margin:0 0 22px;font-size:15px}
.count{font-family:var(--mono);font-size:12px;letter-spacing:.14em;
  color:var(--muted);text-transform:uppercase;margin-top:14px}
.mini{font-family:var(--mono);font-size:12px;letter-spacing:.1em;
  color:var(--muted);text-align:center;margin-top:14px}

/* Comic Sans λευκό έντονο με μαύρο περίγραμμα — ΠΑΝΤΟΥ.
   Οι μόνες εξαιρέσεις είναι τα πεδία μέσα στα ζωγραφιστά
   textbox (πιο κάτω), που είναι μαύρα πάνω σε λευκό.        */
#app, #app *{font-family:var(--display)}
#app h1, #app h2, #app .lede, #app .count, #app .mini, #app .eyebrow,
#app label, #app .card, #app .rules, #app .rules h3, #app .players,
#app .chip, #app .t span, #app .t em, #app .side .who, #app .clock,
#app .rec .h, #app .rec .o, #app .rec .n, #app details.notes summary{
  font-weight:700;
  text-shadow:var(--stroke);
}
/* τα ουδέτερα γίνονται λευκά· τα κίτρινα μένουν κίτρινα */
#app .lede, #app .count, #app .mini, #app .eyebrow, #app label,
#app .side .who, #app .t em, #app .rec .h, #app .rules{ color:var(--bone) }

/* === [4] ΚΟΥΜΠΙΑ & ΠΕΔΙΑ ===================================== */
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.btn{display:block;width:100%;padding:14px 16px;margin-top:10px;
  background:var(--surface-2);border:5px solid var(--line);
  border-radius:48% 52% 50% 50% / 60% 56% 44% 40%;
  font-family:var(--display);font-size:20px;font-weight:700;color:var(--blood);
  text-shadow:-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,2px 2px 0 #fff,
              0 -2px 0 #fff,0 2px 0 #fff,-2px 0 0 #fff,2px 0 0 #fff;
  text-align:center;transition:transform .09s}
.btn:active{transform:scale(.95)}
.btn.primary{color:var(--blood)}
.btn.ghost{font-size:16px;padding:11px 14px;border-width:4px}
/* τετράγωνη εκδοχή, ίδια φάση με τα πλαίσια των ονομάτων */
.btn.box{border-radius:16px}
/* ΖΩΓΡΑΦΙΣΤΟ ΚΟΥΜΠΙ — η ζωγραφιά είναι φόντο που τεντώνεται,
   το κείμενο μένει μέσα στο λευκό με σταθερό padding σε px.  */
.btn.tmpl{background:url(img/km-btn.png) no-repeat center/100% 100%;
  border:none;border-radius:0;color:#161616;text-shadow:none;
  min-height:88px;padding:22px 58px;margin-top:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;line-height:1.15}
.btn.tmpl:active{transform:scale(.96)}
.btn.brass{color:var(--brass)}
.btn:disabled{opacity:.35;cursor:default}

input,textarea{width:100%;padding:12px;background:var(--surface);color:var(--bone);
  border:4px solid var(--line);border-radius:14px;font:inherit}
textarea{min-height:120px;resize:none;font-family:var(--mono);font-size:15px;line-height:1.5}
button:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
input:focus,textarea:focus{outline:none}
label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--muted);margin:20px 0 7px}

/* πεδίο αριθμού παικτών */
input.big{font-family:var(--display);font-size:32px;text-align:center;padding:16px;
  letter-spacing:.06em}
input.big::-webkit-outer-spin-button,
input.big::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input.big[type=number]{-moz-appearance:textfield}

/* === [5] ΚΑΡΤΕΣ, ΨΗΦΟΦΟΡΙΑ ================================== */
.card{background:var(--surface);border:5px solid var(--line);border-radius:20px;
  padding:18px;font-family:var(--display);font-size:19px;line-height:1.45}

.tally{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.t{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  padding:9px 14px;background:var(--ink);border:4px solid var(--line);
  border-radius:16px;min-height:58px}
.t span{font-family:var(--display);font-size:19px;text-align:left}
.t em{font-family:var(--mono);font-size:11px;letter-spacing:.16em;font-style:normal;color:var(--muted)}
.t.pro{border-color:var(--brass);background:rgba(199,154,63,.09)}
.t.pro em{color:var(--brass)}
.t.con{border-color:var(--blood);background:rgba(163,46,36,.12)}
.t.con em{color:#D9736A}
.t.picked{border-width:2px}
.t.out{opacity:.45}

/* παιχτες */
.roster{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.chip{font-family:var(--display);font-size:15px;padding:5px 12px;
  background:var(--surface);border:3px solid var(--line);border-radius:14px}

/* ο Φάκελος */
.rec{border-left:2px solid var(--line);padding:0 0 4px 14px;margin-bottom:22px}
.rec .h{font-family:var(--mono);font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.rec .o{font-family:var(--mono);font-size:15px;line-height:1.5;margin-bottom:8px}
.rec .n{font-size:15px;color:var(--brass);white-space:pre-wrap;line-height:1.5}

/* κανόνες */
.rules{font-size:15px;color:var(--muted);line-height:1.65}
.rules b{color:var(--bone);font-weight:600}
.rules h3{font-family:var(--display);font-size:21px;color:var(--brass);margin:22px 0 6px}

/* σημειώσεις δικαστή */
details.notes{margin-top:14px}
details.notes summary{font-family:var(--mono);font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--brass);cursor:pointer;padding:10px 0;list-style:none}
details.notes summary::-webkit-details-marker{display:none}
details.notes summary::before{content:"\270E  "}
details.notes textarea{min-height:0;border:none;background:none}

/* === [6] ΣΦΡΑΓΙΔΑ =========================================== */
.stamp{border:6px double var(--line);color:var(--blood);font-family:var(--display);
  font-weight:700;font-size:clamp(28px,10vw,46px);
  text-align:center;padding:12px 10px;transform:rotate(-5deg);margin:10px 0;
  background:var(--surface);
  text-shadow:-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,2px 2px 0 #fff;
  animation:slam .42s cubic-bezier(.2,1.5,.4,1) both}
.stamp.brass{border-color:var(--brass);color:var(--brass)}
.stamp.small{font-size:clamp(22px,8vw,34px);border-width:3px}
@keyframes slam{
  0%{transform:rotate(-16deg) scale(2.6);opacity:0}
  60%{opacity:1}
  100%{transform:rotate(-5deg) scale(1);opacity:1}
}
@media (prefers-reduced-motion:reduce){.stamp{animation:none}}

/* === [7] ΧΡΟΝΟΜΕΤΡΟ & ΟΜΙΛΗΤΕΣ ============================== */
.clock{font-family:var(--mono);font-size:58px;letter-spacing:.04em;text-align:center;
  font-variant-numeric:tabular-nums;margin:4px 0 2px}
.side{padding:13px;border:4px solid var(--line);background:var(--surface);
  margin-bottom:8px;border-radius:18px}
.side .who{font-family:var(--display);font-size:16px;color:var(--muted);text-align:center}
.side.on{border-color:var(--brass);border-width:5px}
.side.on .who{color:var(--bone)}
.side.on.con{border-color:#000C7B}
.side.interrupt{border-color:var(--blood)}

/* ουρά ομιλητών: συμπαγείς γραμμές */
.side.compact{display:flex;align-items:center;justify-content:space-between;padding:11px 14px}
.side.compact .who{text-align:left;font-size:11px}
.side.compact .clock{font-size:19px;margin:0;color:var(--muted)}
.side.spent{opacity:.35}


/* οθόνη «κλείστε τα μάτια» */
.dark{background:#000;position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:34px;text-align:center;z-index:9;
  border:11px solid #000;border-radius:28px}
.dark p{font-family:var(--display);font-weight:700;font-size:32px;color:var(--bone);
  text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000;
  margin:0 0 34px;line-height:1.25}
.dark .btn{max-width:280px}
.dark .ibtn{max-width:250px;margin:0 auto}

/* === [14] ΚΛΕΙΔΩΜΑ ΣΕ ΜΙΑ ΟΘΟΝΗ (app mode) ====================
   Η σελιδα ΔΕΝ σκρολαρει ποτε. Σκρολαρει μονο το #app απο μεσα.
   Ετσι φευγει το pull-to-refresh, το bounce και η μπαρα του browser. */
html,body{height:100%;overflow:hidden;overscroll-behavior:none;
  touch-action:manipulation;position:fixed;inset:0;width:100%}
#app{height:100%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app input,#app textarea{-webkit-user-select:text;user-select:text}

/* === [15] ΝΑ ΜΗΝ ΚΟΒΕΤΑΙ ΚΑΝΕΝΑ ΚΕΙΜΕΝΟ ======================
   Ολα τα κουτια σπανε τη λεξη αντι να τη βγαζουν απ εξω, και τα
   ζωγραφιστα πλαισια δινουν λιγοτερο padding σε στενες οθονες.   */
#app h1,#app h2,#app .lede,#app .card,#app .rules,#app .chip,
#app .t span,#app .rec .o,#app .rec .n,#app .side .who,#app .eyebrow{
  overflow-wrap:anywhere;word-break:break-word;hyphens:auto}
.card{max-width:100%}

.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.9);

.picks{display:flex;flex-direction:column;gap:9px;margin-top:6px}

/* === ΦΟΝΤΟ ΙΠΠΟΔΡΟΜΙΟΥ — μονο στην οθονη των κανονων =========

.turf{margin:0 -8px;padding:0 8px 12px;border-radius:20px;

/* η <Παρενθεση> του κανονισμου */

  font-weight:700;text-shadow:none}
/* θεση για τη φωτογραφια που θα μπει */
.rules .photo{margin:14px 0;min-height:132px;display:flex;align-items:center;
  justify-content:center;border:4px dashed rgba(255,243,228,.4);border-radius:14px;

/* η πορτα για την Κοντρα στα Γρηγορα — σκετη ζωγραφια */
.kdoor{width:23%;margin:6px auto 0;opacity:.62;transition:opacity .2s,transform .1s}

/* ΖΩΓΡΑΦΙΣΤΟ ΚΟΥΜΠΙ: το ιδιο πλαισιο με comic sans, οπου χρειαζεται */
.imgbtn{border:none;border-radius:0;cursor:pointer;

.how{display:flex;gap:10px;margin-top:8px}

</style>

<div id="app"></div>

<script>
"use strict";

/* === [8] ΡΥΘΜΙΣΕΙΣ ΠΑΙΧΝΙΔΙΟΥ ==============================
   Άλλαξε αυτά για ισορροπία και όρια, χωρίς να ψάξεις αλλού.  */
const CFG = {
  MIN_PLAYERS: 3,
  MAX_PLAYERS: 15,
  DEFAULT_PLAYERS: 5,
  DEFAULT_PENALTY: "ποινη",
  DEFAULT_SCORING: "points",       // "points" = με ποντους, "penalty" = με ποινη
  TIME_OPTIONS: [120, 180, 300],   // χρονος λογου, σε δευτερολεπτα
  DEFAULT_TIME: 120,
  UNLOCK_2V2: 5,                   // από πόσους παίκτες ξεκλειδώνει το 2v2
  UNLOCK_3V3: 7,                   // από πόσους παίκτες ξεκλειδώνει το 3v3
  MAX_NAME: 14,
  MAX_OPINION: 240,
  AGAIN_EACH: 1,                   // ποσες αποψεις γραφει ο καθενας στο νεο παιχνιδι
  MIN_ROUNDS_TO_END: 3,            // απο ποσους γυρους και μετα ο δικαστης μπορει να ληξει
  LOW_DECK: 3,                     // απο ποσες αποψεις και κατω βγαινει η κοκκινη προειδοποιηση
  STORE_KEY: "kontra.praktika.v1",
  SEEN_KEY: "kontra.seen.v1",      // αν εχει ξαναμπει ο χρηστης (καλωσορισμα μια φορα)
  FOLDER_KEY: "kontra.folder.v1",     // Ο ΦΑΚΕΛΟΣ: οι αποψεις που κρατησε το τραπεζι
  DEVOPS_KEY: "kontra.dimiourgos.v1", // ο φακελος του δημιουργου
  READY_DECK: 16                      // ποσες ετοιμες αποψεις μπαινουν στη δικογραφια
};

/* ΜΑΡΚΕΣ: το ιδιο χρωματολογιο με την Κοντρα στα Γρηγορα.
   fill = το χρωμα, ink = το γραμμα.                            */
const COLORS = [
  { name:"Βυσσινι",   fill:"#5c1024", ink:"#f6e0e6" },
  { name:"Λαδι",      fill:"#33401a", ink:"#eef3e2" },
  { name:"Πετρολ",    fill:"#123c46", ink:"#e0f0f3" },
  { name:"Μελιτζανι", fill:"#3d1a4d", ink:"#f0e2f6" },
  { name:"Καφε",      fill:"#4a2a15", ink:"#f6ead9" },
  { name:"Μπορντο",   fill:"#3d0d12", ink:"#f6dede" },
  { name:"Μπλε νυχτα",fill:"#141f45", ink:"#e2e6f6" },
  { name:"Χακι",      fill:"#4a3f1c", ink:"#f6f1d9" },
  { name:"Ανθρακι",   fill:"#242629", ink:"#eceff1" },
  { name:"Σκουρο κυπαρισσι", fill:"#123425", ink:"#e0f3e8" },
  { name:"Σκουρια",   fill:"#5a2a10", ink:"#f6e6d9" },
  { name:"Μαβι",      fill:"#2c2440", ink:"#e8e4f6" }
];
/* δυο σχεδια, χοντρα και ξεχωριστα μεταξυ τους */
const PATS = [
  { name:"Καρο",  css:f => "repeating-conic-gradient(rgba(255,255,255,.16) 0 25%,rgba(255,255,255,0) 0 50%) 0 0/26px 26px," + f },
  { name:"Ριγες", css:f => "repeating-linear-gradient(135deg,rgba(255,255,255,.18) 0 13px,rgba(255,255,255,0) 13px 30px)," + f }
];
/* παραδειγματα για το πλαισιο της αποψης — αλλαζει καθε φορα */
const OP_EG = [
  "ο σκυλος είναι καλυτερος απτην γατα",
  "η πιτσα με ανανα ειναι εγκλημα",
  "το μπασκετ ειναι πιο ωραιο απτο ποδοσφαιρο",
  "καλυτερα μονος παρα με κακη παρεα",
  "ο σκετος καφες ειναι για επιδειξη",
  "τα ζωδια τα πιστευουν οσοι βαριουνται",
  "το βουνο ειναι καλυτερο απτη θαλασσα",
  "οποιος βαζει μουσικη σε ηχειο στην παραλια ειναι για δεσιμο",
  "η ταινια ειναι παντα χειροτερη απτο βιβλιο",
  "δεν υπαρχει καλη δικαιολογια για αργοπορια",
  "ο φραπες δεν ειναι καφες, ειναι τροπος ζωης",
  "καλυτερα να πεις οχι παρα να το κανεις με μισα μουτρα"
];

/* φάκελος και ονόματα των ζωγραφιών σου */
const IMG = "img/";
const DIGIT = ["zero","one","two","three","four","five","six","seven","eight","nine"];
/* ζωγραφιές για τον χρόνο λόγου· όποιο λείπει βγαίνει ως κείμενο */
const TIME_IMG = { 120:"2lepta.png", 180:"3lepta.png", 300:"5lepta.png" };

/* === [9] ΑΠΟΘΗΚΕΥΣΗ ========================================
   Δοκιμάζει localStorage. Αν δεν επιτρέπεται (π.χ. σε preview),
   πέφτει σε μνήμη ώστε να μη σκάει πουθενά.                   */
const Store = (() => {
  let mem = null, ok = true;
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); }
  catch(e){ ok = false; }
  return {
    persistent: ok,
    load(){
      try { return ok ? (JSON.parse(localStorage.getItem(CFG.STORE_KEY)) || []) : (mem || []); }
      catch(e){ return []; }
    },
    save(v){
      mem = v;
      try { if (ok) localStorage.setItem(CFG.STORE_KEY, JSON.stringify(v)); } catch(e){}
    }
  };
})();

/* θυμαται αν εχει ξαναμπει ο χρηστης — το καλωσορισμα παιζει μια φορα.
   Για να το ξαναδεις: σβησε το κλειδι απο τον browser, ή αλλαξε το SEEN_KEY. */
const Seen = {
  get(){ try { return localStorage.getItem(CFG.SEEN_KEY) === "1"; } catch(e){ return false; } },
  set(){ try { localStorage.setItem(CFG.SEEN_KEY, "1"); } catch(e){} }
};

/* === [10] ΚΑΤΑΣΤΑΣΗ ΠΑΙΧΝΙΔΙΟΥ ============================= */
const S = {
  screen: Seen.get() ? "count" : "welcome",
  msg: null,         // το κειμενο της οθονης-απαντησης στο καλωσορισμα
  playerCount: CFG.DEFAULT_PLAYERS,
  players: [],       // γεμίζει καθώς συστήνονται, ένας ένας
  pcol: [],          // το χρωμα της μαρκας καθε παιχτη
  ppat: [],          // το σχεδιο της μαρκας καθε παιχτη
  draftCol: 0,       // η μαρκα αυτου που γραφει τωρα
  draftPat: 0,
  palette: false,    // ανοιχτη η παλετα
  nameDraft: "",     // ο,τι εχει γραφτει, για να μη χανεται σε render
  opDraft: "",
  opPh: "",          // το τυχαιο παραδειγμα του πλαισιου αποψης
  scoring: CFG.DEFAULT_SCORING,
  penalty: CFG.DEFAULT_PENALTY,
  sendPick: [],      // ποιες αποψεις τσεκαρε το τραπεζι για τον φακελο
  topic: "ours",     // "ours" = δικες σας αποψεις, αλλιως ετοιμος φακελος
  folder: [],        // Ο ΦΑΚΕΛΟΣ — οσες αποψεις κρατησατε απο παλιες δικες
  showWho: false,    // φανερωθηκε ποιος το ειπε σε αυτον τον γυρο
  contraSecs: CFG.DEFAULT_TIME,

  opinions: [],      // [{id, text}] — ΧΩΡΙΣ σύνδεση με παίκτη
  nextId: 1,
  peakOps: 0,        // ποσες αποψεις ειχε το πολυ ο φακελος (για την προειδοποιηση)
  mine: 0,           // πόσες έγραψε ο τωρινός παίκτης στη σύσταση

  judge: -1,
  round: null,
  phase: "setup",    // "setup" = συσταση (οι αρχικες αποψεις), "play" = παιχνιδι
  roundsDone: 0,     // ποσοι γυροι εχουν κλεισει σε αυτο το παιχνιδι
  wins: [],          // ΟΙ ΝΙΚΕΣ ΤΟΥ ΠΑΙΧΝΙΔΙΟΥ, με τη σειρα των παιχτων
                     // (με θεσεις, οχι με ονοματα — αλλιως μηδενιζαν)
  recordStart: 0,    // απο πoιο πρακτικο ξεκιναει αυτο το παιχνιδι
  records: Store.load(),
  timer: null,
  writeReturn: "lastCall",
  againIdx: 0,       // ποσες αποψεις γραφτηκαν στο "ξανα"
  againLeft: 0,      // ποσοι παιχτες μενουν να γραψουν
  back: "count",
  rulesFrom: "count",   // σε ποια οθονη γυρναει το ΑΚΥΡΟ των κανονων
  extraFrom: "lastCall" // σε ποια οθονη γυρναει το ΑΚΥΡΟ της καταθεσης
};

const app = document.getElementById("app");
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mmss = s => Math.floor(s/60) + ":" + String(Math.floor(s%60)).padStart(2,"0");
const go = s => { stopTimer(); if (s !== S.screen) freshOp(); S.screen = s; render(); };
function stopTimer(){ if (S.timer){ clearInterval(S.timer); S.timer = null; } }
const nameOf = i => S.players[i];

/* === ΜΑΡΚΕΣ ==============================================
   Ενα σχημα για καθε ονομα: γεμισμα στο χρωμα του παιχτη με το
   σχεδιο του, διακεκομμενη ασπρη στεφανη, μαυρο περιγραμμα.   */
function swatch(ci, pi, o){
  o = o || {};
  const c = COLORS[(ci|0) % COLORS.length] || COLORS[0];
  const p = PATS[(pi|0) % PATS.length] || PATS[0];
  const sh = ["0 0 0 3px #000"];
  if (o.lift) sh.push("0 " + o.lift + "px 0 rgba(0,0,0,.45)");
  if (o.glow) sh.push(o.glow);
  return "display:inline-flex;box-sizing:border-box;align-items:center;justify-content:center;"
    + "padding:" + (o.pad || "6px 14px") + ";border-radius:" + (o.radius || "999px") + ";"
    + "background:" + p.css(c.fill) + ";color:" + c.ink + ";"
    + "font:700 " + (o.size || "15px") + "/1.2 var(--display);"
    + "border:" + (o.dash || 4) + "px solid #000;"
    + "box-shadow:" + sh.join(",") + ";text-shadow:none;"
    + (o.dim ? "opacity:.42;" : "") + (o.extra || "");
}
const pcol = i => S.pcol[i] == null ? 3 : S.pcol[i];
const ppat = i => S.ppat[i] == null ? 0 : S.ppat[i];
const chipName = (i, nm, o) =>
  `<span class="pchip" style="${swatch(pcol(i), ppat(i), o)}">${esc(nm)}</span>`;
const chip = (i, o) => chipName(i, nameOf(i), o);
/* δυο παιχτες δεν παιρνουν το ιδιο χρωμα */
function freeColor(){
  const free = COLORS.map((_,i)=>i).filter(i => S.pcol.indexOf(i) < 0);
  const pool = free.length ? free : COLORS.map((_,i)=>i);
  return pool[Math.floor(Math.random()*pool.length)];
}
const freshOp = () => { S.opPh = "Π.Χ " + OP_EG[Math.floor(Math.random()*OP_EG.length)]; };
freshOp();

/* βοηθητικά για τις ζωγραφιές */
/* Κάθε κουμπί παίρνει αυτόματα κλάση b-<ονομα>, π.χ. b-akyro, b-dinworko.
   Έτσι μπορείς να πειράξεις ΕΝΑ κουμπί παντού, από ένα σημείο στο CSS. */
const ibtn = (file, attr, cls) =>
  `<button class="ibtn b-${file.replace(".png","")} ${cls||""}" ${attr||""}><img src="${IMG}${file}" alt=""></button>`;
const art = (file, cls) => `<img class="art ${cls||""}" src="${IMG}${file}" alt="">`;
/* Το μεγαλο λογοτυπο ειναι κουμπι: το πατας, χλιμιντριζει. */
const logoArt = cls =>
  `<button class="ibtn" data-neigh="1" style="margin:0" aria-label="Κοντρα"
     >${art("logo-kontra.png", cls)}</button>`;

/* ΤΟ ΑΛΟΓΟ — παιζει καθε φορα που πατας το λογοτυπο.
   Κραταμε μικρη πισινα αντιγραφων, ωστε να μπορεις να το πατας
   συνεχεια χωρις να κοβεται ο προηγουμενος ήχος.           */
const Neigh = (() => {
  const pool = [], N = 4;
  let k = 0, ready = false;
  const build = () => {
    if (ready) return;
    ready = true;
    for (let i = 0; i < N; i++){
      const a = new Audio(IMG + "alogo.mp3");
      a.preload = "auto"; a.volume = .85;
      pool.push(a);
    }
  };
  return { play(){
    build();
    const a = pool[k = (k + 1) % N];
    try { a.currentTime = 0; a.play().catch(() => {}); } catch(e){}
  }};
})();
const badge = file => `<img src="${IMG}${file}" alt="">`;
const digitImgs = n => String(n).split("")
  .map(d => `<img src="${IMG}${DIGIT[+d]}.png" alt="${d}">`).join("");

/* πεδία κειμένου μέσα στα ζωγραφιστά πλαίσια */
const nameField = () => `
  <div class="field name">
    <input id="pname" placeholder="Π.Χ μακης τσελιος" maxlength="${CFG.MAX_NAME}"
           autocomplete="off" value="${esc(S.nameDraft)}">
  </div>`;
const opField = () => `
  <div class="field op">
    <textarea id="op" maxlength="${CFG.MAX_OPINION}" placeholder="${esc(S.opPh)}">${esc(S.opDraft)}</textarea>
  </div>`;

/* η παλετα: ανοιγει πανω απο την οθονη της συστασης */
function paletteHTML(){
  if (!S.palette) return "";
  const cells = COLORS.map((c, ci) => {
    const taken = S.pcol.indexOf(ci) >= 0, on = S.draftCol === ci;
    return `<button class="pcell" ${taken && !on ? "disabled" : ""} data-pickcol="${ci}"
      style="${swatch(ci, S.draftPat, { pad:"0", radius:"50%", dash:4, lift: on ? 0 : 4,
        glow: on ? "0 0 0 6px rgba(255,201,14,.9)" : "", dim: taken && !on,
        size:"20px", extra:"width:54px;height:54px;cursor:pointer;" })}"
      >${on ? "&#10003;" : taken ? "&times;" : ""}</button>`;
  }).join("");
  const pats = PATS.map((p, pi) =>
    `<button class="imgbtn ${S.draftPat === pi ? "" : "off"}" data-pickpat="${pi}">${p.name}</button>`).join("");
  return `
  <div class="modal">
    <div class="sheet">

   οθονη — οι νικητες διαλεγουν την εσχατη ποινη και τελος.      */
/* ΟΙ ΠΟΝΤΟΙ ΤΟΥ ΠΑΙΧΝΙΔΙΟΥ
   Κραταμε τις νικες σε δικο τους πινακα, με τη ΘΕΣΗ του καθε
   παιχτη. (Πριν μετρουσαμε με ονοματα — αν δυο ειχαν το ιδιο
   ονομα, η αν ξαναπαιζαν οι ιδιοι, οι ποντοι μηδενιζαν.)  */
function resetWins(){ S.wins = S.players.map(() => 0); }

function tallyEnd(){
  const mine = S.records.slice(S.recordStart);
  const ks = S.players.map((_,k)=>k);
  const wins = {};
  ks.forEach(k => { wins[k] = S.wins[k] || 0; });
  const top = ks.length ? Math.max.apply(null, ks.map(k => wins[k])) : 0;
  const low = ks.length ? Math.min.apply(null, ks.map(k => wins[k])) : 0;
  const champs = ks.filter(k => wins[k] === top);
  return { wins, mine, top, champs,
    losers: top === low ? [] : ks.filter(k => wins[k] === low),
    solo: champs.length === 1 ? champs[0] : null,
    order: ks.slice().sort((a,b) => wins[b] - wins[a]) };
}

  const t = tallyEnd();

/* Ολες οι αποψεις της παρτιδας: οσες εμειναν ζωντανες + οσες
   καηκαν στην πορεια, χωρις διπλα. Καθε μια με το «ποιος το ειπε»,
   ωστε να ταξιδεψει ακεραιη στον φακελο.                       */
function allOpinions(){
  const seen = {}, out = [];
  const push = (t, w) => { if (t && !seen[t]){ seen[t] = 1; out.push({ t: t, who: w || "" }); } };
  S.opinions.forEach(o => push(o.text, o.who));
  S.records.slice(S.recordStart).forEach(r => push(r.opinion, r.who));
  return out;
}

/* Ο ΦΑΚΕΛΟΣ
   Στη θεση των πρακτικων. Ο,τι κρατησε το τραπεζι στο τελος καθε
   παιχνιδιου μενει εδω — μονο οι αποψεις, τιποτα αλλο.          */
const Folder = {
  load(){ try { return JSON.parse(localStorage.getItem(CFG.FOLDER_KEY)) || []; } catch(e){ return []; } },
  save(v){ try { localStorage.setItem(CFG.FOLDER_KEY, JSON.stringify(v)); } catch(e){} },
  add(t, who){
    const s = (t || "").trim(); if (!s) return;
    const l = this.load();
    if (l.some(o => o.t === s)) return;
    l.push({ t: s, who: who || "", d: Date.now() });
    this.save(l);
  },
  drop(i){ const l = this.load(); l.splice(i, 1); this.save(l); },
  clear(){ this.save([]); }
};

/* ΕΤΟΙΜΕΣ ΑΠΟΨΕΙΣ (διασημων / πολιτικων / του δημιουργου)
   Ερχονται απο το ops.js, μπαινουν ανακατεμενες στη δικογραφια και
   παιζονται ΑΝΩΝΥΜΑ. Το ονομα φυλαγεται στο who και βγαινει μονο
   αν το ζητησει το τραπεζι, μετα την κοντρα.                     */
function devOps(){ return []; }
function readyDeck(id){
  const K = window.KONTRA_OPS || {};
  /* Ο φακελος του τραπεζιου: οσες κρατησαν απο παλιες δικες. */
  if (id === "folder") return S.folder.map(o => ({ t: o.t, who: o.who || "" }));
  const cat = (K.quotes || []).filter(c => c.id === id)[0];
  return (cat && cat.ops ? cat.ops : []).map(o => ({ t: o.t || o, who: o.who || "" }));
}
function loadReadyDeck(id){
  const ops = readyDeck(id);
  for (let i = ops.length - 1; i > 0; i--){
    const j = Math.floor(Math.random()*(i+1)), t = ops[i]; ops[i] = ops[j]; ops[j] = t;
  }
  S.opinions = []; S.nextId = 1;
  ops.slice(0, CFG.READY_DECK).forEach(o =>
    S.opinions.push({ id: S.nextId++, text: o.t, who: o.who, wave: 0, used: 0 }));
  S.peakOps = S.opinions.length;
}

/* === [12] ΛΟΓΙΚΗ =========================================== */

/* ποιοι ψήφισαν σε μια πλευρά */
function sideOf(side){
  return S.players.map((_,i)=>i).filter(i => S.round.vote[i] === side);
}

/* wave 0 = απο τη συσταση, wave 1 = μπηκε αργοτερα (ανωνυμη, αναπληρωση) */
function addOpinion(text){
  S.opinions.push({ id: S.nextId++, text: text, wave: S.phase === "setup" ? 0 : 1, used: 0 });
  if (S.opinions.length > S.peakOps) S.peakOps = S.opinions.length;
}

/* Οταν ο φακελος αδειαζει, ο δικαστης το βλεπει με κοκκινα.
   ΔΕΝ βγαινει αν το τραπεζι ξεκινησε ετσι κι αλλιως με 3 αποψεις —
   βγαινει μονο οταν εχουν καει και εχουν μεινει λιγες.
   Στην τελευταια: «η κοντρα... και οπου βγει».                 */
function lowDeck(){
  if (S.phase !== "play") return "";
  const n = S.opinions.length;
  if (n > CFG.LOW_DECK || S.peakOps <= CFG.LOW_DECK) return "";
  if (n <= 1) return `<p class="warn">Τελευταια αποψη &middot;<br>η κοντρα... και οπου βγει</p>`;
  return `<p class="warn">Μενουν ${n} αποψεις</p>`;
}

function beginGame(){
  S.phase = "play";
  S.roundsDone = 0;
  S.recordStart = S.records.length;
  resetWins();
  S.judge = 0;
  startRound();
}

/* ΣΕΙΡΑ: πρωτα οι αποψεις της συστασης, μετα οσες μπηκαν αργοτερα.
   Καμια δεν ξανατυχαινει πριν ακουστουν ολες οι υπολοιπες.        */
function pickOpinion(){
  const least = Math.min.apply(null, S.opinions.map(o => o.used || 0));
  let pool = S.opinions.filter(o => (o.used || 0) === least);
  const early = Math.min.apply(null, pool.map(o => o.wave || 0));
  pool = pool.filter(o => (o.wave || 0) === early);
  return pool[Math.floor(Math.random()*pool.length)];
}

function startRound(){
  /* Οταν παιχτει και η τελευταια αποψη — «η κοντρα... και οπου
     βγει» — η δικη απλα ληγει και βγαινει ο απολογισμος.        */
  if (!S.opinions.length){ S.screen = "theEnd"; return; }
  const op = pickOpinion();
  op.used = (op.used || 0) + 1;
  S.showWho = false;
  S.round = { op, vote:{}, mode:1, proSel:[], conSel:[],
              order:[], times:[], extra:[], onExtra:[],
              cur:0, opa:false, opaT:0, notes:"", winner:null };
  S.screen = "round";
}

function nextJudge(){ S.judge = (S.judge + 1) % S.players.length; }

/* ΞΑΝΑ ΑΠΟ ΤΗΝ ΑΡΧΗ, ΧΩΡΙΣ ΑΡΧΙΚΗ ΟΘΟΝΗ.
   Κρataei παιχτες, ποινη, χρονο και τις αποψεις που εμειναν.
   Ο δικαστης προχωραει, ωστε να μην ξαναρχισει ο ιδιος.        */
function playAgain(){
  stopTimer();
  if (!S.players.length) return go("count");
  /* Ο φακελος αδειαζει τελειως και ο καθενας βαζει απο μια
     καινουρια αποψη — οπως στη συσταση. Τα ονοματα, οι μαρκες,
     η ποινη και ο χρονος μενουν.                               */
  S.opinions = []; S.nextId = 1; S.peakOps = 0;
  S.phase = "setup";
  S.roundsDone = 0;
  S.recordStart = S.records.length;
  resetWins();
  S.round = null; S.mine = 0; S.opDraft = ""; S.againIdx = 0;
  S.againLeft = S.players.length;
  nextJudge();
  /* Ετοιμος φακελος: κανενας δεν γραφει τιποτα, μοιραζεται
     καινουρια δικογραφια και ξεκιναμε κατευθειαν.              */
  if (S.topic !== "ours"){
    loadReadyDeck(S.topic);
    beginGame();
    return render();
  }
  S.screen = "reIntro";
  render();
}

/* προεπιλογή μονομάχων: αν μια πλευρά έχει ακριβώς όσους
   χρειάζονται, μπαίνουν αυτόματα· αλλιώς διαλέγει ο δικαστής */
function prepareSelection(mode){
  const r = S.round;
  r.mode = mode;
  const pro = sideOf("pro"), con = sideOf("con");
  r.proSel = pro.length === mode ? pro.slice() : [];
  r.conSel = con.length === mode ? con.slice() : [];
}

/* σειρά ομιλίας: υπέρ, κατά, υπέρ, κατά... */
function buildOrder(){
  const r = S.round;
  r.order = [];
  for (let k = 0; k < r.mode; k++){
    r.order.push({ side:"pro", p:r.proSel[k] });
    r.order.push({ side:"con", p:r.conSel[k] });
  }
  r.times = r.order.map(() => S.contraSecs);
  /* extra[k]   = οσα δευτερολεπτα του εφαγε η διακοπη
     onExtra[k] = τρεχει τωρα τον εξτρα χρονο του                */
  r.extra = r.order.map(() => 0);
  r.onExtra = r.order.map(() => false);
  r.cur = 0;
}

function nextSpeaker(){
  const r = S.round;
  r.cur++;
  if (navigator.vibrate) navigator.vibrate(200);
  if (r.cur >= r.order.length) return go("verdict");
  render();
}

/* καταγραφή της δίκης — τροφοδοτεί τον απολογισμό και τον Φάκελο */
function fileRecord(){
  const r = S.round;
  S.records.push({
    n: S.records.length + 1,
    ts: Date.now(),
    judge: nameOf(S.judge),
    opinion: r.op.text,
    who: r.op.who || "",
    mode: r.mode,
    pro: r.proSel.length ? r.proSel.map(nameOf) : null,
    con: r.conSel.length ? r.conSel.map(nameOf) : null,
    winner: r.winner,
    notes: (r.notes || "").trim()
  });
  S.roundsDone++;
  /* Οι νικες μπαινουν ΚΑΤΕΥΘΕΙΑΝ στον πινακα, με θεσεις. */
  const team = r.winner === "pro" ? r.proSel : r.winner === "con" ? r.conSel : null;
  if (team) team.forEach(i => { S.wins[i] = (S.wins[i] || 0) + 1; });
}

function exportText(){ return ""; }

/* Το ρολόι ενημερώνει ΜΟΝΟ τα ψηφία, ώστε να μη χάνεται
   ό,τι γράφει ο δικαστής στις σημειώσεις εκείνη τη στιγμή. */
function tick(){
  const r = S.round;
  /* ΔΙΑΚΟΠΗ (ΟΠΑ): ο χρονος του ομιλητη παγωνει και οσο μιλαει
     ο αντιπαλος μαζευεται στο extra. Μολις τελειωσει ο βασικος
     χρονος, του επιστρεφεται ΟΛΟΣ ΜΑΖΙ, μια φορα.        */
  if (r.opa){
    r.opaT++;
    r.extra[r.cur] = (r.extra[r.cur] || 0) + 1;
    const el = document.getElementById("opaClock");
    if (el) el.textContent = mmss(r.opaT);
    const ex = document.getElementById("exNote");
    if (ex) ex.textContent = "+" + mmss(r.extra[r.cur]);
    return;
  }
  r.times[r.cur]--;
  if (r.times[r.cur] <= 0){
    r.times[r.cur] = 0;
    const ex = r.extra[r.cur] || 0;
    if (ex > 0 && !r.onExtra[r.cur]){
      r.extra[r.cur] = 0;
      r.times[r.cur] = ex;
      r.onExtra[r.cur] = true;
      if (navigator.vibrate) navigator.vibrate(120);
      return render();
    }
    return nextSpeaker();
  }
  const el = document.getElementById("curClock");
  if (el) el.textContent = mmss(r.times[r.cur]);
}
function runTimer(){ stopTimer(); S.timer = setInterval(tick, 1000); }

/* === [13] RENDER & ΣΥΜΒΑΝΤΑ ================================ */

/* το textarea παιρνει το υψος του κειμενου του, ωστε να μην
   κρυβεται ουτε μια γραμμη μεσα στο ζωγραφιστο πλαισιο */
function grow(el){
  if (!el) return;
  el.style.height = "auto";
  el.style.height = Math.max(el.scrollHeight, 120) + "px";
}
function growAll(){ app.querySelectorAll("textarea").forEach(grow); }

let lastScreen = null;
function render(){
  app.innerHTML = (V[S.screen] || V.count)() + paletteHTML();
  growAll();
  if (S.screen !== lastScreen){ app.scrollTop = 0; lastScreen = S.screen; }
  if (S.screen === "intro"){ const e = app.querySelector("#pname"); if (e) e.focus(); }
  if (S.screen === "more" || S.screen === "extra" || S.screen === "reIntro"){
    const e = app.querySelector("#op"); if (e) e.focus(); }
  syncSubmit();   /* μετα απο render, το κουμπι ξερει αν τα πεδια ειναι γεματα */
}

/* ενεργοποίηση του «Καταχώρηση» μόνο όταν έχουν γεμίσει τα πεδία */
function syncSubmit(){
  const btn = app.querySelector("[data-intro],[data-add-op],[data-reop]");
  if (!btn) return;
  const op = app.querySelector("#op");
  const nm = app.querySelector("#pname");
  const okOp = !op || op.value.trim();      /* χωρις πλαισιο αποψης, δεν το ζηταμε */
  const okNm = !nm || nm.value.trim();
  btn.disabled = !(okOp && okNm);
}

app.addEventListener("click", e => {
  const t = e.target.closest("[data-go],[data-start],[data-step],[data-secs],[data-intro],[data-add-op],[data-pass],[data-begin],[data-extra],[data-vote],[data-mode],[data-pick],[data-go-contra],[data-unanimous],[data-opa],[data-next],[data-win],[data-arch],[data-records],[data-clear],[data-finish],[data-end],[data-again],[data-home],[data-rules],[data-seven],[data-first],[data-bfast],[data-seen],[data-skiprefill],[data-scoring],[data-openpal],[data-closepal],[data-pickcol],[data-pickpat],[data-reop],[data-repass],[data-send],[data-sendgo],[data-topic],[data-topicgo],[data-who],[data-drop],[data-back],[data-neigh]");
  if (!t || t.disabled) return;
  const d = t.dataset;

  /* ΤΟ ΑΛΟΓΟ: το λογοτυπο χλιμιντριζει */
  if (d.neigh){ Neigh.play(); return; }

  /* ΤΟ ΒΕΛΑΚΙ ΠΙΣΩ
     Απο τα ονοματα προς τη θεματολογια: αδειαζουμε ο,τι γραφτηκε,
     αλλιως μενουν ονοματα απο αλλη θεματολογια.            */
  if (d.back){
    stopTimer();
    if (d.back === "topic" || d.back === "count"){
      S.players = []; S.pcol = []; S.ppat = [];
      S.opinions = []; S.nextId = 1; S.peakOps = 0;
      S.mine = 0; S.nameDraft = ""; S.opDraft = ""; S.palette = false;
      S.round = null; S.phase = "setup"; S.roundsDone = 0; S.wins = [];
      S.draftCol = freeColor(); S.draftPat = 0;
    }
    return go(d.back);
  }

  /* ληξη: πισω στην αρχικη οθονη, καθαρο τραπεζι */
  if (d.home){
    stopTimer();
    S.players = []; S.pcol = []; S.ppat = [];
    S.opinions = []; S.nextId = 1; S.peakOps = 0;
    S.round = null; S.phase = "setup"; S.roundsDone = 0;
    S.recordStart = S.records.length;
    S.wins = [];
    S.judge = 0; S.mine = 0; S.againIdx = 0;
    S.nameDraft = ""; S.opDraft = ""; S.palette = false; S.sendPick = [];
    S.topic = "ours"; S.showWho = false;
    S.draftCol = freeColor(); S.draftPat = 0;
    return go("count");
  }

  /* η μαρκα: χρωμα και σχεδιο, ιδια λογικη με την Κοντρα στα Γρηγορα */
  if (d.openpal){ S.palette = true; return render(); }
  if (d.closepal){ S.palette = false; return render(); }
  if (d.pickcol !== undefined){
    const ci = +d.pickcol;
    if (S.pcol.indexOf(ci) >= 0) return;
    S.draftCol = ci; return render();
  }
  if (d.pickpat !== undefined){ S.draftPat = +d.pickpat; return render(); }
  if (d.scoring){ S.scoring = d.scoring; return render(); }
  if (d.send !== undefined){
    const k = +d.send; S.sendPick[k] = !S.sendPick[k]; return render();
  }
  if (d.sendgo !== undefined){
    const all = allOpinions();
    if (d.sendgo === "all") all.forEach(o => Folder.add(o.t, o.who));
    else if (d.sendgo === "1") all.forEach((o, k) => { if (S.sendPick[k]) Folder.add(o.t, o.who); });
    S.sendPick = []; S.folder = Folder.load();
    return go("outro");
  }

  /* καλωσορισμα: παιζει μια φορα και δεν ξαναφαινεται */
  if (d.first !== undefined){
    if (d.first === "1") return go("breakfast");
    Seen.set(); return go("count");
  }
  /* ΜΟΝΟ το «δεν ξερω / δεν γνωριζω» τραβαει σχολιο. Τα αλλα
     πανε κατευθειαν στο τραπεζι, χωρις μεσολαβηση.              */
  if (d.bfast){
    if (d.bfast === "idk" || d.bfast === "idk2"){
      S.msg = { warn: "Σας παρακαλουμε, μην παρετε κατι προσωπικα..." };
      return go("msg");
    }
    Seen.set(); return go("count");
  }
  if (d.seen){ Seen.set(); return go("count"); }

  /* κανονες: κρata πού ήμασταν, για να γυρίσουμε εκεί */
  if (d.rules){
    if (S.screen !== "rules") S.rulesFrom = S.screen;
    return go("rules");
  }
  /* το 7αρι των κανονων: πορτα για την Κοντρα στα Γρηγορα */
  if (d.seven){ location.href = "kontra-grigora.html"; return; }

  /* πρώτη οθόνη */
  if (d.step){
    S.playerCount = Math.min(CFG.MAX_PLAYERS, Math.max(CFG.MIN_PLAYERS, S.playerCount + (+d.step)));
    return render();
  }
  if (d.secs){ S.contraSecs = +d.secs; return render(); }
  if (d.start){ return go("topic"); }

  /* ΘΕΜΑΤΟΛΟΓΙΑ: δικες σας αποψεις η ετοιμος φακελος */
  if (d.topic){ S.topic = d.topic; return render(); }
  if (d.topicgo){
    S.opinions = []; S.nextId = 1; S.peakOps = 0;
    if (S.topic !== "ours") loadReadyDeck(S.topic);
    S.draftCol = freeColor();
    return go("intro");
  }
  if (d.who){ S.showWho = true; return render(); }

  /* σύσταση */
  if (d.intro){
    const nmEl = app.querySelector("#pname"), opEl = app.querySelector("#op");
    const nm = nmEl ? nmEl.value.trim() : "";
    const op = opEl ? opEl.value.trim() : "";
    if (!nm || (opEl && !op)) return;
    S.players.push(nm); S.pcol.push(S.draftCol); S.ppat.push(S.draftPat);
    S.nameDraft = ""; S.opDraft = "";
    S.draftCol = freeColor();
    /* Ετοιμος φακελος: μονο ονοματα, χωρις γραψιμο. */
    if (!opEl) return go(S.players.length >= S.playerCount ? "lastCall" : "intro");
    addOpinion(op); S.mine = 1;
    return go("more");
  }
  if (d.addOp !== undefined){
    const op = app.querySelector("#op").value.trim();
    if (!op) return;
    addOpinion(op);
    S.opDraft = "";
    if (S.screen === "more"){ S.mine++; freshOp(); return render(); }
    if (S.writeReturn === "round"){ stopTimer(); nextJudge(); startRound(); return render(); }
    return go(S.writeReturn);
  }
  if (d.reop){
    const op = app.querySelector("#op").value.trim();
    if (!op) return;
    addOpinion(op); S.opDraft = ""; S.againIdx++;
    freshOp();
    const total = S.players.length * CFG.AGAIN_EACH;
    if (S.againIdx >= total) return go("lastCall");
    if (S.againIdx % CFG.AGAIN_EACH === 0){
      S.againLeft = S.players.length - (S.againIdx / CFG.AGAIN_EACH);
      return go("rePass");
    }
    return render();
  }
  if (d.repass){ return go("reIntro"); }
  if (d.pass){ return go(S.players.length >= S.playerCount ? "lastCall" : "intro"); }
  if (d.begin){ beginGame(); return render(); }
  if (d.extra !== undefined){ S.writeReturn = d.extra; S.extraFrom = S.screen; return go("extra"); }

  /* ο φακελος */
  if (d.records !== undefined){
    if (d.records) S.back = d.records;
    S.folder = Folder.load();
    return go("folder");
  }
  if (d.drop !== undefined){ Folder.drop(+d.drop); S.folder = Folder.load(); return render(); }
  if (d.clear){
    if (confirm("Να αδειασει ο φακελος;")){ Folder.clear(); S.folder = Folder.load(); }
    return render();
  }

  /* ακρόαση: μέτρημα χεριών */
  if (d.vote !== undefined){
    const i = +d.vote, cur = S.round.vote[i];
    S.round.vote[i] = cur === "pro" ? "con" : cur === "con" ? undefined : "pro";
    return render();
  }
  if (d.unanimous){ return go("archive"); }

  /* επιλογή mode -> οθόνη επιλογής μονομάχων */
  if (d.mode){
    const m = +d.mode;
    prepareSelection(m);
    const r = S.round;
    if (r.proSel.length === m && r.conSel.length === m){
      buildOrder(); go("contra"); return runTimer();
    }
    return go("select");
  }

  /* επιλογή μονομάχων: τσεκ / ξετσεκ, με όριο τον αριθμό του mode */
  if (d.pick){
    const [side, idx] = d.pick.split(":");
    const i = +idx, r = S.round;
    const sel = side === "pro" ? r.proSel : r.conSel;
    const at = sel.indexOf(i);
    if (at >= 0) sel.splice(at, 1);
    else if (sel.length < r.mode) sel.push(i);
    else { sel.shift(); sel.push(i); }      /* γεμάτο: βγαίνει ο παλιότερος */
    return render();
  }
  if (d.goContra){
    const r = S.round;
    if (r.proSel.length !== r.mode || r.conSel.length !== r.mode) return;
    buildOrder(); go("contra"); return runTimer();
  }

  /* κόντρα */
  if (d.opa !== undefined){
    S.round.opa = d.opa === "1";
    if (S.round.opa) S.round.opaT = 0;
    return render();
  }
  if (d.next){ return nextSpeaker(); }
  if (d.win){ S.round.winner = d.win; return go("sentence"); }

  /* αρχειοθέτηση */
  if (d.arch !== undefined){
    fileRecord();
    if (d.arch === "1"){
      S.opinions = S.opinions.filter(o => o.id !== S.round.op.id);
      if (!S.opinions.length) return go("theEnd");
      /* Ετοιμες αποψεις: κανενας δεν γραφει αναπληρωση —
         συνεχιζουμε με οσες εμειναν στη δικογραφια.        */
      if (S.topic !== "ours"){ stopTimer(); nextJudge(); startRound(); return render(); }
      return go("refill");
    }
    nextJudge(); startRound(); return render();
  }

  /* καηκε η αποψη και δεν μπαινει καινουρια: συνεχιζουμε με οσες εμειναν */
  if (d.skiprefill){
    stopTimer();
    nextJudge();
    if (!S.opinions.length){ S.screen = "theEnd"; return render(); }
    startRound();
    return render();
  }

  /* ληξη της δικης — μονο απο τον 3ο γυρο και μετα */
  if (d.finish){
    if (S.roundsDone < CFG.MIN_ROUNDS_TO_END) return;
    return go("finishAsk");
  }
  if (d.end){ return go("theEnd"); }
  if (d.again){ return playAgain(); }

  /* πλοήγηση */
  if (d.go) return go(d.go);
});

app.addEventListener("input", e => {
  const t = e.target;
  if (t.tagName === "TEXTAREA") grow(t);
  if (t.id === "pname") S.nameDraft = t.value;
  if (t.id === "op") S.opDraft = t.value;
  if (t.id === "op" || t.id === "pname") syncSubmit();
  if (t.id === "penalty") S.penalty = t.value;
  if (t.id === "notes" && S.round) S.round.notes = t.value;
});

/* === [16] APP MODE — ΚΛΕΙΔΩΜΑ ΣΕ ΜΙΑ ΟΘΟΝΗ ==================
   Οσο πιο κοντα γινεται σε εφαρμογη, μεσα σε browser:
   - καμια κινηση της σελιδας, κανενα zoom, κανενα pull-to-refresh
   - το «πισω» του κινητου ΔΕΝ βγαζει απο το παιχνιδι
   - fullscreen και οθονη που δεν σβηνει, στο πρωτο αγγιγμα
   Αν κατι απο αυτα δεν υποστηριζεται, απλα αγνοειται.          */
(function appMode(){
  const touch = matchMedia("(pointer:coarse)").matches;

  /* zoom με δυο δαχτυλα και διπλο ταπ */
  ["gesturestart","gesturechange","gestureend"].forEach(ev =>
    document.addEventListener(ev, e => e.preventDefault(), {passive:false}));
  document.addEventListener("dblclick", e => e.preventDefault(), {passive:false});
  document.addEventListener("contextmenu", e => {
    if (!/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) e.preventDefault();
  });
  /* τιποτα δεν κουναει τη σελιδα — σκρολαρει μονο το #app */
  document.addEventListener("touchmove", e => {
    if (!e.target.closest || !e.target.closest("#app")) e.preventDefault();
  }, {passive:false});

  /* το κουμπι «πισω» του Android γυρναει οθονη μεσα στο παιχνιδι */
  try {
    history.replaceState({k:0}, "");
    history.pushState({k:1}, "");
    addEventListener("popstate", () => {
      history.pushState({k:1}, "");
      if (S.palette)                   { S.palette = false; render(); }
      else if (S.screen === "rules")   go(S.rulesFrom);
      else if (S.screen === "folder")  go(S.back);
      else if (S.screen === "topic")   go("count");
      else if (S.screen === "extra")   go(S.extraFrom);
      else if (S.screen === "breakfast") go("welcome");
      else if (S.screen === "msg")      go("welcome");
    });
  } catch(e){}

  /* με κλειδωμενη σελιδα, το πληκτρολογιο μπορει να σκεπασει το πεδιο.
     Οποτε το φερνουμε μονοι μας μπροστα.                            */
  app.addEventListener("focusin", e => {
    if (!/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    setTimeout(() => {
      try { e.target.scrollIntoView({block:"center", behavior:"smooth"}); } catch(err){}
    }, 320);
  });

  /* fullscreen + οθονη αναμμενη, με το πρωτο αγγιγμα (μονο σε κινητο) */
  let wl = null, armed = false;
  async function keepAwake(){
    try { if ("wakeLock" in navigator) wl = await navigator.wakeLock.request("screen"); } catch(e){}
  }
  async function arm(){
    if (armed) return; armed = true;
    /* Μεσα σε app (Capacitor) το fullscreen και το κλειδωμα οθονης
       τα κανει το native — εδω θα εσκαγαν σιωπηλα. Τα ζηταμε μονο
       οταν τρεχουμε σε browser.                                    */
    if (touch && !window.Capacitor){
      try { await document.documentElement.requestFullscreen({navigationUI:"hide"}); } catch(e){}
      try { await screen.orientation.lock("portrait"); } catch(e){}
    }
    keepAwake();
  }
  addEventListener("pointerdown", arm, {once:true});
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && armed) keepAwake();
  });

  /* offline: δουλευει και χωρις ιντερνετ, σαν εφαρμογη.
     ΜΕΣΑ ΣΕ APP (Capacitor) ΟΧΙ: μετα απο update του APK μπορει να
     σερβιρει την παλια cache. Στο GitHub Pages συνεχιζει κανονικα. */
  if (!window.Capacitor && "serviceWorker" in navigator)
    addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();

S.folder = Folder.load();
render();
</script>
