    <div class="fill"></div>
    <div class="duo-btns">
      <button class="btn tmpl mid" data-sendgo="1" ${n ? "" : "disabled"}>${n ? "Βαλε " + (n === 1 ? "την" : "τις " + n) : "Διαλεξε"}</button>
      ${all.length ? `<button class="btn tmpl mid" data-sendgo="all">Ολες μεσα</button>` : ""}
    </div>
    ${ibtn("oxi.png",`data-go="${endScreen()}"`,"small")}`;
};

/* === [12] ΛΟΓΙΚΗ =========================================== */

function addOpinion(text){
  S.opinions.push({ id: S.nextId++, text: text, wave: S.phase === "setup" ? 0 : 1, used: 0 });
  if (S.opinions.length > S.peakOps) S.peakOps = S.opinions.length;
}

/* ΣΕΙΡΑ: πρωτα οι υποθεσεις της συστασης, μετα οσες μπηκαν αργοτερα. */
function pickOpinion(){
  const least = Math.min.apply(null, S.opinions.map(o => o.used || 0));
  let pool = S.opinions.filter(o => (o.used || 0) === least);
  const early = Math.min.apply(null, pool.map(o => o.wave || 0));
  pool = pool.filter(o => (o.wave || 0) === early);
  return pool[Math.floor(Math.random()*pool.length)];
}

function startRound(){
  S.autoNote = false;
  ensureDeck();
  if (!S.opinions.length){ manualEnd(); S.endInfo.byDeck = true; S.screen = endScreen(); return; }
  const op = pickOpinion();
  op.used = (op.used || 0) + 1;
  S.round = { op, mode:1, proSel:[], conSel:[], order:[], times:[], extra:[], onExtra:[],
              cur:0, opa:false, opaT:0, notes:"", pro:null, con:null, quip:"", pick:null, res:null };
  S.screen = "round";
}

/* Ο ΔΙΚΑΣΤΗΣ ΓΥΡΙΖΕΙ στους ορθιους. Αν μεινουν δυο, δικαζει
   καποιος απο τους ενορκους που εχουν βγει.                    */
function judgePool(){
  const a = alive();
  return a.length >= 3 ? a : S.players.map((_, i) => i).filter(i => S.out[i]);
}
function nextJudge(){
  const pool = judgePool(), n = S.players.length;
  for (let s = 1; s <= n; s++){
    const c = (S.judge + s) % n;
    if (pool.indexOf(c) >= 0){ S.judge = c; return; }
  }
}

const QUIPS = [
  "Ο εισαγγελεας ακονιζει επιχειρηματα. Η υπερασπιση ακονιζει νυχια.",
  "Παρακαλουνται οι ενορκοι να μην τρωνε πατατακια την ωρα της δικης.",
  "Ο δικαστης δηλωνει αμεροληπτος. Κανεις δεν τον πιστευει.",
  "Οποιος χασει κερναει καφεδες. Δεν το λεει ο κανονισμος, το λεω εγω.",
  "Το δικαστηριο υπενθυμιζει: οι φωνες δεν μετρανε ως επιχειρημα.",
  "Δυο μπαινουν, ενας βγαινει. Ο αλλος βγαινει απλα χαμενος.",
  "Η υπερασπιση ζηταει αναβολη. Απορριπτεται.",
  "Ο εισαγγελεας εφερε φακελο. Αδειο, αλλα τον εφερε.",
  "Οι ενορκοι ειναι ετοιμοι να κρινουν. Οπως παντα δηλαδη.",
  "Κινητα στο αθορυβο. Εκτος απο αυτο εδω, αυτο ειναι ο νομος."
];
const quip = () => QUIPS[Math.floor(Math.random() * QUIPS.length)];

/* ΔΙΠΛΩΜΑΤΙΚΗ: ο δικαστης μενει, εισαγγελεας και υπερασπιση
   βγαινουν στην τυχη αναμεσα στους ορθιους.                   */
function randomRoles(){
  const r = S.round, pool = shuffle(debaters());
  r.con = pool[0]; r.pro = pool[1]; r.quip = quip();
}
/* ΑΛΛΗ ΥΠΟΘΕΣΗ: η τωρινη γυριζει πισω ανεπαφη, βγαινει αλλη. */
function rerollCase(){
  const r = S.round, old = r.op;
  let others = S.opinions.filter(o => o !== old);
  if (!others.length){
    if (S.topic === "folder") return;
    dbDraw(3).forEach(t => S.opinions.push({ id: S.nextId++, text: t, wave: 2, used: 0 }));
    others = S.opinions.filter(o => o !== old);
  }
  if (!others.length) return;
  old.used = Math.max(0, (old.used || 1) - 1);
  const least = Math.min.apply(null, others.map(o => o.used || 0));
  const pool = others.filter(o => (o.used || 0) === least);
  const op = pool[Math.floor(Math.random() * pool.length)];
  op.used = (op.used || 0) + 1;
  r.op = op;
}
/* Η ΥΠΟΘΕΣΗ ΚΑΙΓΕΤΑΙ — ειτε παιχτηκε ειτε οχι. */
function burnCase(){
  S.opinions = S.opinions.filter(o => o.id !== S.round.op.id);
  S.played.push(S.round.op.text);
  S.roundsDone++;
}

/* === ΝΙΚΕΣ, ΖΩΕΣ, ΑΠΟΒΟΛΕΣ ================================== */
function winEnd(w, kind){
  const R = S.roles;
  const flowers = R && R.k != null && R.kT === w ? w : null;
  if (R && R.v != null && !S.vVoid && R.vT === w) return { kind: "vysma", champ: R.v, prot: w, flowers: flowers };
  return { kind: kind, champ: w, flowers: flowers };
}
function award(w, l){
  const r = S.round;
  S.wins[w] = (S.wins[w] || 0) + 1;
  r.res = { w: w, l: l, winsAfter: S.wins[w], lifeAfter: null };
  S.life[l] = Math.max(0, (S.life[l] || 0) - 1);
  r.res.lifeAfter = S.life[l];
  if (pointsMode() && S.wins[w] >= CFG.WINS){ S.endInfo = winEnd(w, "wins"); return; }
  if (S.life[l] <= 0) eliminate(l, false);
}
/* ΤΟ ΒΥΣΜΑ: αν παει να βγει ο δικος του, σηκωνεται το Βυσμα στη
   θεση του, φανερωνεται, και ο δικος του παιρνει μια ζωη παραπανω. */
function eliminate(i, byVote){
  const R = S.roles;
  if (R && R.v != null && !S.vVoid && R.vT === i && R.v !== i && !S.out[R.v]){
    S.out[R.v] = true; S.life[R.v] = 0; S.vVoid = true; S.vRevealed = true;
    S.life[i] = (S.life[i] || 0) + 1;
    S.outQueue.push({ kind: "bullet", who: R.v, saved: i });
    afterOut(R.v);
    return;
  }
  S.out[i] = true; S.life[i] = 0;
  S.outQueue.push({ kind: byVote ? "voted" : "out", who: i });
  afterOut(i);
}
/* ΤΟ ΚΟΜΠΛΕΞ: βγηκε ο στοχος του; κερδιζει επιτοπου. Βγηκε το
   ιδιο; Δεν ξανακερδιζει με τιποτα.                             */
function afterOut(i){
  const R = S.roles;
  if (R && R.k === i) S.kVoid = true;
  if (S.endInfo) return;
  if (R && R.k != null && !S.kVoid && R.kT === i){ S.endInfo = { kind: "komplex", champ: R.k, target: i, flowers: null }; return; }
  const a = alive();
  if (a.length === 1) S.endInfo = winEnd(a[0], "last");
}
function canVote(){
  const R = S.roles;
  if (!R || S.endInfo || S.votedThisTurn || alive().length < 3) return false;
  return (R.k != null && !S.kRevealed) || (R.v != null && !S.vRevealed);
}
function voteOut(){
  const v = S.vote, i = v.who;
  const right = roleOf(i) === v.role;
  if (right){
    if (v.role === "komplex"){ S.kVoid = true; S.kRevealed = true; }
    else { S.vVoid = true; S.vRevealed = true; }
  }
  S.votedThisTurn = true;
  const before = S.outQueue.length;
  eliminate(i, true);
  const last = S.outQueue[S.outQueue.length - 1];
  if (S.outQueue.length > before && last.kind === "voted") S.outQueue.pop();
  S.voteResult = { who: i, right: right, role: v.role };
  S.vote = null;
}
function manualEnd(){
  const ks = S.players.map((_, i) => i);
  const sc = i => pointsMode() ? (S.wins[i] || 0) * 100 + (S.life[i] || 0) : (S.out[i] ? 0 : 1000) + (S.life[i] || 0) * 100 + (S.wins[i] || 0);
  const top = Math.max.apply(null, ks.map(sc));
  const champs = ks.filter(i => sc(i) === top);
  S.endInfo = champs.length === 1 ? winEnd(champs[0], "manual") : { kind: "tie", champ: null, flowers: null };
}
const endScreen = () => (S.endInfo && (S.endInfo.kind === "komplex" || S.endInfo.kind === "vysma")) ? "roleWin" : "theEnd";

/* ΜΕΤΑ ΤΟ «ΚΑΗΚΕ!»: πρωτα οι εξοδοι, μετα το τελος, μετα
   αναπληρωση (με τα δικα μας) και η επομενη δικη.              */
function afterBurn(){
  stopTimer();
  if (S.outQueue.length) return go("exit");
  if (S.endInfo) return go(endScreen());
  if (S.topic === "ours") return go("refill");
  nextRoundGo();
}
/* ΨΗΦΟΣ ΑΠΟ ΤΗΝ ΕΔΡΑ: αν εφυγε καποιος απο την εδρα, ξαναστηνεται. */
function resumeAfterVote(){
  if (S.outQueue.length) return go("exit");
  S.voteFrom = null;
  if (S.endInfo) return go(endScreen());
  const r = S.round;
  if (S.out[S.judge] && alive().length >= 3) nextJudge();
  const broken = r.pro == null || r.con == null || S.out[r.pro] || S.out[r.con] || r.pro === S.judge || r.con === S.judge;
  if (!broken) return go("preview");
  if (S.set.mode !== "polites"){ randomRoles(); return go("preview"); }
  r.pro = null; r.con = null; return go("round");
}
function nextRoundGo(){ S.voteFrom = null; S.votedThisTurn = false; nextJudge(); startRound(); render(); }

/* === ΕΚΚΙΝΗΣΗ =============================================== */
function dealRoles(){
  S.roles = null; S.kVoid = false; S.vVoid = false; S.kRevealed = false; S.vRevealed = false;
  if (!rolesOn()) return;
  const idx = S.players.map((_, i) => i), sh = shuffle(idx.slice());
  const pick = ex => { const l = idx.filter(i => i !== ex); return l[Math.floor(Math.random() * l.length)]; };
  const k = S.kOn ? sh[0] : null;
  const v = S.vOn ? (S.kOn ? sh[1] : sh[0]) : null;
  S.roles = { k: k, kT: k == null ? null : pick(k), v: v, vT: v == null ? null : pick(v) };
}
function begin(){
  if (S.players.length < 5 && S.kOn && S.vOn) S.vOn = false;
  go("rolesSet");
}
function startGame(){
  dealRoles();
  S.life = S.players.map(() => CFG.LIVES);
  S.out = S.players.map(() => false);
  S.wins = S.players.map(() => 0);
  S.outQueue = []; S.endInfo = null; S.vote = null; S.voteResult = null; S.votedThisTurn = false;
  S.phase = "play"; S.roundsDone = 0; S.played = [];
  S.judge = S.startJudge % S.players.length;
  if (S.roles){ S.roleIdx = 0; S.handShow = false; return go("handoff"); }
  startRound(); render();
}
/* ΑΛΛΟ ΕΝΑ! — ιδιοι παιχτες, αλλες υποθεσεις. */
function playAgain(){
  stopTimer();
  if (!S.players.length) return go("count");
  S.opinions = []; S.nextId = 1; S.peakOps = 0; S.round = null;
  S.phase = "setup"; S.again = true; S.endInfo = null; S.outQueue = []; S.roles = null;
  S.startJudge = (S.startJudge + 1) % S.players.length;
  S.mine = 0; S.opDraft = "";
  if (S.topic === "folder"){ S.folder = Folder.load(); if (S.folder.length >= 3){ loadFolderDeck(); return go("lastCall"); } S.topic = "ours"; }
  if (S.topic === "ours"){ S.againIdx = 0; S.againLeft = S.players.length; return go("reIntro"); }
  S.pickFor = 0; prepOffer(); return go("passPick");
}
function resetAll(keepSetup){
  stopTimer();
  S.players = []; S.pcol = []; S.ppat = [];
  S.opinions = []; S.nextId = 1; S.peakOps = 0;
  S.round = null; S.phase = "setup"; S.roundsDone = 0;
  S.wins = []; S.life = []; S.out = []; S.roles = null; S.endInfo = null; S.outQueue = [];
  S.vote = null; S.voteResult = null; S.offer = []; S.offerPick = []; S.played = []; S.sendPick = [];
  S.judge = 0; S.startJudge = 0; S.mine = 0; S.againIdx = 0; S.again = false;
  S.nameDraft = ""; S.opDraft = ""; S.palette = false;
  if (!keepSetup) S.topic = "ours";
  S.draftCol = freeColor(); S.draftPat = 0;
}

/* σειρά ομιλίας: πρωτα ο εισαγγελεας, μετα η υπερασπιση */
function buildOrder(){
  const r = S.round;
  r.order = [];
  for (let g = 0; g < (S.set.rounds || 1); g++){
    for (let k = 0; k < r.mode; k++){
      r.order.push({ side:"con", p:r.conSel[k] });
      r.order.push({ side:"pro", p:r.proSel[k] });
    }
  }
  r.times = r.order.map(() => S.set.secs || CFG.DEFAULT_TIME);
  r.extra = r.order.map(() => 0);
  r.onExtra = r.order.map(() => false);
  r.cur = 0;
}
function nextSpeaker(){
  const r = S.round;
  r.cur++; r.paused = false;
  if (navigator.vibrate) navigator.vibrate(200);
  if (r.cur >= r.order.length) return go("verdict");
  render();
}
/* Το ρολόι ενημερώνει ΜΟΝΟ τα ψηφία, ώστε να μη χάνεται
   ό,τι γράφει ο δικαστής στις σημειώσεις εκείνη τη στιγμή. */
function tick(){
  const r = S.round;
  if (r.paused) return;
  if (r.opa){
    r.opaT++;
    r.extra[r.cur] = (r.extra[r.cur] || 0) + 1;
    const el = document.getElementById("opaClock");
    if (el) el.textContent = mmss(r.opaT);
    const ex = document.getElementById("exNote");
    if (ex) ex.textContent = "+" + mmss(r.extra[r.cur]);
    return;
  }
  r.times[r.cur]--;
  if (r.times[r.cur] <= 0){
    r.times[r.cur] = 0;
    const ex = r.extra[r.cur] || 0;
    if (ex > 0 && !r.onExtra[r.cur]){
      r.extra[r.cur] = 0; r.times[r.cur] = ex; r.onExtra[r.cur] = true;
      if (navigator.vibrate) navigator.vibrate(120);
      return render();
    }
    return nextSpeaker();
  }
  const el = document.getElementById("curClock");
  if (el) el.textContent = mmss(r.times[r.cur]);
}
function runTimer(){ stopTimer(); S.timer = setInterval(tick, 1000); }

/* === [13] RENDER & ΣΥΜΒΑΝΤΑ ================================ */
function grow(el){
  if (!el) return;
  el.style.height = "auto";
  el.style.height = Math.max(el.scrollHeight, 104) + "px";
}
function growAll(){ app.querySelectorAll("textarea").forEach(grow); }

let lastScreen = null;
function render(){
  app.innerHTML = (V[S.screen] || V.count)() + paletteHTML();
  growAll();
  if (S.screen !== lastScreen){ app.scrollTop = 0; lastScreen = S.screen; }
  if (S.screen === "intro"){ const e = app.querySelector("#pname"); if (e) e.focus(); }
  if (S.screen === "more" || S.screen === "extra" || S.screen === "reIntro"){
    const e = app.querySelector("#op"); if (e) e.focus(); }
  syncSubmit();
}
function syncSubmit(){
  const btn = app.querySelector("[data-intro],[data-add-op],[data-reop]");
  if (!btn) return;
  const op = app.querySelector("#op"), nm = app.querySelector("#pname");
  btn.disabled = !((!op || op.value.trim()) && (!nm || nm.value.trim()));
}

app.addEventListener("click", e => {
  const t = e.target.closest("button");
  if (!t || t.disabled) return;
  const d = t.dataset, r = S.round;

  /* ΤΟ ΑΛΟΓΟ: ΜΟΝΟ στο μεγαλο λογοτυπο και στο ΣΚΟΤΩΘΕΙΤΕ. */
  if (d.neigh){ Neigh.play(); return; }
  if (d.start){ Neigh.play(); return go("topic"); }

  if (d.back){ resetAll(true); return go(d.back); }
  if (d.home){ resetAll(false); return go("count"); }

  if (d.openpal){ S.palette = true; return render(); }
  if (d.closepal){ S.palette = false; return render(); }
  if (d.pickcol !== undefined){
    const ci = +d.pickcol;
    if (S.pcol.indexOf(ci) >= 0) return;
    S.draftCol = ci; return render();
  }
  if (d.pickpat !== undefined){ S.draftPat = +d.pickpat; return render(); }
  if (d.scoring){ S.scoring = d.scoring; return render(); }

  if (d.first !== undefined){
    if (d.first === "1") return go("breakfast");
    Seen.set(); return go("count");
  }
  if (d.bfast){
    if (d.bfast === "idk" || d.bfast === "idk2"){
      S.msg = { warn: "Σας παρακαλουμε, μην παρετε κατι προσωπικα..." };
      return go("msg");
    }
    Seen.set(); return go("count");
  }
  if (d.seen){ Seen.set(); return go("count"); }

  if (d.rules){ if (S.screen !== "rules") S.rulesFrom = S.screen; return go("rules"); }
  if (d.settings) return go("settings");
  if (d.set){
    const kv = d.set.split(":"), k = kv[0], v = kv[1];
    S.set[k] = v === "true" ? true : v === "false" ? false : (isNaN(+v) ? v : +v);
    Settings.save(S.set);
    return render();
  }

  /* ΠΡΙΝ ΤΑ ΟΝΟΜΑΤΑ */
  if (d.topic){ S.topic = d.topic; return render(); }
  if (d.rtog){
    const on = !S[d.rtog]; S[d.rtog] = on;
    if (on && S.players.length < 5) S[d.rtog === "kOn" ? "vOn" : "kOn"] = false;
    return render();
  }
  if (d.rolesgo) return startGame();
  if (d.topicgo){
    S.opinions = []; S.nextId = 1; S.peakOps = 0; S.again = false;
    S.folder = Folder.load();
    if (S.topic === "folder" && S.folder.length < 3) S.topic = "ours";
    if (S.topic === "folder") loadFolderDeck();
    S.draftCol = freeColor();
    return go("intro");
  }
  if (d.intro){
    const nmEl = app.querySelector("#pname"), opEl = app.querySelector("#op");
    const nm = nmEl ? nmEl.value.trim() : "", op = opEl ? opEl.value.trim() : "";
    if (!nm || (opEl && !op)) return;
    S.players.push(nm); S.pcol.push(S.draftCol); S.ppat.push(S.draftPat);
    S.nameDraft = ""; S.opDraft = ""; S.draftCol = freeColor();
    if (S.topic === "folder") return go("intro");
    if (S.topic === "ready"){ S.pickFor = S.players.length - 1; prepOffer(); return go("pick6"); }
    addOpinion(op); S.mine = 1;
    return go("more");
  }
  if (d.op6 !== undefined){
    const k = +d.op6, n = S.offerPick.filter(Boolean).length;
    if (S.offerPick[k]) S.offerPick[k] = false;
    else if (n < CFG.PICK_KEEP) S.offerPick[k] = true;
    return render();
  }
  if (d.op6rand){
    const keep = shuffle(S.offer.map((_, k) => k)).slice(0, CFG.PICK_KEEP);
    S.offerPick = S.offer.map((_, k) => keep.indexOf(k) >= 0);
    return render();
  }
  if (d.pick6go){
    if (S.offerPick.filter(Boolean).length < CFG.PICK_KEEP) return;
    commitPick();
    if (d.pick6go === "again"){
      if (S.pickFor < S.players.length - 1){ S.pickFor++; prepOffer(); return go("passPick"); }
      return go("lastCall");
    }
    if (d.pick6go === "begin") return go("lastCall");
    return go("intro");
  }
  if (d.passgo) return go("pick6");
  if (d.addOp !== undefined){
    const opEl = app.querySelector("#op"), op = opEl ? opEl.value.trim() : "";
    if (!op) return;
    addOpinion(op); S.opDraft = "";
    if (S.screen === "more"){ S.mine++; freshOp(); return render(); }
    if (S.writeReturn === "round") return nextRoundGo();
    return go(S.writeReturn);
  }
  if (d.reop){
    const opEl = app.querySelector("#op"), op = opEl ? opEl.value.trim() : "";
    if (!op) return;
    addOpinion(op); S.opDraft = ""; S.againIdx++; freshOp();
    const total = S.players.length * CFG.AGAIN_EACH;
    if (S.againIdx >= total) return go("lastCall");
    if (S.againIdx % CFG.AGAIN_EACH === 0){
      S.againLeft = S.players.length - (S.againIdx / CFG.AGAIN_EACH);
      return go("rePass");
    }
    return render();
  }
  if (d.repass) return go("reIntro");
  if (d.pass) return go("intro");
  if (d.extra !== undefined){ S.writeReturn = d.extra; S.extraFrom = S.screen; return go("extra"); }
  if (d.begin) return begin();
  if (d.rolepick){
    const keepK = d.rolepick === "k" || (d.rolepick === "rand" && Math.random() < .5);
    if (keepK) S.vOn = false; else S.kOn = false;
    return startGame();
  }
  if (d.show){ S.handShow = true; return render(); }
  if (d.handnext){
    S.handShow = false; S.roleIdx++;
    if (S.roleIdx >= S.players.length){ startRound(); return render(); }
    return render();
  }
  if (d.peek !== undefined){ S.peek = +d.peek; S.peekShow = false; return go("peek"); }
  if (d.peekshow){ S.peekShow = true; return render(); }
  if (d.peekdone){ S.peek = null; S.peekShow = false; return go("preview"); }

  /* ΤΟ ΔΙΚΑΣΤΗΡΙΟ */
  if (d.ready){
    if (S.set.mode === "polites") return go("eyes");
    randomRoles(); return go("preview");
  }
  if (d.burn || d.nodef){ r.pro = null; r.con = null; burnCase(); return go("burnt"); }
  if (d.pros !== undefined){ const i = +d.pros; r.con = r.con === i ? null : i; return render(); }
  if (d.def !== undefined){ const i = +d.def; r.pro = r.pro === i ? null : i; return render(); }
  if (d.reroll){ rerollCase(); return render(); }
  if (d.swap){ const x = r.pro; r.pro = r.con; r.con = x; return render(); }
  if (d.endask){ S.finishFrom = S.screen; return go("finishAsk"); }
  if (d.goContra){
    if (r.pro == null || r.con == null) return;
    r.mode = 1; r.proSel = [r.pro]; r.conSel = [r.con];
    buildOrder(); go("contra"); return runTimer();
  }
  if (d.opa !== undefined){
    r.opa = d.opa === "1";
    if (r.opa) r.opaT = 0;
    return render();
  }
  if (d.pause){ r.paused = !r.paused; return render(); }
  if (d.next) return nextSpeaker();
  if (d.vpick !== undefined){ r.pick = +d.vpick; return render(); }
  if (d.award){
    if (r.pick == null) return;
    award(r.pick, r.pick === r.pro ? r.con : r.pro);
    burnCase(); return go("sentence");
  }
  if (d.nowin){ r.pick = null; r.res = null; burnCase(); return go("sentence"); }
  if (d.burnt) return afterBurn();
  if (d.skiprefill) return nextRoundGo();

  /* ΕΞΟΔΟΙ & ΨΗΦΟΦΟΡΙΑ */
  if (d.exitnext){ S.outQueue.shift(); return S.voteFrom === "preview" ? resumeAfterVote() : afterBurn(); }
  if (d.vote){
    const R = S.roles;
    S.voteFrom = d.vote;
    S.vote = { role: (R.k != null && !S.kRevealed) ? "komplex" : "vysma", who: null };
    return go("vote");
  }
  if (d.vrole){ S.vote.role = d.vrole; return render(); }
  if (d.vwho !== undefined){ const i = +d.vwho; S.vote.who = S.vote.who === i ? null : i; return render(); }
  if (d.vcancel){ S.vote = null; return go(S.voteFrom === "preview" ? "preview" : "exit"); }
  if (d.vgo){
    if (!S.vote || S.vote.who == null) return;
    if (S.voteFrom !== "preview") S.outQueue.shift();
    voteOut(); return go("voteResult");
  }
  if (d.vdone){ S.voteResult = null; return S.voteFrom === "preview" ? resumeAfterVote() : afterBurn(); }

  /* ληξη της δικης — μονο απο τον 3ο γυρο και μετα */
  if (d.finish){
    if (S.roundsDone < CFG.MIN_ROUNDS_TO_END) return;
    S.finishFrom = S.screen;
    return go("finishAsk");
  }
  if (d.end){ manualEnd(); return go(endScreen()); }
  if (d.again) return playAgain();

  /* Ο ΦΑΚΕΛΟΣ */
  if (d.records !== undefined){
    S.back = d.records || S.screen; S.folder = Folder.load(); S.clearArm = false;
    return go("folder");
  }
  if (d.drop !== undefined){ Folder.drop(+d.drop); S.folder = Folder.load(); return render(); }
  if (d.clear){
    if (!S.clearArm){ S.clearArm = true; return render(); }
    Folder.clear(); S.folder = Folder.load(); S.clearArm = false; return render();
  }
  if (d.send !== undefined){ const k = +d.send; S.sendPick[k] = !S.sendPick[k]; return render(); }
  if (d.sendgo !== undefined){
    const all = allOpinions();
    if (d.sendgo === "all") all.forEach(t => Folder.add(t));
    else all.forEach((t, k) => { if (S.sendPick[k]) Folder.add(t); });
    S.sendPick = []; S.folder = Folder.load();
    return go(endScreen());
  }
  if (d.sendops){ S.sendPick = []; return go("sendOps"); }
  if (d.go) return go(d.go);
});

app.addEventListener("input", e => {
  const t = e.target;
  if (t.tagName === "TEXTAREA") grow(t);
  if (t.id === "pname") S.nameDraft = t.value;
  if (t.id === "op") S.opDraft = t.value;
  if (t.id === "op" || t.id === "pname") syncSubmit();
  if (t.id === "penalty") S.penalty = t.value;
  if (t.id === "notes" && S.round) S.round.notes = t.value;
});

/* === [16] APP MODE — ΚΛΕΙΔΩΜΑ ΣΕ ΜΙΑ ΟΘΟΝΗ ==================
   Οσο πιο κοντα γινεται σε εφαρμογη, μεσα σε browser:
   - καμια κινηση της σελιδας, κανενα zoom, κανενα pull-to-refresh
   - το «πισω» του κινητου ΔΕΝ βγαζει απο το παιχνιδι
   - fullscreen και οθονη που δεν σβηνει, στο πρωτο αγγιγμα
   Αν κατι απο αυτα δεν υποστηριζεται, απλα αγνοειται.          */
(function appMode(){
  const touch = matchMedia("(pointer:coarse)").matches;

  /* zoom με δυο δαχτυλα και διπλο ταπ */
  ["gesturestart","gesturechange","gestureend"].forEach(ev =>
    document.addEventListener(ev, e => e.preventDefault(), {passive:false}));
  document.addEventListener("dblclick", e => e.preventDefault(), {passive:false});
  document.addEventListener("contextmenu", e => {
    if (!/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) e.preventDefault();
  });
  /* τιποτα δεν κουναει τη σελιδα — σκρολαρει μονο το #app */
  document.addEventListener("touchmove", e => {
    if (!e.target.closest || !e.target.closest("#app")) e.preventDefault();
  }, {passive:false});

  /* το κουμπι «πισω» του Android γυρναει οθονη μεσα στο παιχνιδι */
  try {
    history.replaceState({k:0}, "");
    history.pushState({k:1}, "");
    addEventListener("popstate", () => {
      history.pushState({k:1}, "");
      if (S.palette)                   { S.palette = false; render(); }
      else if (S.screen === "rules")   go(S.rulesFrom);
      else if (S.screen === "peek")    { S.peek = null; go("preview"); }
      else if (S.screen === "vote")    go("exit");
      else if (S.screen === "folder")  go(S.back);
      else if (S.screen === "sendOps") go(endScreen());
      else if (S.screen === "topic")   go("count");
      else if (S.screen === "settings") go("count");
      else if (S.screen === "extra")   go(S.extraFrom);
      else if (S.screen === "breakfast") go("welcome");
      else if (S.screen === "msg")      go("welcome");
    });
  } catch(e){}

  /* με κλειδωμενη σελιδα, το πληκτρολογιο μπορει να σκεπασει το πεδιο.
     Οποτε το φερνουμε μονοι μας μπροστα.                            */
  app.addEventListener("focusin", e => {
    if (!/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    setTimeout(() => {
      const el = e.target, A = app.getBoundingClientRect(), B = el.getBoundingClientRect();
      const top = Math.max(0, app.scrollTop + (B.top - A.top) - (A.height - B.height) / 2);
      try { app.scrollTo({ top: top, behavior: "smooth" }); } catch(err){ app.scrollTop = top; }
    }, 320);
  });

  /* fullscreen + οθονη αναμμενη, με το πρωτο αγγιγμα (μονο σε κινητο) */
  let wl = null, armed = false;
  async function keepAwake(){
    try { if ("wakeLock" in navigator) wl = await navigator.wakeLock.request("screen"); } catch(e){}
  }
  async function arm(){
    if (armed) return; armed = true;
    /* Μεσα σε app (Capacitor) το fullscreen και το κλειδωμα οθονης
       τα κανει το native — εδω θα εσκαγαν σιωπηλα. Τα ζηταμε μονο
       οταν τρεχουμε σε browser.                                    */
    if (touch && !window.Capacitor){
      try { await document.documentElement.requestFullscreen({navigationUI:"hide"}); } catch(e){}
      try { await screen.orientation.lock("portrait"); } catch(e){}
    }
    keepAwake();
  }
  addEventListener("pointerdown", arm, {once:true});
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && armed) keepAwake();
  });

  /* offline: δουλευει και χωρις ιντερνετ, σαν εφαρμογη.
     ΜΕΣΑ ΣΕ APP (Capacitor) ΟΧΙ: μετα απο update του APK μπορει να
     σερβιρει την παλια cache. Στο GitHub Pages συνεχιζει κανονικα. */
  /* ΧΩΡΙΣ SERVICE WORKER: η εφαρμογη τρεχει απο τα δικα της αρχεια.
     Αν εμεινε παλιος απο προηγουμενη εκδοση, τον ξηλωνουμε μαζι με
     την cache του — αλλιως μπορει να σερβιρει παλια σελιδα.       */
  try {
    if ("serviceWorker" in navigator && navigator.serviceWorker.getRegistrations)
      navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(x => x.unregister())).catch(()=>{});
    if (window.caches && caches.keys)
      caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(()=>{});
  } catch(e){}
})();

render();
</script>
